OEMBnmdwRv7VU08euQthi2i","titre":"Méthodologie colles HGG.docx","dossier":"Partagé avec moi > Méthodo (HGG)","lien":"https://drive.google.com/file/d/1MZZvXAWVfOEMBnmdwRv7VU08euQthi2i/view","epreuves":["o-hgg","e-hgg"]},{"id":"1xrCcDVR8ebK3jmEEeN84brIpEz6h-mTo","titre":"Méthodologie Dissertation.docx (HGG, ESCP-HEC)","dossier":"Partagé avec moi > Méthodologie (HGG)","lien":"https://drive.google.com/file/d/1xrCcDVR8ebK3jmEEeN84brIpEz6h-mTo/view","epreuves":["e-hgg"]},{"id":"1Rnge3L4UYXVNK8HlUy8bhvbhCAnGaka1","titre":"Rapport-de-jury-HGG-ESCP-2015.pdf","dossier":"Partagé avec moi (HGG)","lien":"https://drive.google.com/file/d/1Rnge3L4UYXVNK8HlUy8bhvbhCAnGaka1/view","epreuves":["e-hgg"]},{"id":"139H8_M-9C0kejjfICaNBK22yiEe8TwsmxeU06ZUPoSg","titre":"Méthode de dissertation/Conseils (HGG)","dossier":"Partagé avec moi (HGG)","lien":"https://docs.google.com/document/d/139H8_M-9C0kejjfICaNBK22yiEe8TwsmxeU06ZUPoSg/edit","epreuves":["e-hgg"]},{"id":"1MwVMUduHFn3CTE8oHDb_hzC-eorXTmeo","titre":"Reprise oral HEC Europe.docx (questions posées à l'oral HGG HEC)","dossier":"Partagé avec moi (HGG)","lien":"https://drive.google.com/file/d/1MwVMUduHFn3CTE8oHDb_hzC-eorXTmeo/view","epreuves":["o-hgg"]}],"epreuves":{"e-maths":{"essentiel":["Numéroter chaque question en entier (8.a, pas « question a »), séparer les questions, aérer la copie.","Aucune interversion de limites automatique en ECG (série/intégrale, dérivation/somme infinie) : la justifier à la main en suivant l'énoncé.","Justifier chaque convergence de série utilisée ; « rigoureusement » dans l'énoncé = justifications précises attendues.","Comparer des termes généraux (séries) ou des intégrandes (intégrales), pas des sommes partielles ni des intégrales.","Une borne M obtenue par « continue sur un segment donc bornée » dépend a priori de N : pas de conclusion uniforme.","Chaque hypothèse de l'énoncé a un rôle précis : repérer où et comment elle sert.","Réponse donnée par l'énoncé : rédaction parfaitement détaillée, les « tentatives d'arnaques » sont sanctionnées."],"sections":[{"titre":"À savoir faire avant chaque DST","points":["Récurrence forte.","Suites adjacentes ; suites récurrentes linéaires d'ordre 2.","Trouver Ker(f) et Im(f).","Comparaison séries-intégrales.","Changement de variable dans l'intégrale.","Théorème de transfert (probas).","Analyse-synthèse ; raisonnement par l'absurde.","Preuve du raisonnement par récurrence (prendre le minimum d'un ensemble fini, etc.)."]},{"titre":"Lecture du sujet","points":["Suivre la logique de l'énoncé : les questions s'enchaînent (ex. continuité, puis C1, puis C-infini).","Un résultat de la question précédente indique souvent la direction à suivre pour la suivante.","Dans les exemples, chercher une expression explicite de la fonction (ex. fonction génératrice).","Repérer les notions hors programme introduites par l'énoncé et s'en tenir à leurs définitions."]},{"titre":"Rigueur de rédaction","points":["Ne pas confondre « il existe k » et « pour tout k ».","Récurrence : l'hérédité n'est jamais automatique, la justifier par le résultat précédent.","Cours : dérivée d'une somme finie de fonctions dérivables, rien sur une somme infinie.","Bonne définition d'une fonction n'implique pas sa continuité.","Distinguer fonction polynomiale (somme finie) et somme de série entière (somme infinie, pas forcément polynomiale).","Traiter à part les cas particuliers (x = 0 ; n = 0 : la dérivée de x -> x^n n'est pas n x^(n-1)).","Ne pas écrire une somme de série dont la convergence n'est pas acquise : elle n'a pas de sens.","Conclure sur une série par la définition de la convergence (limite finie des sommes partielles), pas en « passant à la limite » dans une égalité."]},{"titre":"Techniques à retenir","points":["lim u_n = 0 équivaut à lim |u_n| = 0 (immédiat par la définition, utile à mettre en valeur).","Si w_n > 0 à partir d'un rang et w_(n+1)/w_n -> 0 : à partir d'un rang M, w_(n+1)/w_n <= 1/2, d'où w_n <= w_M (1/2)^(n-M) (produit télescopique).","Pour conclure par majoration : comparer les termes généraux, le cours finit le travail.","La série de terme 1/n^2 converge pour n >= 1 (pas à partir de n = 0)."]},{"titre":"Présentation de la copie","points":["Mettre en évidence le numéro complet de chaque question, surtout quand elles sont traitées isolément.","Présentation aérée : de l'espace entre les étapes d'un raisonnement et entre les questions.","Bien séparer les questions pour que le correcteur n'oublie pas de mettre les points."]}],"pieges":["Intervertir intégrale et somme infinie, ou dérivation et somme, sans justification.","Majorer par une constante M qui dépend de N et conclure à une limite nulle.","Comparer des sommes partielles au lieu des termes généraux.","Croire que f_a est C-infini ou polynomiale « immédiatement ».","Écrire des choses très lourdes là où une primitive suffit (ex. intégrale de S_n' = [S_n]).","Fin de sujet (notions de 1re année) traitée très vite et sans réflexion faute de temps (DST 1)."],"conseils_profs":[{"qui":"Prof de maths, rapport du DST 1 (26/09/2026)","texte":"Dans la majorité des copies, le niveau de rigueur et de précision est encore à améliorer ; la présentation aussi."},{"qui":"Prof de maths, rapport du DST 1 (26/09/2026)","texte":"Le correcteur évalue en temps limité : numéros complets, copie aérée et questions séparées facilitent la lecture et l'évaluation."},{"qui":"Remarques sur le DS 1 ECG2 26/27","texte":"Mémoriser la démarche w_(n+1)/w_n -> 0 donc w_n <= w_M (1/2)^(n-M) : on la retrouve dans d'autres exercices."}],"temps":"","sources":["1o5lU3UZduxjdzSCLtJtUgV3K54t9Ezye","1a-Q97SELtR3sdc3hfHT43nmRdZ2A3o9S","13SHLEis4Mnqrf1y0yTHZVAk85eihdFj9"],"manque":""},"e-hgg":{"essentiel":["Définir TOUS les termes, en contexte (pas de définition Larousse), y compris les petits mots (et, ou, entre, face à, dans) et les dates : pourquoi ces dates ?","Remettre le sujet en entier dans l'intro ; les mots du sujet reviennent tout au long du devoir, surtout dans les titres de grandes parties.","Problématique propre à la période, qui pose un paradoxe et appelle explicitement le III ; bannir « dans quelle mesure ».","Démontrer, pas réciter : 1 phrase-idée = 4 à 6 faits précis ; bon sens, concret, aucune tournure philosophique abstraite.","Pas tout dire mais ne rien oublier d'important ; couvrir toute la période, profondeur historique, continuités et ruptures.","Annonce du plan très claire, voire lourde ; conclusion en 2 paragraphes (bilan qui répond, puis ouverture).","Carte : titre, légende ordonnée sur une page, territoires nommés, dynamiques et flux visibles."],"sections":[{"titre":"Analyse du sujet (brouillon)","points":["S'interroger sur les 3 dimensions : géopolitique, historique, géographique.","Mettre directement le sujet sous forme de question, puis reformuler encore et encore pour faire émerger toutes les questions sous-jacentes.","Analyser tous les mots : concepts, noms propres, dates, mots de liaison, ponctuation.","« et » = comparaison, mise en relation, cause-effet ; « ou » = comparaison, exclusion ; « face à » = confrontation ; « entre » = aller de l'un à l'autre, mettre sur le même plan ; « dans » = place et rôle dans un ensemble.","Fixer les limites chronologiques et géographiques et les champs (économique, social, diplomatique, militaire, environnemental) ; repérer les intitulés « faux amis ».","Penser aux verbes liés aux termes (ex. risque : y être exposé, le prendre, le surmonter, y être vulnérable).","Bon sens : qu'est-ce qui sauterait aux yeux du premier venu ? que veut-on démontrer ? où va-t-on ? en telle année, qu'y a-t-il ?","Polysémie ne veut pas dire sens contradictoires : rester réaliste, chercher les questions que posent les termes, pas des contradictions.","Sujet avec dates : pourquoi ces dates ? Sujet avec un point : prouver en quoi il est pertinent et interroger ses limites en III.","Se demander pourquoi le jury a posé ce sujet, quel débat d'actualité a pu l'inspirer.","Définir avec intuition, en commençant par les termes les plus urgents et les plus riches.","Ne pas dissocier artificiellement les termes en tension (ex. État puissant / État vulnérable) : chercher comment la tension s'articule."]},{"titre":"Problématique","points":["Pas une répétition du sujet : elle apporte une idée nouvelle, met en lumière un paradoxe.","Modèle : « Comment expliquer que les États-Unis se retrouvent régisseurs des relations internationales en 1945 alors qu'ils refusaient toute implication avant 1914 ? »","Elle questionne I et II tout en appelant explicitement le III.","Elle s'applique uniquement à la période considérée, à ce qu'elle a en propre (pas de tournure dans l'absolu).","Formes : « Pourquoi... alors que... ? », « Comment expliquer que... alors que... ? » ; au plus deux questions.","À éviter : paraphrase du sujet, « dans quelle mesure », « peut-on dire que », problématique vague ou évidente.","Une problématique conséquente annonce déjà la sélection d'exemples (sujet très vaste).","Les problématiques « à la marge » sont appréciées si elles sont précises et concrètes."]},{"titre":"Plan","points":["3 parties de 3 sous-parties, qui s'enchaînent avec logique et simplicité.","Plan chronologique : à bannir (METHODO) ; peu efficace à ESCP-HEC, possible à l'ESSEC (Méthodologie Dissertation).","Thématique PCJ : pourquoi, comment, jusqu'où (fondements, aspects, limites) ; rapide, efficace.","Chronologico-thématique : héritages, mutations, perspectives.","Dialectique pour un sujet en question : réponse la plus évidente (I), nuances (II), bilan et dépassement (III).","Comparaison : tout le développement tient de la comparaison ; piste notée : I convergences, II divergences, III qui s'en sort le mieux ; nuancer plutôt que trancher.","Marquer les ruptures et continuités de la période ; éviter « éco, puis commerce, puis militaire ».","Ne pas ouvrir sur ce qui contredit le sujet ; mettre en I la partie la plus rigoureuse et la plus nette.","Titres de parties = phrases rédigées qui, bout à bout, donnent la structure ; connecteurs de conséquence ou d'opposition, pas « tout d'abord, ensuite, enfin ».","Pas de III « donneuse de leçons » (« il faudrait que... »). Piste de III : une typologie des comportements."]},{"titre":"Introduction","points":["Rédigée au brouillon ; 1 page à 1 page et demie.","Accroche concrète qui amène directement le sujet (ex. plan quadriennal de l'Allemagne nazie), pas de généralité philosophique.","Contextualiser, surtout en intro et dans un I historique.","Remettre le sujet en entier : le correcteur doit pouvoir retrouver le libellé.","Définitions en contexte, enjeux, problématique, puis annonce du plan.","Annonce très claire, voire lourde : « Dans un premier temps nous verrons que... Puis, il s'agira d'expliquer que... Enfin, nous nous attacherons à montrer que... »"]},{"titre":"Développement","points":["Structure : [alinéa] chapeau = axe du I ; [alinéa] A ; [alinéa] B ; [alinéa] C ; [alinéa] conclusion du I / transition vers le II. Idem II et III.","Une sous-partie = la démonstration de sa première phrase, une phrase définitive.","1 phrase-idée = 4/5/6 faits : assumer la thèse (« j'affirme ça, et voilà en quoi la période me donne raison »).","Concision : pas de gras ; des idées sommaires qui ramassent des faits.","Logique exhaustive : pas tout dire, mais ne rien oublier d'important (grands dossiers, exemples canoniques) ; s'étendre à peu près uniformément sur la période.","Interprétation des faits, logique démonstrative : qu'est-ce que je veux prouver ?","Raisonner aux différentes échelles (de la ville au continent), lieux et territoires concrets.","Vocabulaire géopolitique précis (ex. autonomie stratégique) ; auteurs et ouvrages de référence, exemples originaux, espaces « oubliés ».","Blocs référence-exemple (ex. PAC – La fin des paysans) ; avec chaque référence, écrire à quoi elle sert.","Dimension prospective possible, sans démarche prescriptive."]},{"titre":"Conclusion","points":["À préparer avant de commencer la rédaction ; impérative (bâclée = pénalisée ; 3/4 des copies ont de mauvaises conclusions).","1er paragraphe : bilan qui répond à la problématique, sans répéter les titres de parties.","2e paragraphe : ouverture (période suivante, actualité, thème voisin ; comment la problématique se traduit ensuite)."]},{"titre":"Carte","points":["Titre obligatoire ; légende sur une seule page, ordonnée, réfléchie, pas trop d'items.","La légende n'est pas forcément le plan de la dissertation.","Éviter les grands blancs, nommer les territoires ; faire apparaître les dynamiques et les flux.","Pas de carte apprise par cœur sans lien avec le sujet ; renvoyer à la carte dans la dissertation."]},{"titre":"Forme et relecture","points":["Alinéas partout, identiques ; sauter des lignes seulement entre intro, parties et conclusion.","Pas d'abréviations ni d'anglicismes ; dates complètes (1939, pas 39) ; graphie soignée (relevé : « entre-deux-guerre », « guerre froide »).","Pas de futur historique dans le développement (toléré en transition ou fin de conclusion).","Affirmer : éviter « sembler », le conditionnel, « certains ».","Titres d'ouvrages soulignés, titres d'articles entre guillemets ; personne vivante : initiale du prénom + nom.","Une parenthèse de 3 lignes mérite une autre phrase ; aérer, pas de page monolithique.","Volume : environ 8 pages ; 5-6 pages, c'est trop court."]},{"titre":"Entraînement","points":["Rendre 1 plan par semaine.","Travailler les croquis.","Partie « termes géopo » dans le GDP ; préparer des blocs référence-exemple."]}],"pieges":["Prendre les termes du sujet tels quels sans les définir : hors-sujet, oublis, problématique squelettique (jury ESCP 2015).","Tournure trop abstraite, accroche généralisante et philosophique.","Exemples hors du cadre chronologique du sujet.","Négliger la dimension historique au profit du seul contemporain.","Récit factuel et journalistique, récitation du cours au lieu d'une démonstration.","I incohérent avec le sujet, III vague où l'on ne sait plus où l'on va.","Carte vide avec une légende nourrie."],"conseils_profs":[{"qui":"Correction TEI Toussaint 2025 (« La puissance au risque de la guerre », 8/20)","texte":"Bon : idées intéressantes, capacité à interroger le sujet, bonne expression. À améliorer : regard sur ce que la période a en propre, concrétiser, réfléchir davantage aux termes du sujet ; faire du II (le plus rigoureux) le I."},{"qui":"Nacho","texte":"À fond les termes géopo ; croquis ; blocs réf-exemples ; avec chaque réf écrire à quoi ça sert ; rendre 1 plan par semaine ; problématique qui annonce/englobe le III ; en intro, remettre le sujet en entier."},{"qui":"Correction khass HGG","texte":"Ne pas négliger la profondeur historique ; rendre compte des continuités et ruptures ; donner un aperçu de toute la période au prisme du sujet ; intro : ne pas être abstrait, en contexte."},{"qui":"Jury ESCP 2015","texte":"Attention soutenue et très discriminante aux définitions des termes ; absence fréquente de problématiques claires ; carte obligatoire (5 points), particulièrement discriminante."}],"temps":"","sources":["1yHBLPbCjSVWN7Ep1t3DwCgKlBm1k_WQzor903bA13eQ","1bPYC-nH4GTu-nFOIb7Z2RSbNS7BfHlmf","15dK6zHCuJLfKu69tP79sa-l_dhhGLspt","1_x1_jwr0Sq5c3XbooRhBYidfpB4SPYsD","1htZB62L6KbJPBnHoyOZirPvR9dG5PfKF","1MZZvXAWVfOEMBnmdwRv7VU08euQthi2i","1xrCcDVR8ebK3jmEEeN84brIpEz6h-mTo","1Rnge3L4UYXVNK8HlUy8bhvbhCAnGaka1","139H8_M-9C0kejjfICaNBK22yiEe8TwsmxeU06ZUPoSg"],"manque":""},"e-dissert":{"essentiel":["Traiter le sujet exact, tout le sujet, rien que le sujet : analyse lexicale de la formule précise (à HEC 2026, « À trop juger » : le « trop » est capital).","Définir avec précision le régime du terme clé (sinon pas de moyenne) ; les termes secondaires sont prioritaires : ils font la problématique et le plan.","Accroche analysée jusqu'à faire apparaître le problème ; jamais d'allusion, jamais de name-dropping.","Une pensée qui avance, pas un plan-étagère : chaque partie naît des limites de la précédente ; transition = objection nuancée et subtile.","Peu de références mais possédées : 2 par partie suffisent, sur un passage précis, qui font avancer le raisonnement ; la littérature est une pensée incarnée.","Langue = critère majeur : -1 point toutes les 10 fautes ; plan affiché (I, A, 1) sanctionné ; alinéas ; titres soulignés à la règle.","Conclusion qui répond enfin à la question posée en introduction."],"sections":[{"titre":"Analyse du sujet (brouillon)","points":["2 feuilles : exemples (tout ce qui vient) / analyse conceptuelle.","Écrire le sujet en rouge sur toutes les pages de brouillon ; ne jamais oublier le sujet dans son entièreté.","Définir précisément TOUS les termes : plus un terme est secondaire, plus on l'examine (article « une »/« la », copule, mode, nombre, construction grammaticale, double sens).","Polysémie (pour ne rien oublier), contraires à définir longuement (pour problématiser), termes voisins (pour la distinction conceptuelle).","Approfondir l'analyse même, et surtout, face à un sujet connu, déjà traité, « facile ».","Pour « Juger » : distinguer selon le sujet juger/connaître/comprendre, juger/condamner, juger/évaluer, droit/morale/art/politique, jugement déterminant/réfléchissant, de fait/de valeur, juger/préjuger.","Se demander : ce qu'est juger, qui juge, à quelles conditions, avec quelle légitimité, contre quels risques, dans quel domaine de validité.","La plupart des mauvaises notes d'élèves sérieux viennent d'une analyse impatiente qui mène au hors-sujet (Mme Kanban)."]},{"titre":"Problématique","points":["Née de l'étonnement devant l'intitulé : le problème intellectuel que le sujet oblige à penser.","Pas une simple question (sinon celle du sujet suffirait) : l'explication jusqu'au bout du problème ; plus c'est long et approfondi, mieux c'est.","Chaque difficulté rencontrée est à classer dans le plan, qui va de difficulté intellectuelle en difficulté intellectuelle.","Voir dans le sujet un problème qui intéresse tout le monde ; rester concret."]},{"titre":"Introduction","points":["Accroche de 10-15-20 lignes : quelque chose de concret et connu, qu'on aime (œuvre, film, parabole, exemple historique) sur le sujet PRÉCIS, avec 1 ou 2 définitions et LE problème, sans le résoudre.","L'accroche ne décore pas : l'analyser jusqu'au point où elle se retourne et fait apparaître le problème.","Le sujet doit figurer tel quel dans l'intro.","Définitions : pas de liste ; poser le sujet, déceler ses contradictions, introduire voisins et antonymes jusqu'à la problématisation.","L'intro explique ce que veut dire le sujet, pose le débat, montre la tension et annonce comment on va le résoudre."]},{"titre":"Plan","points":["Le plan est la conséquence de l'analyse du sujet, pas une liste d'idées.","1 grande partie = 1 thèse ; aller de la thèse la plus évidente (la plus simple à contester) à la plus complexe.","Dégager un problème à la fin de chaque grande partie, auquel la suivante répond ; ne pas passer à la partie suivante en changeant simplement de définition.","La III se déduit de I et II : classique mais pas bateau, subtile, toujours dans le sujet.","Canon 3 x 3 (parfois 3-2-3) ; mais pas d'obligation mécanique de 3 sous-parties ni d'équilibre philo/littérature dans chaque moment.","Reprendre TOUS les termes du sujet de I à III.","Thèse/antithèse seulement avec une transition subtile ; jamais oui / non / oui mais en partie."]},{"titre":"Rédaction du développement","points":["Chapeau de partie = idée directrice + analyse conceptuelle (comment on entend le sujet à ce moment) ; ne jamais y annoncer les sous-parties.","Les analyses conceptuelles reviennent tout le temps : retourner incessamment au sujet.","Distinctions conceptuelles pour éviter contradictions et imprécisions (ex. vérité, faux, mensonge, erreur), sans se reposer sur une apparente synonymie.","Expliquer, préciser, réexpliquer tout nouveau concept ou terme proche d'une notion du sujet.","Copie autoréflexive : reprendre ce qu'on vient de dire, compléter une définition, se faire objection.","Approfondir = poursuivre l'analyse au-delà du topo habituel et vague.","Cohérence des domaines au sein d'une grande partie (pas de la littérature à la science sans lien).","Être concret, ne pas être moralisateur ; ne pas écrire 4 fois la même phrase."]},{"titre":"Références","points":["Aucune attente quantitative : « agriculture intensive, pas extensive » (M. Touchet).","Références « travaillées intérieurement » : lues, comprises, aimées, appropriées ; un passage appris presque mot à mot mais pensé selon le sujet.","Partir d'un passage précis : que permet-il de comprendre, de formuler, d'objecter, de nuancer ?","Une référence peut revenir, s'approfondir, être reprise sous un autre angle ; faire dialoguer les références.","Littérature = pensée incarnée (scène, personnage, conflit) qui doit déplacer le problème, pas illustrer.","Jumeler les cours de philo et de littérature ; faire des duos de références (à faire valider par Mme Bouillot)."]},{"titre":"Transitions","points":["Obligatoires : elles montrent que le raisonnement progresse et reste cohérent.","Faire le point sur ce qu'on retient, sur le moment de la réflexion, et sur la nécessité d'une nouvelle étape.","Objection nuancée et subtile."]},{"titre":"Conclusion","points":["Apporter enfin une réponse à la question posée en introduction.","Bannir les conclusions du type « la réponse à cette question n'est pas claire »."]},{"titre":"Langue et présentation","points":["Environ 30 % des copies sanctionnées pour langue, présentation ou lisibilité ; -1 point toutes les 10 fautes.","Copies numérisées, 150-180 copies par correcteur : une copie illisible n'est presque pas lue (4 ou 5).","Dissertation entièrement rédigée : pas de I/II/III, 1)/2), schémas ni cartes mentales.","Alinéas ; titres d'œuvres et termes étrangers (même latin) soulignés à la règle ; chiffres et nombres en toutes lettres.","Orthographe, syntaxe, ponctuation, propreté : la grammaire est un indicateur de la pensée logique."]},{"titre":"Échelle de notation (jury HEC / EM Lyon)","points":["10-11 : contrat méthodologique rempli, mais pensée mécanique, illustrative, scolaire.","12-13 : enjeux compris, réflexion réelle, mais inégalités, transitions forcées, références pas encore maîtrisées.","14-15 : compréhension fine et nuancée, dialectique réelle, exemples bien choisis.","16-17 : progression forte, références précises et actives qui dialoguent, culture devenue personnelle.","18-20 : élégance, précision conceptuelle, originalité authentique."]},{"titre":"Préparation de l'année","points":["Rendre intros et plans à Mme Kanban ; envoyer intros, plans, analyses conceptuelles, accroches ; renvoyer le travail corrigé.","Relire les cours : le nombre de relectures est le marqueur le plus fiable de la maîtrise (Mme Kanban).","Lire les textes donnés et des classiques, pas des résumés de manuels ; garder une trace écrite (résumés, citations, impressions).","Exercice proposé : réduire un corrigé à une dissertation d'élève en 4 h avec 2 références par partie.","Se constituer une banque d'idées facilement mobilisable ; prendre plaisir à argumenter."]}],"pieges":["Réciter le cours sur la notion au lieu de traiter le sujet (copie de 29 pages, très mauvaise note).","Plan-étagère, juxtaposition, faux connecteurs (« d'abord », « ensuite », « enfin »), catalogue d'exemples.","Allusions, name-dropping, citations non analysées, auteurs caricaturés (Nietzsche), références passe-partout des manuels.","Confondre le sujet avec un sujet voisin (ex. « sauver les images » réduit à « sauvegarder »).","Préférer « la vraie question » au sujet posé.","III trop originale, arrogante ou sermonneuse ; hors-sujet.","Négliger les termes secondaires."],"conseils_profs":[{"qui":"M. Touchet, président du jury de CG (compte rendu d'un professeur, 2026)","texte":"La dissertation de CG n'est pas une récitation culturelle mais un exercice de pensée : traiter un sujet, tout le sujet, rien que le sujet. Le jury reconnaît immédiatement ceux qui pensent et ceux qui récitent."},{"qui":"Mme Kanban (Leçon n°1)","texte":"Une accroche qui ne produit pas le problème est un ornement ; votre lecteur et le jury s'en agacent. Ne négligez jamais les termes secondaires."},{"qui":"Mme Kanban (corrigé khass)","texte":"L'épreuve de CG n'est pas thématique mais une épreuve de méthode ; deux références suffisent dans chaque partie, car il faut les préciser et les approfondir."},{"qui":"Prof de philosophie (Bilan RJC concours CG)","texte":"La moyenne va à la copie qui traite réellement le sujet ; les très bonnes notes à celles qui définissent le régime du terme central, construisent une dialectique authentique et transforment la culture en pensée."},{"qui":"Correction TEI Toussaint 2025 (15+/20)","texte":"Distinguer précisément les concepts au fil du devoir ; bâtir une vraie démonstration ; utiliser davantage les bonnes références pour avancer, au-delà d'illustrer ; arrêter les conclusions évasives."},{"qui":"Jury HEC / EM Lyon 2025","texte":"L'année prochaine, pénalités pour l'orthographe, la syntaxe, la ponctuation et pour l'annonce chiffrée du plan (I, II, 1), 2))."}],"temps":"","sources":["1oPmjUeGYddvfPmsdXAxTkp1EQK-Oq0tw","1Odltn0-QwqhrtYf-X9Hq14CW6YU82lMe","1915j304cR2Iu0WrsUpJIjWGJj9DfaEC6","1eGj_Fuh89dkdU43HQ3ibalcyVP6LWRZF","1Tp9kh2BZtUtCRctojjJ24sMVSTR7rMV8","1Jlzc2Sf2ATbTrhCgWWww-XOGlMxvXfT-","1XNdm9SMhgvU5UWsqcAjJ7EZX9Dj_wmVDff6D4WYkUTI","1w_l1pW4SELOQsebA07Lp5gYUw3-yh4R9","1RlJeqaDKgI_BE5O_Mc_HyPvJXjSZS49l","1UV8Xk78ZEtszQ--3ugAU3nTXnEznsYieK9C0oykQaVc"],"manque":""},"e-synth":{"essentiel":["Première chose : trouver la tension, le problème majeur du dossier (« sur quoi me fait-on travailler ? »), avant de relever les idées.","QG : une ligne, question directe avec verbe conjugué, problématisée, fédératrice (3 textes), tous les enjeux ; pas de « comment ».","3 PC = questions avec verbe conjugué, éléments de réponse à la QG, fédérateurs, du plus simple au plus complexe ; PC1 = état des lieux, constat.","Confronter, jamais juxtaposer : A contre B + C, avec ce qui distingue B et C ; oser des rapprochements (y compris sur le ton).","Caractériser les postures (dénonce, ironise, s'enthousiasme, nuance...) : plus de « pense, dit, écrit, montre ».","Connecteurs logiques entre les PC (« enfin » et « finalement » n'en sont pas).","300 mots ±10 % ; décompte tous les 50 mots + total ; 4 alinéas, pas de conclusion."],"sections":[{"titre":"Analyse du dossier","points":["Quel type de dossier : collectif, individuel, politique, culturel... ?","Dates des textes : contemporains ou non ? période particulière ? travaille-t-on sur une évolution ?","Texte ancien + 2 contemporains = dossier classique (typique de l'ESCP) : se demander si la mise en perspective historique a du sens.","Paratexte : qui sont les auteurs (métier) → approche et prisme de chacun.","Identifier le thème avant de prendre en note les idées ; prendre le recul du concepteur.","Lexique commun = 1er indice ; puis le grain de sable commun (éléments incompatibles) et les éléments des textes qui s'y rapportent.","Postures clivées, inconciliables, ou simples différences de degré ? Même en cas d'opposition totale, chercher un point de convergence.","Cibler le champ du dossier (ex. les sociétés modernes) : une QG sur « l'humanité » en général serait trop vague."]},{"titre":"Étude des textes","points":["Dégager 5-6 idées par texte, puis les regrouper en 3 lignes de force sur le problème majeur.","Qualifier les approches : « dénonce », « observe que », « soutient », « plus pragmatique », « plus radical », « plus cynique / sceptique », « pousse l'analyse dans le champ psychologique / moral »...","Tableau indicatif QG / PC1-PC2-PC3 x texte A-B-C : toutes les cases doivent pouvoir être remplies.","Repérer le maximum d'arguments sans fausser les perspectives : toutes les positions n'ont pas le même poids.","C'est un travail d'analyse et d'interprétation, pas un résumé."]},{"titre":"Question globale","points":["5 conditions : forme canonique (question directe, verbe conjugué), problématisée, tous les enjeux du dossier, fédératrice, efficace (percutante).","Pas plus d'une ligne ; pas de « comment » ; formes notées : « Doit-on / Faut-il... ».","Repose sur une tension ; « dramatiser » l'enjeu ; ni titre, ni interrogative averbale, ni introduction développée.","Exemple de corrigé (ESCP 1990) : « Faut-il nécessairement prescrire le crime collectif au nom de la communauté ? »"]},{"titre":"Points de confrontation","points":["Chaque PC est une hypothèse de réponse, plus serrée que la QG, qui ouvre le paragraphe.","Fédérateur : il fait confronter les trois textes ; jamais un détail d'un seul texte.","Progression logique (diagnostic, origines, solutions...) sans plan figé.","Exemple (Synthèse 1) : PC1 « Le futur est-il prévisible ? » ; PC2 « Le progrès a-t-il encore du sens ? » ; PC3 « Sommes-nous condamnés à subir l'avenir ? »"]},{"titre":"Rédaction des paragraphes","points":["Être le secrétaire d'un débat : restituer de façon organisée la position de chaque participant.","Verbes introducteurs précis (« X et Y s'accordent sur... », « Mais X précise que... », « Z conteste l'idée selon laquelle... ») et caractérisation (« ironiquement », « moins polémique », « plus nuancé »).","Attribuer explicitement chaque idée à son auteur ; reformuler systématiquement.","« Sur ce point, A1 et A2 sont d'accord » puis une phrase par auteur : deux textes ne sont jamais interchangeables.","Forme idéale : une idée par auteur et par PC, en tension avec les deux autres.","Forme à 4 phrases : PC / auteur 1 / auteur 2 en désaccord / auteur 3 encore moins d'accord. Forme à 5 phrases : PC / auteur 1 / phrase commune 2 et 3 / auteur 2 / auteur 3.","Rotation : ne pas commencer les 3 PC par le même auteur ni garder le même ordre.","Une synthèse « épicée », osée : prendre des risques."]},{"titre":"Format et décompte","points":["300 mots ±10 % (270-330) ; QG et PC comptent ; viser la fourchette haute.","Prénom + nom = 1 mot ; « celui-ci » = 1 mot ; le « t » euphonique (a-t-on) ne compte pas.","Indiquer le décompte tous les 50 mots et le total.","4 alinéas (QG, PC1, PC2, PC3), sans saut de ligne entre les PC, pas de conclusion.","Écrire l'intitulé « étude et synthèse de textes » sur la copie."]},{"titre":"Langue et relecture","points":["Lexique précis, jouer de la nuance ; éviter les termes comme « impactés ».","Soigner graphie et présentation ; se relire."]},{"titre":"Pénalités (BCE)","points":["Absence de décompte total : -2 ; absence de décompte continu (tous les 50 mots) : -1.","Dépassement : 5 mots : -2 ; 10 mots : -3 ; jusqu'à 20 mots : -5 ; au-delà : note éliminatoire (1 ou 2/20). En DST : 332 mots pour 330 indiqués = -2.","Fautes : 4-6 : -1 ; 7-9 : -2 ; 10-12 : -3 ; au-delà : -4."]}],"pieges":["QG incomplète et non problématisée (2-3 enjeux seulement) ; « nécessairement » pointé comme cache-poussière (correction Synthèse 1, 2026), alors que le corrigé ESCP 1990 l'emploie.","PC non reliés, ou qui ne répondent pas à la QG.","Imposer le fil rouge d'un texte aux autres textes.","Juxtaposer les auteurs au lieu de les comparer.","Foncer tête baissée dans le relevé d'idées.","Ignorer l'écart historique entre un texte ancien et des textes contemporains.","Oublier le verbe conjugué ; style imprécis."],"conseils_profs":[{"qui":"Correction DST Synthèse 1 (2026, moyenne 9,2)","texte":"Identifier le champ du dossier ; QG PROBLÉMATISÉE ; PC reliés par des connecteurs logiques, chacun élément de réponse à la QG ; traduire le point de vue des auteurs (affiner le vocabulaire) ; pousser la confrontation : A contre B + C avec ce qui distingue B et C."},{"qui":"Mémo du Département de Lettres et Philosophie (ECG)","texte":"Il faut absolument une logique comparatiste ; considérez que vous êtes le secrétaire d'un débat."},{"qui":"Cours de synthèse (notes SYNTHESE - METHODO)","texte":"Pas une synthèse scolaire : une synthèse gonflée, osée, épicée ; rapprocher ce qui ne se rapproche pas."}],"temps":"Épreuve de 4 h.","sources":["1aWvCrjH7w4h-w2IWKUkAXOldSHwSXS58","1GAuhrj_57H-lpTTRv8fLWL6kXL52vLTB","1G1o38wKLa_lY_tBT5k5TYY9lPOqFmV7Zij3E1VRUa0E","1eGj_Fuh89dkdU43HQ3ibalcyVP6LWRZF","1zGS9hXYxVXHWMWu_zafVZTLcd1pIqhLdI4jwR5Ls4Nc","1d9CavfwmCGuZMuFAVW1WGloa-4tRWGAA01QQSJUCgbM","1ZuYs9ZIAqZwhSTKz7hPKC3BY2Emyzgl2","1N5jxYE0hrNpCggguB-nqzSCe9ECfnVsl3bOq8nLujGk"],"manque":""},"e-ang":{"essentiel":["Utiliser TOUS les documents et citer les sources.","Simplifier la langue pour gagner en clarté : l'anglais fait plus simple que le français.","RAC : il faut COM-PA-RER les textes 1 et 2.","Format ELVi LVB : 4 h libres ; RAC 250 mots ±10 % (30 %) ; essai 350 mots ±10 % (50 %) ; thème 150 mots (20 %).","Erreurs relevées à ne plus faire : « to backlash » n'existe pas ; to embody (pas « to incarnate ») ; « in the wake of » + événement ponctuel passé."],"sections":[{"titre":"Format de l'épreuve (fiche 0)","points":["ELVi LVB : corpus de 2 textes en anglais (1100 mots ±10 %), 1 texte français (250 mots), 2 documents iconographiques.","Q1 résumé analytique comparatif des textes 1 et 2 : 250 mots ±10 % (30 %).","Q2 essai argumenté : 350 mots ±10 % (50 %).","Thème : 150 mots extraits du texte français, a priori journalistique (20 %) ; corrigé par « tronçons » notés 6/5/3/1/0.","Ecricome : version ±200 mots (25 %), thème ±160 mots (25 %), essai 300 mots, 2 sujets dont un civilisationnel (50 %), 3 h."]},{"titre":"RAC (Q1)","points":["Comparer, ne pas juxtaposer ; plan texte 1 / texte 2 acceptable seulement s'il fait émerger points communs et divergences (commission ELVi, ESSEC 2024).","Pas de pénalité sans introduction, mais ne pas reformuler la question ni faire une intro longue et inutile (même source)."]},{"titre":"Essay (Q2)","points":["Utiliser tous les documents (le doc 4 manquait au TEI) et mentionner les sources.","Cadre commun ELVi : se référer à la totalité des documents ; l'usage des docs 1 et 2 doit se distinguer de la Q1 (commission ESSEC 2024, LVA).","Contenu pertinent, sujet traité : garder le juste équilibre entre richesse et clarté de la langue."]},{"titre":"Langue : erreurs relevées","points":["Pas « a President Trump crusading » ; to reflect / to be part of (pas « to hold on to ») ; to cave in to sth.","« Research being censored and weaponized means... » plutôt qu'une phrase alambiquée ; to struggle plutôt que « undergo hardship ».","Ubiquitous = qui est partout à la fois ; eventually ≠ possibly, potentially ; hypothesis / hypotheses.","A backlash on + to attack / infringe on / harm ; to cage = pour les animaux : to lock up, to silence.","« their views politically opposed to Trump's agenda » ; to face an issue (pas « to undergo an issue ») ; so-called (pas « commonly called »).","Sans article : UNESCO, independence of thought ; The First Amendment ; higher education ; in the long run.","To consider sth / doing sth ; to put sb at risk ; skeptic (nom) / skeptical (adj) ; scientific / a scientist ; an anti-vaxxer.","Synonymes : a stance, view, standpoint, viewpoint ; to reconcile two positions ; multi-faceted, compromising ; liberal."]}],"pieges":["Oublier un document.","Ne pas citer les sources.","Langue trop riche au détriment de la clarté (reproduire la complexité du français)."],"conseils_profs":[{"qui":"Correction TEI Toussaint 2025 (13,8/20)","texte":"Langue très riche, parfois au détriment de la clarté ; contenu pertinent et sujet bien traité ; mais le doc 4 n'apparaît pas et il faut mentionner les sources."}],"temps":"ELVi LVB : 4 h à gérer librement (fiche 0).","sources":["1mGyBI2U3I8qSYJtoj_Br5T3PU0pwdzeb","1dGBM6L4R1d3n2ri1mFYlYM2gpDFuwolc","1VM-Ib0wScZiok0J2hxRGz-N-Z6-Osmsr"],"manque":""},"e-all":{"essentiel":["Répondre à LA question posée (TEI : hors-sujet de A à Z) : mieux poser le problème, réutiliser les mots du sujet.","RAC : COM-PA-RER selon des critères généraux, résumé structuré, phrase d'introduction brève, 385 mots max ; aucun avis personnel.","Essai : utiliser TOUS les documents (3, 4, 5 ; 1 et 2 sans répéter la Q1) + au moins 2 exemples concrets de civilisation ; avis personnel argumenté ; ne pas annoncer son plan.","Ordre recommandé : essai (50 %) puis thème (20 %) ; si le RAC prend 2 h, arrêter et conclure.","Conclusion vitale : FINIR, FINIR, FINIR ; décompte exact (« XX Wörter + Zitate »).","Thème : faire passer le sens de façon idiomatique ; l'omission est la pire faute ; tout relire, traduire les intertitres en gras.","C'est le journaliste, pas le journal, qui défend une thèse ; varier les formules (der Journalist, die zweite Kolumnistin, der erste Verfasser...)."],"sections":[{"titre":"Format ELVi LVA (fiche 0)","points":["4 h à gérer librement ; 2 textes allemands (1350 mots ±10 %), 1 texte français (350 mots), 2 documents iconographiques.","Q1 résumé analytique comparatif des textes 1 et 2 : 350 mots ±10 % (30 %).","Q2 essai argumenté : 500 mots ±10 % (50 %), sur les docs 3, 4, 5 + au moins 2 exemples personnels de civilisation + éventuellement docs 1 et 2 sans répéter la Q1.","Thème : 200 mots extraits du texte français, a priori journalistique (20 %) ; corrigé par « tronçons » notés 6/5/3/1/0.","Expression écrite : 60 % langue, 40 % contenu ; sans respect de la méthode, pas la totalité des points de langue.","Barème LVB 2024 : Q1 et Q2 notées 12 pts langue/forme, 8 pts contenu."]},{"titre":"Gestion du temps","points":["Commencer par l'essai (50 %) puis le thème (20 %), recommandé par les jurys.","Ne pas paniquer : si le RAC prend 2 h, arrêter le développement et conclure (« Le POV du journaliste A est... et ce qui le distingue du journaliste B c'est... »).","Attention à la précipitation dans l'écriture (subordonnants mal placés)."]},{"titre":"RAC (Q1)","points":["La Q1 guide : y répondre sans la perdre de vue, même si elle paraît anecdotique ; ne pas la reformuler.","Résumé structuré ; articles comparés selon des critères généraux ; faire émerger points communs et différences.","Ne retenir que les informations pertinentes au regard de la question, pas un relevé exhaustif texte 1 puis texte 2.","Plan texte 1 / texte 2 acceptable seulement s'il fait émerger convergences et divergences.","Comprendre et décrire l'opinion des journalistes ; montrer qu'on a compris leurs exemples et leur évaluation.","Inutile d'indiquer les noms des journalistes ou les titres ; nom du journal seulement s'il donne un argument ; présenter brièvement un intervenant à la 1re mention (« die Wirtschaftsweise Ulrike Malmendier »).","Pas de Konjunktiv I systématique.","Conclusion : chercher la transition plutôt que se répéter (on déteste se répéter en allemand).","Formules de comparaison (fiche 37) : « Alors que le journaliste de la SZ affirme... », « Néanmoins, le second nuance ce propos », « Même si le document affirme que..., nous pouvons lire dans le second article que... »."]},{"titre":"Essai (Q2)","points":["Ne pas traiter une autre question ; ne pas répéter la Q1 ; si possible, l'ouverture de la conclusion de Q1 peut servir de transition vers Q2.","Référence claire aux documents ; les expliquer, les approfondir, pas seulement les mentionner ; souligner les documents.","Dates des documents : texte français souvent littéraire, valeur illustrative ou argumentative ?","S'appuyer sur les titres sans les citer.","Intro : pas de question rhétorique, ne pas annoncer son point de vue ni son plan.","Caricatures : intro, accroche, contre-argument ou conclusion (risque d'analyse superficielle) ; graphiques = faits, dans une grande partie.","Une idée, un exemple : les Allemands adorent les exemples, même du quotidien ; au moins 2 exemples développés de façon nuancée.","Montrer sa connaissance de l'actualité allemande et des débats du moment ; pas de cours récité, pas de remplissage.","Moins de blabla : un adjectif, pas quatre pour dire la même chose.","Bannir le « nous » de modestie : il n'existe pas en allemand.","Décompte : citations et (Dokument X) ne comptent pas ; indiquer « XX Wörter + Zitate »."]},{"titre":"Thème","points":["Faire passer du sens de la façon la plus idiomatique possible, sans être esclave du texte.","Se servir de « l'offre lexicale » des documents.","Traduire les intertitres en gras ; relire toute la copie pour ne rien oublier.","Barème (fiche 34) : 5 pts pour omission, syntaxe verbale, subordonnant faux, conjugaison de verbe fort/modal/auxiliaire, barbarisme ; 4 pts : verbe faible, confusion subordonnant/adverbe/préposition, comparatifs ; 3 pts : temps, mode, auxiliaire, modaux ; 2 pts : cas, préposition, place de sich/compléments/négation ; 1 pt : genre, déclinaison.","Dialogue (fiche 28) : pas de tirets ; guillemets „...“ ; incise comme en français (sagte er, antwortete er, fügte er hinzu...)."]},{"titre":"Langue : erreurs relevées","points":["größte (pas « Riesigste ») ; profitieren von ; eine Zumutung sein ; zwei Drittel ; die Ankunft ; hoffentlich ; von Anfang an.","Nach dem Krieg / Nachdem sie den Krieg erlebte ; eher ... als ; Mir scheint, dass (pas « Es erscheint ») ; als Konsequenz haben.","Une loi est verabschiedet / vom Bundestag gebilligt / in Kraft getreten (pas « passt ») ; weiterführen (poursuivre) ≠ verfolgen (poursuivre en justice) ; betreten (entrer).","angesichts (+G) plutôt que gegenüber pour « face à » ; behaupten = prétendre (préférer erklären) ; tatsächlich plutôt que in der Tat ; in dieser Hinsicht.","Nämlich jamais en 1re position ni juste avant le verbe ; sich le plus près possible du sujet ; Dazu n'est pas un connecteur : deshalb, außerdem.","Masculins faibles : der Journalist, die Afghanen ; n au datif pluriel ; pluriel habituel en -e (masc. et neutres).","Registre familier à éviter : gucken, die Tür knallen."]},{"titre":"Entraînement","points":["1 traduction par semaine ; révisions systématiques hebdomadaires (genre, verbes irréguliers, verbes à préposition fixe, subordonnants, comparatifs, relatives, passif).","Écouter la radio quelques minutes par jour (podcasts FAZ, Deutschlandfunk) ; lire la presse.","Construire un rapport personnel à l'actualité et se positionner.","Maîtriser la grammaire de base avant les structures complexes."]}],"pieges":["Croire que la question n'est pas importante et que c'est « juste un exercice de langue ».","Décompte erroné.","Annoncer son plan comme en dissertation ; question rhétorique en intro.","Mentionner les documents sans les exploiter ; en oublier un.","Répéter la Q1 dans la Q2 ; réciter ce qu'on sait d'un autre sujet (ex. migrations au lieu de l'économie, 2024).","Ne pas finir l'essai.","Faux amis anglais (I majuscule, meaning/Meinung, to read/reden...) et paronymes (seltsam/selten, Ergebnis/Ereignis, bereit/bereits, wurde/würde)."],"conseils_profs":[{"qui":"Correction TEI Toussaint 2025 (10,5/20)","texte":"Le travail est visible ; le problème est l'analyse du sujet : mieux poser le problème, réutiliser les mots du sujet, répondre à la question ; attention au décompte en fin d'épreuve ; moins de blabla."},{"qui":"Correction PALE 3 (15/11, « Die Debatte um Wehrdienst »)","texte":"Attention au temps ; RAC très bien compris et bien nuancé, intro +++, conclusion moins convaincante ; essai : la conclusion est vitale."},{"qui":"Mmes Habicht (HEC) et Klinge (ESSEC), commission LVA 2024","texte":"Un résumé analytique comparatif, pas une présentation du texte 1 puis du texte 2 ; en Q2, se référer aux documents et donner un avis personnel ; montrer sa connaissance de l'actualité et des débats allemands."},{"qui":"Jury allemand LVB ELVi 2024","texte":"Bien distinguer Q1 (reformuler les positions, aucun avis personnel) et Q2 (essai personnel, opinion argumentée, forme structurée)."}],"temps":"ELVi LVA : 4 h à gérer librement. Recommandé : essai (50 %) puis thème (20 %). Si le RAC prend 2 h, arrêter le développement et conclure.","sources":["1TiFDFvLx6P1GktGTQL1a8dXqJkSYZXqA","1dGBM6L4R1d3n2ri1mFYlYM2gpDFuwolc","114eF7pip07wapLK7JAX3NyfPp9Ic-hXd","1JYWbeDvhB1FFhOkjXcsZfCEuHyVEZhJi","1VGGjTic7G1TLP-R34QYrrAvaTsAWFtNE","1f2GTcCRlq_OyP2rZsNgxhUV8MFe6GoH_","1i2_z0j1qkwe52DKbzHwCgKge4-Y-OXhB","14iCTOcRYDczkj7nrT0znePUdW1jLobIt","1VM-Ib0wScZiok0J2hxRGz-N-Z6-Osmsr"],"manque":""},"o-maths":{"essentiel":[],"sections":[],"pieges":[],"conseils_profs":[],"temps":"","sources":[],"manque":"Aucun document de méthode pour l'oral de maths sur le Drive (seulement des documents sur les DST écrits)."},"o-hgg":{"essentiel":["10 minutes, jamais plus (10'05 au maximum pour finir une phrase) : très mal vu par les jurys d'HEC.","Intro 1'30 à 2'00 (1'45 idéal) ; parties 2'45 à 3'00 max ; fin du III à 9'30 ; 30 s de conclusion.","Noter le timing en bas de chaque grande partie et passer à la suite quand il est dépassé.","Définir TOUS les termes du sujet, même si c'est maladroit : non négociable.","Problématique : pas une répétition du sujet, une idée nouvelle, un paradoxe, qui appelle le III.","Respecter le cadre chronologique ; démarche démonstrative, pas récitative.","Exercice oratoire : être convaincant ; rester carré sur sa chaise, gestuelle canalisée."],"sections":[{"titre":"Préparation (30 min)","points":["10-15 min de conception du plan.","Rédiger l'intro en dernier, une fois le développement avancé ; l'accroche est la dernière chose qu'on trouve.","Équilibre entre les parties (3 x 3) : un plan clair compte plus que ses limites éventuelles."]},{"titre":"Introduction (1'30-2'00)","points":["Accroche qui tape au cœur du sujet, pointe un aspect ou une tension et transite naturellement vers les définitions.","Définitions en contexte (attention aux anachronismes ; des outils actuels peuvent servir à questionner le sujet).","Problématique : 1er jet = traduire les termes du sujet ; béquille « Comment expliquer... alors que... » ; bannir « Dans quelle mesure ».","Retour à la problématique orientée dans le sens de la démonstration : au bout des 3 parties, qu'a-t-on montré ?","Annonce du plan sans « nous » ni « je » ; à l'oral, les connecteurs logiques font office d'alinéas."]},{"titre":"Développement","points":["3 parties / 3 sous-parties.","Plan chronologique à bannir ; thématique PCJ (pourquoi, comment, jusqu'où) ; chronologico-thématique (héritage, mutations, perspectives) ; dialectique (sujet avec « ? ») ; comparaison.","PCJ : plan rapide et efficace, souvent à privilégier pour l'oral d'HEC (Méthodologie Dissertation) ; comparatif plus fréquent à l'oral.","Dialectique : P1 valide le sujet, P2 réfute ou nuance.","1 partie = 1 grande idée + 3 sous-idées qui la prouvent, avec des faits pour chaque argument.","Toujours évoquer le sujet ; mettre de l'ordre dans les arguments, clarté des explications."]},{"titre":"Conclusion (30 s)","points":["Répond plus directement à la problématique.","Pas de promesse : questionner ou trouver les limites d'une notion traitée.","Le futur n'est autorisé que dans l'ouverture ; ouverture jamais en forme de question."]},{"titre":"Entretien (10 min)","points":["L'exposé tend des perches que l'entretien approfondit.","Questions souvent factuelles et précises (exemples HEC Europe : pays fondateurs de la CEE, institutions du traité de Rome, dates d'élargissement, siège de la BCE, QG de l'OTAN, définitions démographiques).","L'entretien révèle une maîtrise superficielle : consolider et approfondir les connaissances."]},{"titre":"Posture et langue","points":["Candidat dynamique, investi dans son sujet.","Expression orale correcte (l'auto-correction sur « au final » a été appréciée).","Trouver le juste milieu entre le contact avec le jury et le débordement de gestes.","Attention à la langue."]}],"pieges":["Dépasser les 10 minutes.","Problématique plate après une bonne analyse introductive.","Exemples largement antérieurs au cadre chronologique.","Bouger trop sur sa chaise.","Plan chronologique ; récitation."],"conseils_profs":[{"qui":"Consignes khôlles HGG (SUIVI METHODO HGG)","texte":"C'est aussi un exercice oratoire, il faut se montrer convaincant. En ajustant ces détails (timing, définitions, problématique), vous ferez une vraie démonstration et les notes augmenteront."},{"qui":"Colleur, khôlle 2 (7/11, 10/20)","texte":"Analyse introductive bien menée mais problématique assez plate ; cadre chronologique mal respecté ; poursuivez l'effort de mise en ordre des arguments et veillez à la clarté de vos explications."},{"qui":"Colleur, khôlle 3 (17/11)","texte":"Bonnes connaissances, bonne problématisation, plan cohérent ; mais GESTION DU TEMPS : jamais plus de 10 min ; trop de mouvements."}],"temps":"Préparation 30 min (dont 10-15 min pour le plan) ; exposé 10 min : intro 1'30-2'00 (1'45 idéal), parties 2'45-3'00 max, fin du III à 9'30, conclusion 30 s ; puis 10 min d'entretien. (Ancienne fiche METHODO : intro ~1'30, ~2'30 par partie, conclusion ~1'.)","sources":["1_x1_jwr0Sq5c3XbooRhBYidfpB4SPYsD","1bPYC-nH4GTu-nFOIb7Z2RSbNS7BfHlmf","1MZZvXAWVfOEMBnmdwRv7VU08euQthi2i","1xrCcDVR8ebK3jmEEeN84brIpEz6h-mTo","1MwVMUduHFn3CTE8oHDb_hzC-eorXTmeo"],"manque":""},"o-csh":{"essentiel":["30 min de préparation, 10 min d'exposé, 10 min d'entretien : impossible et absurde de mobiliser 10 ou 15 références.","Partir de l'intitulé exact ; guillemets = une voix, un contexte d'énonciation : « qui pourrait dire cela ? dans quelles situations ? »","Définir avec précision (étymologie, synonymes, paronymes, antonymes, usages) ; éviter les contresens lexicaux.","Approfondir ses intuitions premières plutôt que construire des paradoxes artificiels.","Deux parties équilibrées et progressives valent mieux qu'une 3e partie brève et répétitive ; 3 parties possibles, mais sans 3 sous-parties.","Quelques références vraiment connues (passages précis), mises en dialogue avec le monde contemporain.","Entretien = second temps de l'épreuve, recherche commune de la vérité : compléter, nuancer, rectifier."],"sections":[{"titre":"Analyse du sujet","points":["Prendre le sujet au sérieux : une vraie invitation à réfléchir, pas un prétexte pour réciter.","S'interroger sur le langage : pourquoi tel terme, ce qu'il implique, quelle représentation du monde il suppose.","Réfléchir à partir des situations où l'on emploie l'expression (ex. « celui qui baisse les bras et soupire “à quoi bon ?” »), pas « Le à quoi bon ».","Ne pas chercher l'auteur d'une citation entre guillemets : ce n'est pas une devinette.","Déceler la nuance, l'ironie ou le scepticisme implicites ; aller au-delà de la lettre.","Dégager les enjeux d'une notion, sans en rester à la psychologie ou à la morale.","Même méthode qu'à l'écrit : intitulé exact, mots, contexte d'énonciation, problème, progression (M. Touchet)."]},{"titre":"Introduction et plan","points":["L'introduction analyse le sujet et pose le problème, au lieu de résumer le développement ou de se perdre en préambules.","Les remarques liminaires sont souvent bonnes : les déployer plutôt que s'en débarrasser dès la 2e partie.","Exposé équilibré et progressif ; le plan en trois parties n'est pas le seul moule."]},{"titre":"Références","points":["Authenticité d'abord : penser avec la culture réellement acquise, y compris cinéma, musique, arts.","Connaître une œuvre = pouvoir citer des passages précis, en parler plusieurs minutes, motiver une interprétation (pas seulement l'intrigue et les personnages).","Choisir des exemples ajustés au sujet, plutôt qu'ajuster ses exemples ; vérifier qu'ils couvrent bien le champ du sujet.","Ne pas plier une œuvre à l'argumentation (contresens relevés : Madame Bovary, La Princesse de Clèves, Julien Sorel, Sisyphe).","Relier les références aux enjeux économiques, sociaux, politiques, environnementaux contemporains quand c'est possible.","Une seule référence très bien exploitée vaut mieux que cinq énumérées.","Ne pas réfléchir uniquement à travers la littérature : penser aussi les autres domaines (coutume, vie sociale...)."]},{"titre":"Entretien","points":["Pas un entretien de personnalité où l'on affirme ses convictions.","Savoir revenir sur son propos grâce à une question, le compléter, le rectifier : cela peut compenser un exposé faible.","Rebondir pour s'ouvrir à des pistes non abordées, sans renier tout son propos."]},{"titre":"Préparation de l'année","points":["Faire le point sur ses ressources les plus riches (parcours, goûts), pas des fiches apprises les derniers jours ; quelques séries récentes ne suffisent pas.","Couples de références à faire à deux ; banque d'idées."]}],"pieges":["Désinvolture face au sujet ou à l'échange.","Réciter une réflexion prédéterminée ou égrener des références canoniques.","Confusions lexicales (débattre / se débattre ; « coagulation » pour « coexistence »).","Concepts à la mode employés sans justification (ex. « ipséité »).","Exemples hors du champ du sujet (Napoléon, Pétain, Hitler pour « Malheureux le pays qui a besoin de héros »).","Organisation peu rigoureuse au sein des parties."],"conseils_profs":[{"qui":"Jury HEC CSH 2025","texte":"La réussite tient d'abord au fait de prendre le sujet au sérieux ; la référence n'est pas un ornement mais le moteur d'une argumentation. Faire preuve d'honnêteté intellectuelle et faire avec la culture dont on dispose réellement."},{"qui":"M. Touchet (compte rendu d'un professeur)","texte":"À l'oral d'HEC, le jury attend la même chose qu'à l'écrit : analyse précise du sujet, problématisation pertinente, parcours qui avance, quelques références véritablement possédées."},{"qui":"Colleur, khôlle 3 (26/11, « La tradition », 10/20)","texte":"Bonne intro ; réflexion pertinente mais limitée à la littérature, passe à côté de domaines essentiels (coutume, vie sociale) ; travailler l'organisation et la cohérence au sein des grandes parties."}],"temps":"Préparation 30 min ; exposé 10 min ; entretien 10 min.","sources":["14bOWlOLpvEuiOxjSvgjfaBx-cVVFTLuH","1oPmjUeGYddvfPmsdXAxTkp1EQK-Oq0tw","1Odltn0-QwqhrtYf-X9Hq14CW6YU82lMe","1Tp9kh2BZtUtCRctojjJ24sMVSTR7rMV8","1UV8Xk78ZEtszQ--3ugAU3nTXnEznsYieK9C0oykQaVc"],"manque":""},"o-entretien":{"essentiel":["But : montrer sa compatibilité avec l'école, se vendre, donner envie de nous prendre : ADAPTER SON DISCOURS À L'ÉCOLE.","Présentation de 2 min (chronométrée à l'ESCP) = bande-annonce : nom, âge, prépa, passions/activités, expérience de l'entreprise et de l'étranger, motivation pour l'école.","3 pièges : réciter par cœur, « tunneliser » le jury (trop d'infos), partir dans tous les sens.","Un fil conducteur qui traverse tout ce qu'on a fait ; transformer un détail, une particularité en métaphore.","Personnaliser ses réponses (banque d'anecdotes) ; montrer qu'on sait se projeter (vie, carrière, conception du travail).","Fin : « Avez-vous une question ? » → OUI, à l'un des membres du jury ; pas de résumé de soi.","Savoir dire pourquoi l'école en 3 arguments (cours, formations, associations)."],"sections":[{"titre":"Formats et coefficients","points":["En général 20-25 min ; ESSEC 45 min ; EDHEC 2-3 h (trilogie collective) ; Skema : CV projectif.","ESCP : 25 min ; jury de 3 (membre de l'administration, diplômé récent, représentant du monde de l'entreprise).","Coefficients : ESCP 12/60 ; ESSEC 1/3 de l'admission ; EDHEC 15/25 ; EM 9/12."]},{"titre":"Questionnaire","points":["4 familles de questions : qui on est ; parcours et projet ; activités (réussites et échecs) ; centres d'intérêt.","Pour chaque activité : ce qu'on y cherche et ce qu'on y trouve.","Le jury y lit : richesse de la personnalité, adéquation du profil à l'école, curiosité et envie d'avancer, analyse de ce que chaque élément nous apporte.","ESCP, Q3 (expériences du monde du travail) : tirer profit des stages, bénévolat, jobs ; les projeter vers l'entreprise ; dire ce qui a plu ou non (réflexion pour la suite) ; montrer l'appétence pour l'entreprise.","ESCP, Q6 (autres informations) : montrer la motivation pour l'ESCP (cours, formations, associations, vus sur le site).","Envoyer le questionnaire la veille de la colle ; tendre des perches sans tout dire."]},{"titre":"Présentation (2 min)","points":["Donner envie au jury de nous connaître : bande-annonce, menu, sommaire.","Cibler ce qui nous définit et ce dont on veut parler.","Trame possible : point de départ → envie → expérience → motivation.","Exemple-modèle ESCP (Ginette) : une passion fil rouge → compétences acquises → immersion pro → secteur visé → motivation pour l'école."]},{"titre":"Entretien","points":["Rebondir sur le jury, lui poser des questions ; être original.","Personnaliser chaque réponse avec une anecdote.","Se demander : que vais-je faire à l'ESCP ? comment puis-je faire rayonner l'école ?"]},{"titre":"Questions à préparer","points":["3 qualités.","3 défauts vrais, illustrés, déjà travaillés : « Mon défaut, c'est __. Je l'ai vu dans __. Depuis, je __ et aujourd'hui l'impact c'est __. »","Questions de portrait : personnalité publique, écrivain, animal..."]},{"titre":"Fin d'entretien","points":["Ne pas faire un résumé de soi ; lancer sur une dernière notion.","Poser une question à l'un des membres du jury."]},{"titre":"Valeurs des écoles","points":["ESCP : Excellence, Singularité, Créativité, Pluralité ; double culture, travail en groupe, débouchés vers les métiers de la culture ; pas de projet pro abouti attendu, mais une appétence pour l'entreprise.","ESSEC : éthique, management, travail sur l'humain.","HEC : généraliste, plus théorique."]}],"pieges":["Apprendre sa présentation par cœur (ne pas en donner l'impression).","Assommer le jury d'informations.","Partir dans tous les sens, sans fil conducteur.","Répondre « non » à « question à poser ? »."],"conseils_profs":[{"qui":"Drouet","texte":"« SOYEZ SEXY ! » : en 2 min, donner envie de nous connaître."},{"qui":"Annotation sur mon pitch ESCP","texte":"Ajoute élément de personnalité, apport, plus de concret peut-être."}],"temps":"En général 20-25 min ; ESSEC 45 min ; EDHEC 2-3 h ; ESCP 25 min dont une présentation de 2 min chronométrée.","sources":["1J-GZDjzYWrcG6wc3akJvSCRcnl0OFgH41tETVH4jfXw","1amskvM-3dtFVvD0d2-TkJPk4K4-cC9cCbKcEKLlyjs8","1QA3Qru5ClPmbpFz_PKIGUj0fz2RSm9OXpA0spdey1OA","1efjr_oObrsrr_pw9v_TtTKienXHKWkKfCICC2buGSKE","1z7Asfcgp14klxQ7S3TWBcEL42pwc1xjHEtri0r7xKCA"],"manque":""},"o-trip":{"essentiel":["Mot-clé : INTERACTION, pas opposition : faire progresser la réflexion ensemble.","Convaincant : posture immédiate (« Je défendrai mon point de vue en X arguments »), dire « Je pense » ; garder 1 argument en réserve pour le débat ; pas de conclusion.","Répondant : « Vous avez défendu que... » + positionnement immédiat (« Je pense que... ») en 50 s max ; décaler sur d'autres plans (politique, moral...).","Conclusion obligatoire à 4'30 ; convenir avant de qui conclut ; utiliser les 5 min en entier.","4 erreurs : le contre par principe, répéter le convaincant, improviser sans trame (jouer l'intervieweur), chercher l'accord à tout prix.","Observateur : feuille coupée en deux (à gauche ce qu'on entend, à droite son avis) ; se positionner, dire qui est le meilleur.","Sujet philo → le relier au monde contemporain ; sujet d'actualité → trouver la question universelle derrière."],"sections":[{"titre":"Déroulé et coefficients","points":["Convaincant : tire un sujet, 15 min de préparation, exposé de 4 min (chrono lancé après la lecture du sujet).","Le répondant lance immédiatement un débat de 5 min, sans préparation ni pause.","Observateur : rend compte du débat de façon critique devant un jury pendant 5 min, après avoir été 2 fois observateur.","Coefficients notés : observateur 5, convaincant 2 (METHODO) ; répondant 3 (notes de Nicolas Beaino)."]},{"titre":"Critères de notation","points":["Intellectuels : comprendre l'enjeu, argumenter, mobiliser sa culture.","Personnels : originalité, maîtrise de la pensée, expression, communication, honnêteté intellectuelle.","Relationnels : travailler avec l'autre, construire des propositions communes, faire émerger du consensus.","Qualités de décideur (stratégie, prise de décision, hauteur) et de manager ; écoute responsable des partenaires."]},{"titre":"Sujets","points":["Toujours ouverts, perspectives riches : pas d'attente de contenu.","3 types : sujet contemporain, sujet d'apparence philosophique, proverbe ou grande citation (métaphore).","Utiliser sa culture pour donner sens au monde contemporain ; culture large, pas seulement philo et littérature.","Sujet d'actualité (TikTok, véganisme) : ne pas rester sur le contemporain, trouver la question universelle et des références solides."]},{"titre":"Convaincant (4 min)","points":["1. Donner le sujet (hors chrono). 2. Montrer tout de suite son intérêt (pourquoi actuel, pourquoi question de fond). 3. Donner sa posture et sa démarche. 4. Démonstration avec des exemples intelligents. 5. Pas de conclusion.","NÉCESSITÉ ABSOLUE DE S'ENGAGER : mesuré et concessif possible, mais engagé.","Idéal : 2 arguments dans l'exposé, 1 gardé pour le débat ; formule utile : « On pourrait penser que... ».","Plan : ni « saucisson », ni convenu, ni vague ; ne pas découper le sujet en morceaux."]},{"titre":"Répondant (5 min)","points":["Découvre le sujet pendant l'exposé : prise de notes et construction de sa trame à ce moment-là.","Objectif : emmener la réflexion de A à B ; on peut être d'accord ou non.","D'accord sur un argument : ne pas s'y attarder, le décliner sur d'autres plans (« ça marche sur le plan économique, mais sur le plan politique, moral, artistique ? »).","Pas d'accord : avancer des arguments adverses, proposer une alternative.","1re intervention : pas un contre-exposé, 50 s maximum.","Convaincant hors-sujet : « Je ne suis pas d'accord avec votre lecture du sujet, je pense qu'il faut le comprendre comme... ».","Être maître du débat sans agressivité excessive ; couper la parole si nécessaire (« je me permets..., pour pouvoir exprimer mon avis... »)."]},{"titre":"Conclusion du débat","points":["À 4'30 : « Notre débat a permis de montrer que... Nous avons respectivement défendu que... ce qui a pu nous amener à considérer que... »","Prendre le lead (« je vais conclure ») pour éviter la pénalité ; toujours conclure pour garder la main."]},{"titre":"Observateur","points":["Avoir la fiche d'observation avec soi ; noter tout ce qu'on entend (exposés, déroulé, débats).","Surligner références et arguments de couleurs différentes ; + pour ce qu'on aime, - pour le reste.","Se demander : mon argument préféré ? pourquoi je n'ai pas aimé cet exemple ? par quoi le remplacer ?","Questions possibles : restitution (synthèse, nombre d'arguments et d'exemples, avec leur sens caché) et critique (le meilleur ? avec qui travailler plus tard ?)."]},{"titre":"Avant de passer","points":["Parler avec les co-candidats (« je suis de Ginette ») et se mettre d'accord sur qui conclut."]}],"pieges":["Choisir le contre par principe.","Répéter la posture du convaincant.","Improviser faute de prise de notes, devenir l'intervieweur ou le faire-valoir du convaincant.","Chercher un accord à tout prix : on est noté sur la capacité à faire avancer la réflexion.","Ne pas conclure (pénalité) ; ne pas utiliser les 5 min."],"conseils_profs":[],"temps":"Convaincant : 15 min de préparation, exposé de 4 min ; débat de 5 min sans pause, conclusion à 4'30 ; 1re intervention du répondant 50 s max ; observateur : entretien de 5 min.","sources":["1zXWrPIY5U5tOwWVyEtc_vTy1T-M9-SD2n6Z9QLL-BSI","16UQ1FAH5fsidnGRtLk-9ZW0-rokk11wNFAcv7_Q1r74","1oAfSya0IDAtO6LxxhVZb0_Yh_xQI_Xv2S7xQOtrNwjI"],"manque":""},"o-ang":{"essentiel":["Déroulé de khôlle : accroche (catchphrase), résumé, commentaire, conclusion, puis entretien.","Commentaire précis, clair et relié au sujet du texte ; choisir un angle plus simple et plus net.","Partir des mots-clés du titre (ex. « Nancy Pelosi Political Giant » → « What makes a political giant? »).","Ne pas réciter une fiche de civilisation toute prête : répondre à la question que traite l'article.","HEC LVB : article 500-550 mots, 20' de préparation, 15' d'oral (exposé ±3' + 5' = 8', interrompu au-delà), aucune question perso, pas de phase 3.","ESSEC LVB : 20' de préparation, 18-20' d'épreuve ; résumé complet + pistes de réflexion ; commentaire non obligatoire ; les soft skills comptent."],"sections":[{"titre":"Formats par école (fiche 0 et rapport ESSEC 2024)","points":["HEC : article en anglais de 500-550 mots ; 20' de préparation ; 15' (±3 + 5 = 8' d'exposé) ; textes choisis en mai-juin.","ESSEC LVB : article en anglais d'environ 600 mots (presse britannique, Commonwealth, États-Unis) ; 20' de préparation ; 18-20' ; 1 examinateur ; coefficient 4.","ESSEC, 3 phases d'environ un tiers du temps chacune : restitution du contexte et des idées ; dialogue sur l'article ; échange libre (actualité, société, éthique, culture) à partir d'une base de questions communes.","ESCP : texte d'environ 400-450 mots ; 20' de préparation ; 15' (exposé 7-8').","EDHEC : problématique courte (question ou affirmation), 2 sujets au choix, 5' de préparation, présentation argumentée 5', entretien 10' (questions perso possibles : voyages, motivation).","EM Lyon, Skema, Audencia, GEM, TBS : texte d'environ 500 mots, 20' de préparation, 20' d'oral."]},{"titre":"Exposé","points":["La priorité : montrer qu'on a compris le texte ; réfléchir au point de vue du journaliste (fiche 0, oral HEC).","Le manque d'informations et de connaissances est de plus en plus sanctionné ; pas de commentaire prémâché.","Résumé bien organisé, points clés compris ; bonne transition ; bonne conclusion."]},{"titre":"Entretien","points":["Apporter des idées nouvelles et intéressantes.","Rythme, intonation, contact visuel."]},{"titre":"Langue : erreurs relevées","points":["To embody (pas « to incarnate ») ; liberal pour démocrate.","To consider sth / doing sth ; to put sb at risk ; skeptic (nom) / skeptical (adj) ; scientific / a scientist ; an anti-vaxxer."]}],"pieges":["Commentaire flou, trop éloigné du texte.","Sur-préparation menant à la récitation (cas de candidats qui n'ont pas répondu à la question de l'article)."],"conseils_profs":[{"qui":"Colleur, khôlle 1 (3/10, 16/20)","texte":"Good catchphrase, very well summarized, great accent, great behaviour ; work on the commentary : make it more precise, link it more closely to the topic of the text."},{"qui":"Colleur, khôlle 2 (7/11, 12/20)","texte":"Very good introduction, good summary, good transition and conclusion ; commentary not very clear : choose an easier topic, make it clearer and more purposeful."},{"qui":"Mme Sanz (ESSEC, commission 2024)","texte":"Les soft skills sont aussi évaluées ; ce n'est pas l'esprit de l'épreuve de réciter une fiche de civilisation toute prête."},{"qui":"Mme Carlton (HEC, commission 2024)","texte":"L'article à étudier à l'oral d'HEC est écrit en anglais et ne comprend pas la phase 3."}],"temps":"HEC : 20' de préparation, exposé ±8' (3' + 5'), 15' au total. ESSEC LVB : 20' de préparation, 18-20' d'épreuve. ESCP : 20' de préparation, exposé 7-8' sur 15'. EDHEC : 5' de préparation, 5' de présentation, 10' d'entretien.","sources":["1mGyBI2U3I8qSYJtoj_Br5T3PU0pwdzeb","1dGBM6L4R1d3n2ri1mFYlYM2gpDFuwolc","1VM-Ib0wScZiok0J2hxRGz-N-Z6-Osmsr"],"manque":""},"o-all":{"essentiel":["Lire le chapeau (titre, sous-titre, date) et contextualiser ; nom du journal ou du journaliste seulement si c'est utile.","Compte rendu structuré par thèmes, pas linéaire : une synthèse n'est pas un résumé ; éviter les « Der Journalist sagt, dass... ».","Commentaire : un seul aspect, en profondeur, une réflexion qui avance ; le titre donne souvent l'axe ; ni thèse/antithèse, ni +/-, ni commentaire préparé plaqué.","HEC/ESCP : n'annonce pas le plan, va à l'essentiel ; 8' maximum à HEC, sinon interrompu.","Reprise : se mouiller, défendre son point de vue (pas « un peu des deux ») ; si on ne comprend pas, le dire ; ne jamais bluffer.","Lien avec l'actualité allemande, autrichienne ou suisse ; préparer une fiche sur 2-3 villes ou régions visitées.","Regarder le jury, vouvoyer (Sie), être dynamique ; à « Haben Sie noch eine Frage? » : OUI."],"sections":[{"titre":"Formats (fiche 0)","points":["HEC LVA : article de 650-700 mots ; 20' de préparation ; 15' (±3' + 5' = 8' d'exposé) ; aucune question perso ; l'analyse du texte peut dépasser 3' en allemand.","ESSEC LVA : texte en français (700-900 mots ; 800 ±10 % selon la commission 2024) ; 30' de préparation ; 25-30' ; exposé 10' ; 2 examinateurs ; coefficient 6 ; commentaire obligatoire.","ESSEC, 3 phases : résumé + commentaire ; questions sur le texte et sa thématique ; questions diverses piochées dans une liste.","ESCP : texte d'environ 450-500 mots ; 20' de préparation ; 15' (exposé 7-8').","EDHEC (oral sans article) : 2 questions au choix, 5' de préparation, pitch 5', questions ±5', motivation ±5'.","EM Lyon, Skema, Audencia, GEM, TBS : texte d'environ 500 mots, 20' / 20' ; EML peut faire lire un §, préparation 25' ; Skema interdit d'écrire sur le document."]},{"titre":"Préparation","points":["Feuilles claires, aérées, en colonnes : trame, mots-clés, plan lisibles à 40-50 cm, pour regarder l'examinateur.","Prévoir au moins 10' pour préparer le commentaire (rapport Centrale 2025).","Si on ne comprend pas le mot central, mieux vaut le dire au jury."]},{"titre":"Introduction et compte rendu","points":["Formules : « Im Rahmen / Vor dem Hintergrund + G... befasst sich dieser Artikel mit + D » ; « Im vorliegenden Artikel handelt es sich um + Acc » ; « Der Artikel wurde im... geschrieben, als... ».","DER Artikel, DER Text, DER Journalist (masculin faible) ; éviter « der Artikel spricht über ».","Une date qui n'évoque rien, un journaliste inconnu : ne pas les citer.","Caractériser le document (Informationsartikel ou Meinungsartikel) : intention, parti pris ou neutralité.","Donner le point de vue du journaliste : « Laut dem Journalisten... », « Er ist der Ansicht, dass... », « Er stellt fest, dass... ».","Regrouper les informations par thèmes ; hiérarchiser, filtrer, condenser ; reformuler sans citation directe.","Interviews et dialogues : exposer les points de vue, pas « die Frau sagt, dass... »."]},{"titre":"Transition et commentaire","points":["Marquer le passage : « Soweit zum Artikel, nun mein Kommentar » ou « Nun möchte ich zum Kommentar übergehen ».","« Ich finde diesen Artikel interessant / überraschend, weil er die Frage ... stellt » ; « Ich persönlich bin mit dem Journalisten (nicht) einverstanden ».","« Daraus ergibt sich folgende Frage » ; interrogation directe, sans « inwiefern » systématique ; poser une question n'est pas obligatoire et entraîne souvent vers le hors-sujet.","Enchaînements élégants : zwar... aber, Darüber hinaus, Außerdem, Eigentlich, Dementsprechend ; éviter Erstens/zweitens et « nichtsdestotrotz ».","Pas besoin de 3 parties et 9 sous-parties, mais un raisonnement, une thèse argumentée et étayée d'exemples actuels.","Structurer le commentaire et mettre la structure en avant : vrais arguments, ordre réfléchi, liens.","Ne pas se contredire sur la nature du texte (pas sachlich et kritisch à la fois).","Conclusion brève : résumer le débat en une phrase ou ouvrir."]},{"titre":"Entretien / reprise","points":["Garder l'initiative de la parole sans l'accaparer ; lever les yeux de ses feuilles, entrer en mode discussion.","Passage non lu : dire qu'on n'a pas eu le temps de le lire, le lire rapidement et répondre.","Ne pas comprendre une question : « Die Frage habe ich nicht ganz verstanden », « Meinen Sie... ? », « Können Sie bitte wiederholen? » ; on peut demander UN mot.","Saisir les perches du jury sans digresser ; ni monologue, ni réponse trop brève (« es ist kompliziert »).","Prendre position et justifier (ex. Wehrpflicht, Gleichberechtigung, Klimawandel) ; accepter de clarifier ou d'ajuster sa pensée.","Ne pas persister dans une erreur signalée plusieurs fois.","En fin d'oral : une « Rückfrage » oui, « j'aurai combien ? » non ; saluer par « Tschüss »."]},{"titre":"Oral sans article (EDHEC, ESSEC III)","points":["« Guten Tag » suffit, puis annoncer la question choisie.","Expliquer comment on a compris la question et la replacer dans une thématique.","Pitch de 5' : un pitch trop court a été reproché.","Combo réflexion / culture / actualité + motivation pour l'école (Lille ou Nice, partenariats).","L'entretien porte ensuite sur les séjours, passions, différences culturelles."]},{"titre":"Langue","points":["Vouvoyer (Sie) ; ne pas confondre le « you » anglais et le « du ».","Réflexe d'alarme sur les fautes grossières, sans autocorrection permanente qui tue la fluidité.","Prononciation : Artikel (accent sur « ti »), Journalist (j à la française), voyelles longues/brèves, diphtongues.","Décliner der Aspekt, das Beispiel, der Flüchtling, die Gefahr, der Grund, das Land, das Risiko, das Thema ; participes des verbes forts."]},{"titre":"Posture et tenue","points":["Dédramatiser : c'est un concours, pas un examen ; on note au mérite.","Dynamique, regard vers les examinateurs, pas de ton monocorde ; combatif jusqu'au bout ; humour bienvenu.","Pas de stylo 4 couleurs : un crayon basique.","Tenue simple : costume (pas noir), chemise claire ; cravate plus obligatoire sauf à l'ESSEC."]},{"titre":"Entraînement","points":["Auto-colles en binôme ou trinôme (pas seul) : textes de khôlles, Nachrichten in 100 Sekunden, Tagesschau, Top Thema der Deutschen Welle.","S'informer tous les jours : les textes peuvent avoir été choisis la veille ou l'avant-veille.","Khôlles en tandem, 15' chaque lundi (promo 2024)."]}],"pieges":["Résumé linéaire ou paraphrase.","Commentaire préparé à l'avance et plaqué ; plan thèse/antithèse.","Problématique pas assez incisive (Centrale 2025).","Répondre « un peu des deux » en reprise.","Bluffer ; capituler dès la première difficulté.","Écorcher le nom d'un journaliste inconnu."],"conseils_profs":[{"qui":"Colleur, khôlle 2 (5/11, 15/20)","texte":"Bonne langue, très bon résumé, méthode du Kommentar très bien comprise ; davantage structurer le Kommentar avec de vrais arguments, dans un ordre réfléchi."},{"qui":"Colleur, khôlle 3 (19/11)","texte":"Mettre en avant la structure du commentaire ; se mouiller dans la reprise ; esprit de synthèse et d'analyse plus poussé."},{"qui":"Jury d'allemand (doc. « Qqs outils pour les khôlles »)","texte":"Votre oral sera réussi si le jury peut se dire « das war aber ein nettes Gespräch ! » : un entretien, pas un interrogatoire. Pour être convaincant, soyez convaincu."},{"qui":"Mme Klinge (ESSEC), commission 2024","texte":"En LVB le commentaire n'est pas obligatoire ; à HEC compte surtout la compréhension fine du document : 4-5' de présentation et 4-3' de commentaire est acceptable."},{"qui":"Jury Centrale-Supélec 2025 (oral d'allemand)","texte":"Ne pas dépasser 5' pour le résumé ; introduction soignée avec accroche brève qui contextualise ; compte rendu par thèmes ; conclusion brève et efficace."}],"temps":"HEC LVA : 20' de préparation, exposé ±8' (environ 3' + 5'), 15' au total. ESSEC LVA : 30' de préparation, exposé 10', 25-30' d'épreuve. ESCP : 20' de préparation, exposé 7-8'. EDHEC : 5' de préparation, pitch 5'.","sources":["1TiFDFvLx6P1GktGTQL1a8dXqJkSYZXqA","1dGBM6L4R1d3n2ri1mFYlYM2gpDFuwolc","114eF7pip07wapLK7JAX3NyfPp9Ic-hXd","1rt-co2Cm8SCR_Il8qZUu-Vh0stxIPx-o","1Ov6_ncAz-jbZdbR08dds0bSyoliOeCPR","1TaC-3pl3FnoDnyquxjfIA78lf4hlDH-G","1al1U_KdIoE4Sqde4WdSUx3D4cvLEBORQ","1VM-Ib0wScZiok0J2hxRGz-N-Z6-Osmsr"],"manque":""}}};

var DAYS_S = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];

function pad(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseISO(s){ if(!s) return null; var p=s.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function today(){ var d=new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return x; }
function diffDays(a,b){ return Math.round((parseISO(a)-parseISO(b))/864e5); }
function toMin(hm){ var p=hm.split(":"); return +p[0]*60+ +p[1]; }
function fromMin(m){ return pad(Math.floor(m/60))+":"+pad(m%60); }
function hLabel(hm){ var p=hm.split(":"); return (+p[0])+"h"+(p[1]==="00"?"":p[1]); }
function fmtDay(s){ var d=parseISO(s); return DAYS_S[d.getDay()]+" "+d.getDate()+" "+MON_S[d.getMonth()]; }
function fmtLong(s){ var d=parseISO(s); return DAYS[d.getDay()]+" "+d.getDate()+" "+MONTHS[d.getMonth()]; }
function relDay(s){
  var n=diffDays(s,iso(today()));
  if(n===0) return "Aujourd'hui"; if(n===1) return "Demain"; if(n===-1) return "Hier";
  if(n>1 && n<7) return DAYS[parseISO(s).getDay()].replace(/^./,function(c){return c.toUpperCase();});
  return fmtDay(s);
}
function mondayOf(d){ var x=new Date(d); var w=(x.getDay()+6)%7; x.setDate(x.getDate()-w); x.setHours(0,0,0,0); return x; }
function norm(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function uid(p){ return (p||"x")+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
