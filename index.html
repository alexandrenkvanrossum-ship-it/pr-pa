function parseTask(raw, now){
  now = now || new Date();
  var t0=new Date(now); t0.setHours(0,0,0,0);
  var s=" "+raw.replace(/\s+/g," ")+" ";
  var out={vac:false,title:"",due:null,day:null,time:null,remind:15,prio:0,sub:null,type:null,dur:null,action:null,tokens:[]};
  function cut(re,fn){ var n=norm(s), m=n.match(re); if(!m) return false; if(fn(m)===false) return false; out.tokens.push(s.substr(m.index,m[0].length).trim()); s=s.slice(0,m.index)+" "+s.slice(m.index+m[0].length); return true; }

  cut(/\s(!{1,3})(?=\s)/, function(m){ out.prio=m[1].length; });
  cut(/\s(?:avec\s+)?rappel\s+(\d{1,3})\s*min(?:utes?)?\s+avant(?=\s)/, function(m){ out.remind=+m[1]; });
  /* durée explicite : 20 min, 1h30 de travail, (long) */
  cut(/\s(\d{1,3})\s*(?:min|mn|minutes?)(?=\s|[,.;)])/, function(m){ out.dur=+m[1]; });
  if(out.dur==null) cut(/\s(?:pendant|duree|en)\s+(\d)\s?h(\d{2})?(?=\s)/, function(m){ out.dur=+m[1]*60+(+m[2]||0); });
  /* heure : 19h, 19h30, à 9h (une heure < 7 sans « à » est lue comme une durée) */
  cut(/\s(a\s+)?(\d{1,2})\s?h(\d{2})?(?=\s|[,.;)])/, function(m){
    var h=+m[2], mi=+m[3]||0; if(h>23) return false;
    if(!m[1] && h<7){ if(out.dur!=null) return false; out.dur=h*60+mi; return; }
    out.time=pad(h)+":"+pad(mi);
  });
  var longHint=/\((tres )?long\)|\blong(ue)?\b/.test(norm(s)), shortHint=/\(court\)|\bcourt(e)?\b/.test(norm(s));

  /* dates : « pour X » = échéance ; sinon jour à faire */
  function setDate(d, isDue){ if(isDue) out.due=iso(d); else out.day=iso(d); }
  var rules=[
    [/\s(pour\s+)?(aujourd'hui|aujourdhui|ce soir|ce midi|ce matin)(?=\s)/, function(m){ return t0; }],
    [/\s(pour\s+)?(apres-demain|apres demain)(?=\s)/, function(){ return addDays(t0,2); }],
    [/\s(pour\s+)?(demain)(?=\s)/, function(){ return addDays(t0,1); }],
    [/\s(pour\s+)?dans\s+(\d+)\s+(jours?|semaines?)(?=\s)/, function(m){ return addDays(t0,(/^sem/.test(m[3])?7:1)*+m[2]); }],
    [/\s(pour\s+)?(ce week-end|ce weekend|ce we)(?=\s)/, function(){ var d=new Date(t0); var k=(6-d.getDay()+7)%7; return addDays(d,k); }],
    [/\s(pour\s+)?(?:le\s+)?(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)(\s+prochain)?(?=\s)/, function(m){ var w=WD[m[2]], diff=(w-t0.getDay()+7)%7; if(diff===0) diff=7; return addDays(t0,diff); }],
    [/\s(pour\s+)?(?:le\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/, function(m){ var y=m[4]?(+m[4]<100?2000+ +m[4]:+m[4]):t0.getFullYear(); var d=new Date(y,+m[3]-1,+m[2]); if(!m[4]&&d<t0) d.setFullYear(y+1); return d; }],
    [/\s(pour\s+)?(?:le\s+)?(\d{1,2})(?:er)?\s+(janvier|janv|fevrier|fevr|fev|mars|avril|avr|mai|juin|juillet|juil|aout|septembre|sept|octobre|oct|novembre|nov|decembre|dec)\.?(?=\s)/, function(m){ var d=new Date(t0.getFullYear(),MO[m[3]],+m[2]); if(d<t0) d.setFullYear(d.getFullYear()+1); return d; }]
  ];
  for(var i=0;i<rules.length;i++){
    var n=norm(s), m=n.match(rules[i][0]);
    if(m){ var d=rules[i][1](m); setDate(d, !!m[1]); out.tokens.push(s.substr(m.index,m[0].length).trim()); s=s.slice(0,m.index)+" "+s.slice(m.index+m[0].length); break; }
  }

  /* liste des vacances : « vac : … », « pendant les vacances », « à la Toussaint »… */
  cut(/\s(?:vac\s*:|(?:a faire\s+)?(?:pendant|pour|aux|durant)\s+(?:les\s+)?vacances(?:\s+de\s+(?:la\s+)?(?:toussaint|noel|fevrier|printemps|paques))?|(?:a|pour)\s+(?:la\s+)?toussaint|(?:a|pour)\s+noel|vacances)(?=\s|[,.;:])/, function(){ out.vac=true; });
  var n2=norm(s);
  /* actions reconnues par mot-clé */
  var km;
  if((km=n2.match(/^\s*(ref|reference)\b\s*:?\s*/))){ out.action="csh-oeuvre"; out.sub="csh"; out.type="Œuvre"; s=s.replace(/^\s*r[ée]f(?:[ée]rence)?\s*:?\s*/i," "); }
  else if((km=n2.match(/^\s*(ex|exemple|concept)\b\s*:?\s*/))){ out.action="hgg-fiche"; out.sub="hgg"; out.type=km[1]==="concept"?"Concept":"Exemple"; s=s.replace(/^\s*(ex(?:emple)?|concept)\s*:?\s*/i," "); }
  else if((km=n2.match(/^\s*civi\b\s*:?\s*/))){ out.action="civi"; out.type="CIVI"; s=s.replace(/^\s*civi\s*:?\s*/i," "); }
  var subjHit=SUBJ_WORDS.some(function(x){ return x[1].test(n2); }) || /\b(devoirs?|a rendre|exos?|exercices?|td|dm|texte|lecture|fiche|chapitre|cours|copie)\b/.test(n2);
  if(!out.action && /\b(ne pas oublier|n'oublie pas|penser a|pense a|rappel)\b/.test(n2) && !out.time && subjHit && !/\b(rdv|rendez-vous|medecin|dentiste|appeler)\b/.test(n2)){ out.devoir=true; out.rappelDevoir=true; s=s.replace(/\b(ne pas oublier|n'oublie pas|penser à|pense à|penser a|pense a|rappel)\s*(de\s+|d'|:)?/i," "); }
  if(!out.action && !out.devoir && /\b(rdv|rendez-vous|rendez vous|ne pas oublier|rappel|appeler|medecin|dentiste)\b/.test(n2)){ out.action="rappel"; out.sub=out.sub||"perso"; out.type="Rendez-vous"; }
  if(!out.action && /\bdm\b/.test(n2)){ out.action="dm"; }

  if(!out.sub){ for(var j=0;j<SUBJ_WORDS.length;j++){ if(SUBJ_WORDS[j][1].test(n2)){ out.sub=SUBJ_WORDS[j][0]; break; } } }
  if(out.action==="civi" && !out.sub) out.sub=/\b(deutsch|allemagne|afd|bundestag|berlin|merz)\b/.test(n2)?"all":"ang";
  if(out.action==="dm" && !out.sub) out.sub="maths";
  if(!out.type){ for(var k=0;k<TYPES.length;k++){ if(TYPES[k][1].test(n2)){ out.type=TYPES[k][0]; if(out.dur==null) out.dur=TYPES[k][2]; break; } } }
  if(out.action==="csh-oeuvre" && out.dur==null) out.dur=60;
  if(out.action==="hgg-fiche" && out.dur==null) out.dur=20;
  if(out.action==="civi" && out.dur==null) out.dur=10;
  if(out.dur!=null && !/\d\s*(min|mn|h)/.test(norm(raw))){ if(longHint) out.dur=Math.round(out.dur*1.5); if(shortHint) out.dur=Math.round(out.dur*0.6); }
  if(out.type==="Lecture" && /\b(texte|article|extrait|poeme)\b/.test(n2) && !/\d\s*(min|mn|h)/.test(norm(raw))) out.dur=longHint?15:10;
  if(out.action==="rappel" && !out.day && !out.due && out.time) out.day=iso(t0);
  if(out.action!=="rappel" && (out.due || /\b(devoirs?|a rendre|a faire pour|pour (le )?(prochain )?cours|dm)\b/.test(n2))) out.devoir=true;
  if(out.rappelDevoir && /\b(rendre|apporter|imprimer|envoyer|donner|signer|deposer)\b/.test(n2) && out.type==null){ out.memo=true; out.type="Rappel"; }
  out.durEstimee=out.dur!=null && !/\d\s*(min|mn|h)\b/.test(norm(raw));

  if(out.action==="rappel") s=s.replace(/\bne pas oublier\s+(de\s+|le\s+|la\s+|les\s+|l')?/i," ").replace(/\brdv\b/i,"RDV");
  out.title=s.replace(/\(\s*\)/g,"").replace(/\s+/g," ").replace(/^[\s:,-]+|[\s:,-]+$/g,"").trim();
  if(out.title) out.title=out.title.charAt(0).toUpperCase()+out.title.slice(1);
  return out;
}



/* Synchronisation Supabase : le stockage local reste la copie de travail (hors ligne),
   chaque élément est un document (kind, id, data) dans la table docs, protégée par compte. */
var SUPA_URL = "https://fdiswyamvqvqwrsvzwgf.supabase.co";
var SUPA_KEY = "sb_publishable_SCyWlsrbFi_Ogn-gPENJow_c6gvZjeG";

var Sync = (function(){
  var sb=null, user=null, status="local", listeners=[], pushT=null, channel=null, busy=false;
  var SNAP="prepa.synced.v1";
  function emit(){ listeners.forEach(function(f){ try{ f(status,user); }catch(e){} }); }
  function setStatus(s){ status=s; emit(); }
  function snapGet(){ try{ return JSON.parse(localStorage.getItem(SNAP)||"{}"); }catch(e){ return {}; } }
  function snapSet(m){ try{ localStorage.setItem(SNAP,JSON.stringify(m)); }catch(e){} }

  /* état local -> documents */
  function toDocs(s){
    var m={};
    s.tasks.forEach(function(t){ m["task|"+t.id]=t; });
    s.notes.forEach(function(n){ m["note|"+n.id]=n; });
    m["state|goals"]=s.goals||{};
    m["state|ressentis"]=s.ressentis||{};
    m["state|slotDone"]=s.slotDone||{};
    m["state|meta"]={cshSkip:s.cshSkip||0,seeded:!!s.seeded};
    if(s.news) m["state|news"]=s.news;
    ["files","mathsEx","mathsCours","mathsDone","mathsCfg","quiz","quizOff","hgg"].forEach(function(k){ if(s[k]) m["state|"+k]=s[k]; });
    return m;
  }
  function applyDoc(s,kind,id,data,deleted){
    if(kind==="task"||kind==="note"){
      var arr=kind==="task"?s.tasks:s.notes, i=arr.findIndex(function(x){ return x.id===id; });
      if(deleted){ if(i>=0) arr.splice(i,1); return; }
      if(i>=0) arr[i]=data; else arr.push(data);
    } else if(kind==="state"){
      if(deleted) return;
      if(id==="meta"){ s.cshSkip=data.cshSkip||0; s.seeded=s.seeded||!!data.seeded; }
      else s[id]=data||{};
    }
  }

  function init(){
    if(!window.supabase || !window.supabase.createClient){ setStatus("local"); return; }
    try{ sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}}); }catch(e){ setStatus("local"); return; }
    sb.auth.getSession().then(function(r){ user=r.data&&r.data.session?r.data.session.user:null; if(user) start(); else setStatus("signedout"); });
    sb.auth.onAuthStateChange(function(ev,session){ var u=session?session.user:null; var changed=(u&&u.id)!==(user&&user.id); user=u; if(user&&changed) start(); if(!user){ stopRealtime(); setStatus("signedout"); } });
    window.addEventListener("online",function(){ if(user) pull().then(push); });
  }

  function start(){ setStatus("syncing"); pull(true).then(push).then(realtime).catch(function(){ setStatus("offline"); }); }

  function pull(first){
    if(!sb||!user) return Promise.resolve();
    return sb.from("docs").select("kind,id,data,deleted,updated_at").then(function(r){
      if(r.error) throw r.error;
      var s=Store.get(), snap=snapGet(), local=toDocs(s);
      if(first && r.data.length){ var keys={}; r.data.forEach(function(row){ keys[row.kind+"|"+row.id]=1; }); s.tasks=s.tasks.filter(function(t){ return !t.example || keys["task|"+t.id]; }); }
      r.data.forEach(function(row){
        var key=row.kind+"|"+row.id, localJson=JSON.stringify(local[key]), remoteJson=JSON.stringify(row.data);
        /* modifié localement depuis la dernière synchro et pas à distance : on garde le local */
        var localDirty=snap[key]!==undefined && snap[key]!==localJson;
        if(localDirty && snap[key]===remoteJson) return;
        applyDoc(s,row.kind,row.id,row.data,row.deleted);
        if(row.deleted) delete snap[key]; else snap[key]=remoteJson;
      });
      snapSet(snap); Store.save(true);
      if(window.__prepaRefresh) window.__prepaRefresh();
      setStatus(navigator.onLine===false?"offline":"synced");
    });
  }

  function push(){
    if(!sb||!user||busy) return Promise.resolve();
    var s=Store.get(), snap=snapGet(), docs=toDocs(s), rows=[], now=new Date().toISOString();
    Object.keys(docs).forEach(function(key){ var j=JSON.stringify(docs[key]); if(snap[key]!==j){ var p=key.split("|"); rows.push({kind:p[0],id:p[1],data:docs[key],deleted:false,updated_at:now}); } });
    Object.keys(snap).forEach(function(key){ if(!(key in docs)){ var p=key.split("|"); rows.push({kind:p[0],id:p[1],data:{},deleted:true,updated_at:now}); } });
    if(!rows.length){ setStatus("synced"); return Promise.resolve(); }
    busy=true; setStatus("syncing");
    return sb.from("docs").upsert(rows,{onConflict:"user_id,kind,id"}).then(function(r){
      busy=false;
      if(r.error){ setStatus("offline"); return; }
      var sn=snapGet();
      rows.forEach(function(row){ var key=row.kind+"|"+row.id; if(row.deleted) delete sn[key]; else sn[key]=JSON.stringify(row.data); });
      snapSet(sn); setStatus("synced");
    },function(){ busy=false; setStatus("offline"); });
  }

  function realtime(){
    if(!sb||!user||channel) return;
    channel=sb.channel("docs-"+user.id).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"user_id=eq."+user.id},function(p){
      var row=p.new; if(!row||!row.kind) return;
      var s=Store.get(), key=row.kind+"|"+row.id, snap=snapGet(), j=JSON.stringify(row.data);
      if(snap[key]===j && !row.deleted) return;

/* BJcolle : lecture des données rangées par le robot (tables bj_colles, bj_events, bj_state).

var BJ = (function(){

  try{ var c=JSON.parse(localStorage.getItem(KEY)||"null"); if(c&&c.colles) data=c; }catch(e){}

  function emit(){ listeners.forEach(function(f){ try{ f(); }catch(e){} }); }
  function sb(){ return (typeof Sync!=="undefined" && Sync.client && Sync.user())? Sync.client() : null; }
  var COLS="id,scope,annee,discipline,date,debut,fin,duree,tirage,type,colleur,salle,eleve,moi,note,note_num,ordre,sujet,commentaire,detail_at";

      c.from("bj_state").select("*").maybeSingle().then(function(r){ if(!r.error) data.state=r.data; })
    ]).then(function(){ data.colles=all; data.at=new Date().toISOString(); save(); loading=false; emit(); live(); })
      .catch(function(){ loading=false; emit(); });
  }
  function live(){
    var c=sb(); if(!c||chan) return;

  }
  function checkNow(){
    var c=sb(); if(!c||!c.functions) return Promise.reject(new Error("Connecte-toi d'abord (Plus → Compte)."));

  function markRead(){

    if(c&&ids.length) c.from("bj_events").update({lu:true}).in("id",ids).then(function(){});
  }

  /* ---------- lectures ---------- */
  var SUB={"Mathématiques":"maths","Histoire-Géographie":"hgg","Français-Philosophie":"csh","Anglais LV1":"ang","Anglais LV2":"ang","Allemand LV1":"all","Allemand LV2":"all"};
  var PREP={maths:30,hgg:30,csh:30,ang:20,all:20};
  function subOf(c){ return SUB[c.discipline]||"neutral"; }
  function mine(){ return data.colles.filter(function(c){ return c.moi; }); }
  function mineOn(dISO){ return data.colles.filter(function(c){ return c.moi && c.date===dISO && (c.scope==="moi"||c.scope==="kore") && c.debut; }); }
  function upcoming(){ var t=iso(today()); return mine().filter(function(c){ return (c.scope==="moi"||c.scope==="kore") && c.date>=t; }).sort(function(a,b){ return (a.date+a.debut).localeCompare(b.date+b.debut); }); }
  function block(c){ // créneau bloqué dans l'agenda : 10 min avant la préparation → fin du passage
    var s=subOf(c), prep=/^\d/.test(c.tirage||"")? toMin(c.debut)-toMin(c.tirage) : (PREP[s]||20);
    var start=toMin(c.debut)-prep-10, end=toMin(c.fin||fromMin(toMin(c.debut)+(c.duree||20)))+((s==="hgg"||s==="csh")?5:0);
    return {s:fromMin(Math.max(0,start)), e:fromMin(Math.min(1439,end))};
  }
  function colleurKey(n){ return String(n||"").replace(/\s+[A-Z]$/,"").trim(); }
  function colleurs(){
    var m={};
    data.colles.forEach(function(c){ if(!c.colleur) return; c.colleur.split(/\s*\/\s*/).forEach(function(n){ var k=colleurKey(n); var o=m[k]||(m[k]={nom:k, disc:{}, notes:[], miennes:[], n:0, sujets:0, last:""}); o.n++; o.disc[c.discipline]=(o.disc[c.discipline]||0)+1; if(c.note_num!=null) o.notes.push(c.note_num); if(c.moi&&c.note_num!=null) o.miennes.push(c.note_num); if(c.sujet) o.sujets++; if((c.date||"")>o.last) o.last=c.date; }); });
    return Object.keys(m).map(function(k){ var o=m[k]; o.discipline=Object.keys(o.disc).sort(function(a,b){ return o.disc[b]-o.disc[a]; })[0]; o.moy=avgN(o.notes); o.moyMoi=avgN(o.miennes); o.sd=sdN(o.notes); return o; });

  function colleur(nom){ return colleurs().filter(function(c){ return c.nom===nom; })[0]||null; }

  function unread(){ return data.events.filter(function(e){ return !e.lu; }).length; }
  function ready(){ return !!(data.state && data.state.last_ok); }

  return {data:function(){ return data; }, load:load, checkNow:checkNow, markRead:markRead, on:function(f){ listeners.push(f); },
    mine:mine, mineOn:mineOn, upcoming:upcoming, block:block, subOf:subOf, colleurs:colleurs, colleur:colleur, collesDe:collesDe, colleurKey:colleurKey, classAvg:classAvg, avg:avgN, unread:unread, ready:ready};
})();

/* Fichiers déposés (stockage Supabase privé « fichiers ») et analyse par Gemini :
   - TD, dossiers d'exercices, DM (+ corrigé) → liste des exercices avec temps estimé ;
   - cours → définitions, propriétés, théorèmes… recopiés tels quels, pour les quiz. */
var Files = (function(){
  var BUCKET="fichiers", running={};
  function sb(){ return (typeof Sync!=="undefined" && Sync.client && Sync.user())? Sync.client() : null; }
  function S(){ var s=Store.get(); s.files=s.files||{}; s.mathsEx=s.mathsEx||{}; s.mathsCours=s.mathsCours||{}; return s; }
  function clean(n){ return String(n).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9._-]+/g,"_").slice(-80); }
  function mimeOf(f){ if(f.type) return f.type; var e=(f.name.split(".").pop()||"").toLowerCase(); return {pdf:"application/pdf",docx:"application/vnd.openxmlformats-officedocument.wordprocessingml.document",pptx:"application/vnd.openxmlformats-officedocument.presentationml.presentation",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",heic:"image/heic",txt:"text/plain"}[e]||"application/octet-stream"; }
  function upload(file, meta){
    var c=sb(); if(!c) return Promise.reject(new Error("Connecte-toi d'abord (Plus → Compte)."));
    var id=uid("f"), path=Sync.user().id+"/"+(meta.sub||"autre")+"/"+id+"-"+clean(file.name);
    return c.storage.from(BUCKET).upload(path,file,{contentType:mimeOf(file),upsert:false}).then(function(r){
      if(r.error) throw new Error(/bucket/i.test(r.error.message||"")?"Espace « fichiers » absent : lance le script fichiers.sql dans Supabase.":r.error.message);
      var f={id:id, sub:meta.sub, kind:meta.kind, chap:meta.chap||"", name:file.name, label:meta.label||"", path:path, mime:mimeOf(file), size:file.size, at:new Date().toISOString(), pair:meta.pair||null, target:meta.target||null, due:meta.due||null, status:"stored"};
      S().files[id]=f; Store.save(); return f;
    });
  }
  function analysable(f){ return f && f.sub==="maths" && ["cours","td","exos","dm"].indexOf(f.kind)>=0; }
  function analyze(id, onStep){
    var s=S(), f=s.files[id]; if(!f) return Promise.reject(new Error("Fichier introuvable."));
    if(f.kind==="corrige"){ return f.pair? analyze(f.pair,onStep) : Promise.resolve(); }
    if(!analysable(f)) return Promise.resolve();
    if(running[id]) return running[id];
    f.status="analyse"; f.err=""; Store.save(); emit();
    var p;
    if(f.kind==="cours"){
      var items=[], chap="";
      var step=function(k){ return Sync.invoke({mode:"doc",kind:"cours",chap:f.chap,chunk:k,files:[{path:f.path,name:f.name,mime:f.mime,role:"cours"}]}).then(function(r){
        items=items.concat((r.items||[]).filter(function(x){ return x && x.enonce; })); chap=chap||r.chapitre;
        f.progress=Math.round((k+1)/r.chunks*100); Store.save(); emit(); if(onStep) onStep(f);
        if(k+1<r.chunks) return step(k+1);
      }); };
      p=step(0).then(function(){ S().mathsCours[id]={chap:f.chap||chap, items:items, at:new Date().toISOString()}; f.n=items.length; });
    } else {
      var corr=Object.keys(s.files).map(function(k){ return s.files[k]; }).filter(function(x){ return x.kind==="corrige" && x.pair===id; });
      var list=[{path:f.path,name:f.name,mime:f.mime,role:"enonce"}].concat(corr.slice(0,2).map(function(x){ return {path:x.path,name:x.name,mime:x.mime,role:"corrige"}; }));
      p=Sync.invoke({mode:"doc",kind:f.kind==="dm"?"dm":"exos",chap:f.chap,files:list}).then(function(r){
        var old=(S().mathsEx[id]||{}).exos||[];
        S().mathsEx[id]={chap:f.chap||r.chapitre||"", exos:(r.exercices||[]).map(function(e,i){ var o=old[i]; if(o && o.num===e.num && o.perso) e.minutes=o.minutes, e.perso=true; return e; }), corrige:!!r.corrige, at:new Date().toISOString()};
        f.n=(r.exercices||[]).length; f.corrige=!!r.corrige;
        if(f.kind==="dm") dmTask(f);

    }
    running[id]=p.then(function(){ f.status="ok"; f.progress=100; Store.save(); delete running[id]; emit(); return f; },
      function(e){ f.status="err"; f.err=String(e&&e.message||e).slice(0,300); Store.save(); delete running[id]; emit(); throw e; });
    return running[id];
  }
  /* DM : une tâche « DM » (découpée jeudi, vendredi, dimanche), durée = somme des exercices */
  function dmTask(f){
    var s=S(), ex=(s.mathsEx[f.id]||{}).exos||[], tot=ex.reduce(function(a,e){ return a+(e.minutes||30); },0)||240;
    var t=s.tasks.find(function(x){ return x.file===f.id; });
    if(!t){ t={id:uid("t"),title:"DM de maths"+(f.label?" · "+f.label:""),sub:"maths",type:"DM",action:"dm",due:f.due,prio:2,done:false,created:new Date().toISOString(),progress:0,spent:0,file:f.id}; s.tasks.push(t); }
    t.dur=Math.round(tot*1.1); t.due=f.due||t.due;
  }
  function open(id){
    var f=S().files[id], c=sb(); if(!f||!c) return;
    var w=window.open("","_blank");
    c.storage.from(BUCKET).createSignedUrl(f.path,3600).then(function(r){ if(r.error){ if(w) w.close(); if(window.__toast) window.__toast(r.error.message); return; } if(w) w.location=r.data.signedUrl; else location.href=r.data.signedUrl; });
  }
  function remove(id){
    var s=S(), f=s.files[id]; if(!f) return;
    var c=sb(); if(c) c.storage.from(BUCKET).remove([f.path]).then(function(){});
    delete s.files[id]; delete s.mathsEx[id]; delete s.mathsCours[id];
    Object.keys(s.files).forEach(function(k){ if(s.files[k].pair===id) s.files[k].pair=null; });
    s.tasks=s.tasks.filter(function(t){ return t.file!==id || t.done; });
    Store.save(); emit();
  }
  var ls=[]; function emit(){ ls.forEach(function(f){ try{ f(); }catch(e){} }); }
  function of(sub){ var s=S(); return Object.keys(s.files).map(function(k){ return s.files[k]; }).filter(function(f){ return f.sub===sub; }).sort(function(a,b){ return b.at.localeCompare(a.at); }); }
  return {upload:upload, analyze:analyze, analysable:analysable, open:open, remove:remove, of:of, on:function(f){ ls.push(f); }, busy:function(id){ return !!running[id]; }};
})();

/* Construction des journées : cours, blocs fixes, créneaux de travail proposés, pales. */
function inVacances(dISO){ for(var i=0;i<VACANCES.length;i++){ if(dISO>=VACANCES[i].from && dISO<=VACANCES[i].to) return VACANCES[i]; } return null; }
function forumWeek(dISO){ return (Math.round(diffDays(dISO,FORUM_REF)/7)%2)===0; }
function paleOn(dISO){ return PALES.filter(function(p){ return p.date===dISO; }); }

/* Créneaux de travail par jour (1 = lundi … 0 = dimanche) — d'après la journée type */
var WORK = {

function dayEvents(dISO){
  var d=parseISO(dISO), wd=d.getDay(), vac=inVacances(dISO), ev=[], pales=paleOn(dISO);
  var schoolDay=!vac && wd>=1 && wd<=6;
  function add(o){ o.id=o.id||(o.kind+"-"+o.s+"-"+o.t); ev.push(o); }
  if(schoolDay){
    if(wd<=6) add({kind:"fixed",s:"07:30",e:"08:10",t:"Anki anglais + allemand",sub:"neutral",anki:true});
    COURSES.forEach(function(c){
      if(c.d!==wd) return;
      if(c.forum && !forumWeek(dISO)){ add({kind:"work",s:c.s,e:c.e,t:"Travail (pas de Forum)",sub:"hgg",subs:["hgg","csh","ang","all"]}); return; }
      add({kind:"course",s:c.s,e:c.e,t:c.t,sub:c.sub});
    });
    add({kind:"fixed",s:"12:30",e:"13:00",t:"Déjeuner",sub:"neutral"});
  }
  pales.forEach(function(p){ add({kind:"exam",s:p.s,e:p.e,t:"DST · "+p.t,sub:p.sub}); });
  if(!vac){
    (WORK[wd]||[]).forEach(function(w){
      if(wd===6 && pales.length){ return; }
      var o={}; for(var k in w) o[k]=w[k]; o.kind="work"; add(o);
    });
    if(wd===6 && pales.length) add({kind:"fixed",s:"13:00",e:"13:25",t:"Anki (facultatif)",sub:"neutral",anki:true});
  }
  if(!(wd===6 && pales.length)){
    add({kind:"fixed",s:"20:00",e:"20:40",t:"Dîner",sub:"neutral"});
    if(!vac || wd!==6) add({kind:"fixed",s:"23:00",e:"23:20",t:"Actualité",sub:"neutral",actu:true});
  }
  // Colles BJcolle : bloquées de 10 min avant la préparation à la fin du passage ; le travail qui chevauche est raccourci
  if(typeof BJ!=="undefined"){
    BJ.mineOn(dISO).forEach(function(c){
      var b=BJ.block(c), cs=toMin(b.s), ce=toMin(b.e);
      ev=ev.reduce(function(acc,w){
        if(w.kind!=="work" || toMin(w.e)<=cs || toMin(w.s)>=ce){ acc.push(w); return acc; }
        if(toMin(w.s)<cs && cs-toMin(w.s)>=20){ var a={}; for(var k in w) a[k]=w[k]; a.e=fromMin(cs); a.id=w.id+"-a"; acc.push(a); }
        if(toMin(w.e)>ce && toMin(w.e)-ce>=20){ var z={}; for(var k2 in w) z[k2]=w[k2]; z.s=fromMin(ce); z.id=w.id+"-z"; acc.push(z); }
        return acc;
      },[]);
      add({kind:"exam",s:b.s,e:b.e,t:"Colle – "+c.discipline.replace(/ LV\d$/,"")+(c.colleur?" ("+c.colleur+")":""),sub:BJ.subOf(c),colle:c.id,lieu:c.salle||""});
    });
  }
  ev.sort(function(a,b){ return toMin(a.s)-toMin(b.s); });
  return ev;
}

/* Tâches à placer : priorité, échéance, jour prévu */
function openTasks(subs){
  var st=Store.get();
  return st.tasks.filter(function(t){ return !t.done && !t.time && subs.indexOf(t.sub)>=0; })
    .sort(function(a,b){ return (b.prio||0)-(a.prio||0) || String(a.day||a.due||"9999").localeCompare(String(b.day||b.due||"9999")); });
}

function roadFor(ev,dISO){
  var items=[], cap=toMin(ev.e)-toMin(ev.s), used=0;
  function push(o){ items.push(o); used+=o.min; }
  if(ev.anki){ push({lab:"Anki anglais",min:20}); push({lab:"Anki allemand",min:20}); return items; }
  if(ev.actu){ push({lab:"Lecture de l'actualité (HGG et langues)",min:20}); return items; }
  if(ev.kind!=="work") return items;
  var subs=ev.subs||[ev.sub];
  if(ev.sub==="maths" && ev.crit) push({lab:"Quiz de cours (partie vue en classe)",min:15,sub:"maths",quiz:true});
  if(ev.rac) push({lab:"RAC d'anglais (objectif : 2h, puis 1h45)",min:110,sub:"ang"});
  if(ev.plan) push({lab:"Plan détaillé d'HGG (sujet de la semaine)",min:90,sub:"hgg"});
  if(ev.trad){ push({lab:"Traduction d'anglais",min:30,sub:"ang"}); push({lab:"Traduction d'allemand",min:30,sub:"all"}); }
  var pauseEvery=ev.crit?30:55, pauseLen=ev.crit?5:10, sinceP=0;
  var planned=(typeof Plan!=="undefined")? Plan.forSlot(dISO,ev) : [];
  planned.forEach(function(p){
    if(used>=cap-5) return;
    var m=Math.min(p.min, cap-used); if(m<5) return;
    if(sinceP+m>pauseEvery && items.length && used+pauseLen<cap){ push({lab:"Pause",min:pauseLen,pause:true}); sinceP=0; }
    var o={lab:p.lab+(p.partial?" (une partie)":""),min:m,sub:p.sub,partial:p.partial,late:p.late,star:p.star,ref:p.ref};
    if(p.ref&&p.ref.k==="task") o.task=p.ref.id;
    push(o); sinceP+=m;
  });
  if(used<cap-10){

    if(sinceP>pauseEvery-10 && used+pauseLen<cap){ push({lab:"Pause",min:pauseLen,pause:true}); }
    push({lab:fill,min:cap-used,sub:ev.sub,filler:true});

/* Planificateur : répartit sur les 14 prochains jours, dans les créneaux de la bonne matière,
   1) les tâches à jour fixé, 2) les devoirs par échéance (la plus proche d'abord),
   3) les exercices de maths et les chapitres d'HGG, uniformément jusqu'à leur date butoir,
   4) les tâches sans date, par priorité. Ce qui ne rentre pas est signalé.
   Le créneau en cours est figé (il ne bouge plus une fois commencé). */
var Plan = (function(){
  function nowMin(){ var d=new Date(); return d.getHours()*60+d.getMinutes(); }
  var HORIZON=14, DEF={maths:45,hgg:45,csh:45,ang:30,all:30};
  var SNAP="prepa.plan.snap", memo={k:null,v:null};
  function snapGet(){ try{ return JSON.parse(localStorage.getItem(SNAP)||"{}"); }catch(e){ return {}; } }
  function snapSet(m){ try{ localStorage.setItem(SNAP,JSON.stringify(m)); }catch(e){} }

  function fixedMin(ev){ var m=0; if(ev.sub==="maths"&&ev.crit) m+=15; if(ev.rac) m+=110; if(ev.plan) m+=90; if(ev.trad) m+=60; return m; }
  function pauseRatio(ev){ return ev.crit? 5/35 : 10/65; }

  /* ---------- éléments à placer ---------- */
  function hggItems(s, t){
    var out=[], H=s.hgg||{}, fait=H.fait||{}, done=H.done||{}, prog=H.prog||{}, mins=H.min||{};
    if(typeof HGG_PROG==="undefined") return out;
    HGG_PROG.quinzaines.forEach(function(q){
      q.chapitres.forEach(function(c,i){
        var k="q"+q.n+"#"+i; if(!fait[k] || done[k]) return;
        var tot=mins[k]||120, left=Math.round(tot*(1-(prog[k]||0)/100)); if(left<10) return;
        var dl=q.fin>=t? q.fin : iso(addDays(parseISO(t),4));
        out.push({key:"hgg|"+k, ref:{k:"hgg",id:k}, lab:"HGG · "+c.titre, sub:"hgg", min:left, dl:dl, late:q.fin<t, chunk:30, spread:"hgg|"+dl});
      });
    });
    return out;
  }
  function exoItems(s, t){
    var out=[], ex=s.mathsEx||{}, done=s.mathsDone||{}, files=s.files||{};
    Object.keys(ex).forEach(function(fid){
      var f=files[fid]; if(!f || f.kind==="dm" || f.off) return;
      var dl=f.target || iso(addDays(parseISO(t),HORIZON-1)); if(dl<t) dl=iso(addDays(parseISO(t),3));
      (ex[fid].exos||[]).forEach(function(e,i){
        var k=fid+"#"+i; if(done[k]) return;
        out.push({key:"exo|"+k, ref:{k:"exo",id:k}, lab:"Ex. "+e.num+(e.titre?" · "+e.titre:"")+" ("+(f.label||f.name)+")", sub:"maths", min:Math.max(10,Math.min(120,e.minutes||30)), dl:dl, whole:true, spread:"exo|"+dl, star:!!e.classique});
      });
    });
    return out;
  }
  function taskItems(s, t){
    var out=[];
    s.tasks.forEach(function(x){
      if(x.done || x.vac || x.time || x.memo || !x.sub || x.sub==="perso") return;
      var tot=x.dur||DEF[x.sub]||30, left=Math.round(tot*(1-(x.progress||0)/100)); if(left<5) return;
      var o={key:"task|"+x.id, ref:{k:"task",id:x.id}, lab:x.title, sub:x.sub, min:left, prio:x.prio||0, created:x.created||"", chunk:15, dm:x.action==="dm"};
      if(x.day){ o.day=x.day<t?t:x.day; o.late=x.day<t; o.cls=0; }
      else if(x.due){ var dl=iso(addDays(parseISO(x.due),-1)); if(dl<t){ dl=t; o.late=x.due<t; } o.dl=dl; o.cls=1; }
      else o.cls=3;
      out.push(o);
    });
    return out;
  }

  /* ---------- créneaux ---------- */
  function slots(t, nm){
    var out=[];
    for(var i=0;i<HORIZON;i++){
      var d=iso(addDays(parseISO(t),i)), wd=parseISO(d).getDay();
      dayEvents(d).forEach(function(ev){
        if(ev.kind!=="work") return;
        var s=toMin(ev.s), e=toMin(ev.e), state="future";
        if(d===t){ if(e<=nm) state="past"; else if(s<=nm) state="now"; }
        var cap=Math.max(0, Math.floor((e-s-fixedMin(ev))*(1-pauseRatio(ev))));
        out.push({d:d, wd:wd, ev:ev, id:d+"|"+ev.id, subs:ev.subs||[ev.sub], cap:cap, left:state==="future"?cap:0, state:state, items:[]});
      });
    }
    return out;
  }
  function fits(sl, it){
    if(sl.left<10 || sl.subs.indexOf(it.sub)<0) return false;
    if(it.day && sl.d!==it.day) return false;
    if(it.dl && sl.d>it.dl) return false;
    if(it.dm && [4,5,0].indexOf(sl.wd)<0) return false;
    return true;
  }
  function put(sl, it, m, res){
    var already=sl.items.filter(function(x){ return x.key===it.key; })[0];
    if(already) already.min+=m; else sl.items.push({key:it.key, ref:it.ref, lab:it.lab, sub:it.sub, min:m, late:it.late, star:it.star, partial:m<it.min||!!already});
    sl.left-=m; it.min-=m;
    (res.byRef[it.key]=res.byRef[it.key]||[]).push({d:sl.d, s:sl.ev.s, t:sl.ev.t, min:m});
  }
  function asap(list, it, res){
    for(var i=0;i<list.length && it.min>0;i++){
      var sl=list[i]; if(!fits(sl,it)) continue;
      var cap=it.dm? Math.min(sl.left, 120-(sl.items.filter(function(x){ return x.key===it.key; })[0]||{min:0}).min) : sl.left;
      if(it.whole){ if(cap>=it.min) put(sl,it,it.min,res); continue; }
      var m=Math.min(cap, it.min); if(m<Math.min(it.chunk||15, it.min)) continue;
      if(it.min-m>0 && it.min-m<(it.chunk||15) && m>it.chunk) m=it.min-(it.chunk||15); /* évite un reliquat minuscule */
      put(sl,it,m,res);
    }
  }
  /* répartition uniforme d'un groupe (même matière, même date butoir) */
  function spread(list, group, res){
    if(!group.length) return;
    var it0=group[0], el=list.filter(function(sl){ return fits(sl,it0); });
    var total=group.reduce(function(a,x){ return a+x.min; },0), room=el.reduce(function(a,sl){ return a+sl.left; },0);
    if(!el.length) return;
    var ratio=Math.min(1, total/room), gi=0;
    el.forEach(function(sl,si){
      var quota=Math.round(sl.left*ratio), last=si===el.length-1;
      while(gi<group.length && (quota>0||last) && sl.left>=10){
        var it=group[gi]; if(it.min<=0){ gi++; continue; }
        if(it.whole){
          if(it.min>sl.left) break;
          if(it.min>quota*1.5+10 && !last) break;
          quota-=it.min; put(sl,it,it.min,res); gi++;
        } else {
          var m=Math.min(sl.left, Math.max(quota, it.chunk), it.min); if(m<Math.min(it.chunk,it.min)) break;
          quota-=m; put(sl,it,m,res); if(it.min<=0) gi++;
        }
      }
    });
    /* ce qui reste : on tente encore au plus tôt avant la date butoir */
    group.forEach(function(it){ if(it.min>0) asap(list,it,res); });
  }

  function compute(dry){
    var s=Store.get(), t=iso(today()), nm=nowMin(), snap=snapGet();
    var res={slots:{}, byRef:{}, unplaced:[], dropped:[], at:new Date().toISOString()};
    var list=slots(t,nm);
    var items=taskItems(s,t).concat(exoItems(s,t)).concat(hggItems(s,t));
    var byKey={}; items.forEach(function(it){ byKey[it.key]=it; it.min0=it.min; });
    /* créneau en cours : figé d'après la dernière photo */
    list.forEach(function(sl){
      if(sl.state!=="now") return;
      var sn=snap[sl.id];
      if(sn && sn.items){ sl.items=sn.items.map(function(x){ var it=byKey[x.key]; if(it){ var m=Math.min(it.min,x.min); it.min-=m; (res.byRef[x.key]=res.byRef[x.key]||[]).push({d:sl.d,s:sl.ev.s,t:sl.ev.t,min:m}); } return x; }); sl.frozen=true; }
      else { sl.left=Math.max(0, Math.floor((toMin(sl.ev.e)-nm)*(1-pauseRatio(sl.ev)))); }
    });
    var fixed=items.filter(function(x){ return x.cls===0; }).sort(function(a,b){ return b.prio-a.prio; });
    var due=items.filter(function(x){ return x.cls===1; }).sort(function(a,b){ return a.dl.localeCompare(b.dl) || b.prio-a.prio; });
    var free=items.filter(function(x){ return x.cls===3; }).sort(function(a,b){ return b.prio-a.prio || a.created.localeCompare(b.created); });
    fixed.forEach(function(it){ asap(list,it,res); });
    due.forEach(function(it){ asap(list,it,res); });
    var groups={}; items.filter(function(x){ return x.spread; }).forEach(function(it){ (groups[it.spread]=groups[it.spread]||[]).push(it); });
    Object.keys(groups).sort(function(a,b){ return a.split("|")[1].localeCompare(b.split("|")[1]); }).forEach(function(g){ spread(list,groups[g],res); });
    free.forEach(function(it){ asap(list,it,res); });
    items.forEach(function(it){
      if(it.min<=0) return;
      var o={key:it.key, ref:it.ref, lab:it.lab, sub:it.sub, min:it.min, of:it.min0, dl:it.dl||it.day||null};
      if(it.cls===3 && !it.prio) res.dropped.push(o); else res.unplaced.push(o);
    });
    list.forEach(function(sl){ res.slots[sl.id]=sl.items; });
    /* photo des créneaux du jour (affichage des créneaux passés, gel du créneau en cours) */
    var ns={}; Object.keys(snap).forEach(function(k){ if(k.slice(0,10)>=iso(addDays(parseISO(t),-7))) ns[k]=snap[k]; });
    list.forEach(function(sl){ if(sl.d!==t) return; if(sl.state==="past" && ns[sl.id]) return; if(sl.state==="now" && sl.frozen) return; ns[sl.id]={items:sl.items}; });
    if(!dry) snapSet(ns);
    return res;
  }
  function sig(){
    var s=Store.get();
    return [iso(today()), Math.floor(nowMin()/5), JSON.stringify(s.tasks), JSON.stringify(s.mathsDone||{}), JSON.stringify(s.hgg||{}), Object.keys(s.mathsEx||{}).join(","), JSON.stringify(s.files||{}), typeof BJ!=="undefined"?BJ.data().at:""].join("§");
  }
  function get(){ var k=sig(); if(memo.k!==k){ memo.v=compute(); memo.k=k; } return memo.v; }
  function forSlot(dISO, ev){
    var id=dISO+"|"+ev.id, p=get();

  /* aperçu : où irait une nouvelle tâche, et combien d'éléments seraient repoussés hors délai ? */
  function preview(task){

    finally{ s.tasks.pop(); }
  }
  return {get:get, forSlot:forSlot, whenOf:whenOf, preview:preview, invalidate:function(){ memo.k=null; }};
})();

      h+='<button class="ev '+cls+'" style="top:'+top+'px;height:'+ht+'px" data-a="slot" data-d="'+x+'" data-id="'+esc(e.id)+'"><b>'+esc(e.t)+'</b>'+(ht>34?'<span>'+hLabel(e.s)+'–'+hLabel(e.e)+(road.length?' · '+done+'/'+road.filter(function(r){return !r.pause;}).length:'')+'</span>':'')+'</button>';
    });
    if(x===t){ var nm=nowMin(); if(nm>=H0&&nm<=H1) h+='<div class="now-line" style="top:'+((nm-H0)*PX)+'px"></div>'; }
    h+='</div>';

function timedTasks(x){

}
function slotKey(d,e,r,ix){ return d+"|"+e.id+"|"+(r.task||(r.ref?r.ref.k+":"+r.ref.id:r.lab))+"|"+ix; }

function openSlot(dISO,id){
  var e=dayEvents(dISO).concat(timedTasks(dISO)).find(function(x){ return x.id===id; }); if(!e) return;
  var s=subj(e.sub), road=e.kind==="work"||e.anki||e.actu?roadFor(e,dISO):[];

  else if(e.kind==="exam"){ h+='<p class="muted" style="margin:0">Pale. Les révisions démarrent automatiquement à J-14 (réactivation, entraînement, consolidation).</p>'; }

  else{
    var tot=road.filter(function(r){ return !r.pause; }), dn=tot.filter(function(r){ return isDone(dISO,e,r,road.indexOf(r)); }).length;
    h+='<div class="'+s.cls+'"><div class="row" style="justify-content:space-between;margin-bottom:6px"><span class="small muted">Feuille de route</span><span class="small" style="font-weight:700">'+dn+'/'+tot.length+'</span></div><div class="bar"><i style="width:'+(tot.length?Math.round(dn/tot.length*100):0)+'%"></i></div></div><div class="road">';

      var dn1=isDone(dISO,e,r,ix), key=slotKey(dISO,e,r,ix);
      if(r.pause){ h+='<div class="road-it" style="background:var(--surface-2)"><span class="min">'+hLabel(fromMin(clock))+'</span><span class="lab muted">Pause '+r.min+' min · debout</span><span></span></div>'; clock+=r.min; return; }
      h+='<div class="road-it'+(dn1?" done":"")+'"><button class="check'+(dn1?" on":"")+'" data-a="road" data-k="'+esc(key)+'" data-task="'+(r.task||"")+'" data-ref="'+(r.ref&&r.ref.k!=="task"?esc(r.ref.k+":"+r.ref.id):"")+'" aria-label="Cocher">'+(dn1?I.check:"")+'</button><div><div class="lab">'+esc(r.lab)+'</div><div class="sub">'+hLabel(fromMin(clock))+' · '+r.min+' min'+(r.filler?" · proposition":"")+(r.partial?" · suite plus tard":"")+(r.late?' · <span style="color:var(--red)">en retard</span>':'')+(r.star?" · ★ classique":"")+'</div>'+(r.quiz&&!dn1?'<button class="btn tint sm" data-a="quiz" style="margin-top:6px">Lancer le quiz</button>':'')+(r.ref&&r.ref.k==="hgg"&&!dn1?'<div class="partial" style="margin-top:6px"><span class="sub">Pas fini ?</span>'+[25,50,75].map(function(v){ return '<button class="chip" data-a="partial" data-ref="hgg:'+esc(r.ref.id)+'" data-v="'+v+'">'+v+' %</button>'; }).join("")+'</div>':'')+(r.task&&!dn1?'<div class="partial" style="margin-top:6px"><span class="sub">Pas fini ?</span>'+[25,50,75].map(function(v){ return '<button class="chip" data-a="partial" data-task="'+r.task+'" data-v="'+v+'">'+v+' %</button>'; }).join("")+'</div>':'')+'</div>'+
        (dn1?'<span></span>':'<button class="timer'+(S.timers[key]?" run":"")+'" data-a="timer" data-k="'+esc(key)+'" data-task="'+(r.task||"")+'">'+(S.timers[key]?"0:00":"▶ "+r.min+"′")+'</button>')+'</div>';
      clock+=r.min;
    });
    h+='</div><p class="small muted" style="margin:0">Le chrono démarre quand tu commences une tâche et s\'arrête quand tu la coches : le temps réel nourrit le diagnostic.</p>';
  }
  h+='</div>';
  openSheet(h);
}

function quizPool(){
  var s=st(), out=[];
  Object.keys(s.mathsCours||{}).forEach(function(fid){ if(!s.files[fid]) return; (s.mathsCours[fid].items||[]).forEach(function(it,i){ if(s.quizOff[fid+"|"+it.section]) return; out.push({k:fid+"#"+i, it:it, fid:fid, chap:s.mathsCours[fid].chap}); }); });
  return out;
}
function quizPick(n){
  var s=st(), t=iso(today()), due=[], fresh=[], cur=mathsChap();
  quizPool().forEach(function(x){ var q=s.quiz[x.k]; if(!q) fresh.push(x); else if(q.n<=t) due.push(x); });
  due.sort(function(a,b){ return s.quiz[a.k].l-s.quiz[b.k].l; });
  fresh.sort(function(a,b){ return (b.chap===cur)-(a.chap===cur); });
  var out=due.slice(0,n); return out.concat(fresh.slice(0,Math.max(0,Math.min(5,n-out.length)))).map(function(x){ return x.k; });
}
function quizCard(){
  var s=st(), pool=quizPool(), t=iso(today());

  if(!pool.length) return h+'<div class="empty"><b>Pas encore de cours</b>Dépose ton cours (type « Cours ») : les définitions, propriétés et théorèmes sont relevés tels qu\'ils sont écrits.</div>'+quizSections()+'</section>';

}
function quizSections(){

var QINT=[1,2,4,8,16,32];
function quizSheet(){

  h+='</div>';

  openSheet(h+'</div>'); renderMath(layer);
}
function quizRate(v){
  var Q=S.quiz, s=st(), k=Q.list[Q.i], q=s.quiz[k]||{l:-1,h:[]}, t=today();
  var l=v===3?Math.min(5,q.l+2):v===2?Math.min(5,q.l+1):v===1?Math.max(0,q.l):0; if(l<0) l=0;
  q.l=l; q.n=iso(addDays(t, v>=2?QINT[l]:1)); q.d=iso(t); q.h=(q.h||[]).concat([v]).slice(-8); s.quiz[k]=q;
  Q.res[k]=v; if(v===0 && !Q.again[k]){ Q.again[k]=1; Q.list.push(k); }
  Q.i++; Q.show=false; save(); quizSheet();
}

function hggCurrent(){ var w=iso(addDays(today(),10)), b=iso(addDays(today(),-10)), Q=HGG_PROG.quinzaines, cur=Q.filter(function(q){ return q.debut<=w && q.fin>=b; });
  var last=cur.length?cur[cur.length-1]:null, nx=Q.filter(function(q){ return q.debut>(last?last.fin:iso(today())); })[0];
  if(nx){ nx=Object.assign({},nx,{next:true}); cur.push(nx); } return cur; }

/* ---------- BJcolle ---------- */
function n1(x){ return x==null?"–":(Math.round(x*10)/10).toString().replace(".",","); }
function agoLabel(t){ if(!t) return "jamais"; var m=Math.round((Date.now()-new Date(t))/60000); if(m<1) return "à l'instant"; if(m<60) return "il y a "+m+" min"; var h=Math.round(m/60); if(h<24) return "il y a "+h+" h"; return "le "+fmtLong(t.slice(0,10)); }
function colleurLine(name){
  if(typeof BJ==="undefined"||!name) return "";
  var c=BJ.colleur(BJ.colleurKey(name.split(/\s*\/\s*/)[0])); if(!c||!c.notes.length) return "";
  return "moyenne "+n1(c.moy)+" sur "+c.notes.length+" notes"+(c.moyMoi!=null?" · toi : "+n1(c.moyMoi):"")+(c.sujets?" · "+c.sujets+" sujets connus":"");
}
function bjColleRow(c,past){

  var bars=bins.map(function(b,i){ var hh=b/mx*60; return '<rect x="'+(i*w+1)+'" y="'+(66-hh)+'" width="'+(w-2)+'" height="'+hh+'" rx="1.5" fill="var(--blue)" opacity=".75"/>'; }).join("");
  var marks=(mine||[]).map(function(v){ var x=v/20*100; return '<line x1="'+x+'" x2="'+x+'" y1="2" y2="66" stroke="var(--red)" stroke-width="1.2" vector-effect="non-scaling-stroke"/>'; }).join("");

}

/* ---------- Notes ---------- */
var BJ_EP={"Mathématiques":"o-maths","Histoire-Géographie":"o-hgg","Français-Philosophie":"o-csh","Anglais LV1":"o-ang","Allemand LV1":"o-all","Entretiens de personnalité":"o-entretien"};
function bjNotes(id){ if(typeof BJ==="undefined") return []; return BJ.mine().filter(function(c){ return c.annee==="2026-2027" && c.note_num!=null && BJ_EP[c.discipline]===id; }).map(function(c){ return {id:"bj-"+c.id,ep:id,v:c.note_num,date:c.date,label:(c.type?c.type+" · ":"Colle · ")+(c.colleur||""),com:"",bj:true}; }); }
function notesOf(id){ return st().notes.filter(function(n){ return n.ep===id; }).concat(bjNotes(id)).sort(function(a,b){ return a.date.localeCompare(b.date); }); }
function avg(list){ if(!list.length) return null; return list.reduce(function(a,n){ return a+n.v; },0)/list.length; }
function f1(x){ return x==null?"–":(Math.round(x*10)/10).toFixed(1).replace(".",","); }
function spark(list,col){
  if(list.length<2) return '<svg viewBox="0 0 100 42" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="38" x2="100" y2="38" stroke="var(--line-strong)" stroke-dasharray="3 3"/></svg>';
  var lo=Math.min.apply(null,list.map(function(n){return n.v;}))-1, hi=Math.max.apply(null,list.map(function(n){return n.v;}))+1;
  var pts=list.map(function(n,i){ return [i/(list.length-1)*96+2, 38-(n.v-lo)/(hi-lo)*32]; });
  var d=pts.map(function(p,i){ return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1); }).join(" ");
  var last=pts[pts.length-1];
  return '<svg viewBox="0 0 100 42" preserveAspectRatio="none" aria-hidden="true"><path d="'+d+' L98 42 L2 42 Z" fill="'+col+'" opacity=".12"/><path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="'+last[0]+'" cy="'+last[1]+'" r="2.6" fill="'+col+'"/></svg>';
}
function vNotes(){
  var m=S.notesMode, eps=EPREUVES[m];
  var h=topbar("Notes")+'<div class="ag-head"><h1 class="large-title" style="margin:0">Notes</h1><div class="seg"><button class="'+(m==="ecrit"?"on":"")+'" data-a="notesmode" data-m="ecrit">Écrit</button><button class="'+(m==="oral"?"on":"")+'" data-a="notesmode" data-m="oral">Oral</button></div></div>';

  h+='<div class="grid g3">';
  eps.forEach(function(e){
    var ns=notesOf(e.id), a=avg(ns), s=subj(e.sub), last=ns.length?ns[ns.length-1].v:null;
    var tr=ns.length>=2?(ns[ns.length-1].v>=avg(ns.slice(0,-1))?"↗":"↘"):"";

  });
  h+='</div>';
  return h;
}

  var u=Sync.user(), h='<div class="sheet-h"><div class="ttl"><div class="eyebrow">Compte</div><h2>Synchronisation</h2></div><button class="icon-btn" data-a="close" aria-label="Fermer">'+I.close+'</button></div><div class="sheet-b">';
  if(!Sync.available()){
    h+='<div class="gem-msg">La synchronisation fonctionne dans l\'app installée, à l\'adresse alexandrenkvanrossum-ship-it.github.io/pr-pa. Ici, tes données restent sur cet appareil.</div>';
  } else if(u){
    h+='<div class="gem-msg"><b>'+esc(u.email)+'</b><div class="small muted" style="margin-top:4px">Tes tâches, notes, objectifs et ressentis sont synchronisés entre tes appareils.</div></div>';
    h+='<div class="row"><button class="btn tint" data-a="syncnow">Synchroniser maintenant</button><button class="btn" data-a="signout">Se déconnecter</button></div>';
  } else {
    h+='<p class="muted small" style="margin:0">Connecte-toi avec le même compte sur ton téléphone et ton ordi pour retrouver partout les mêmes données.</p>';
    h+='<form id="auth-form" class="stack" style="gap:10px"><div><label class="lbl" for="au-mail">E-mail</label><input class="field" id="au-mail" type="email" autocomplete="email" required></div><div><label class="lbl" for="au-pw">Mot de passe (8 caractères minimum)</label><input class="field" id="au-pw" type="password" minlength="8" autocomplete="current-password" required></div>'+
       '<div class="row"><button class="btn primary" type="submit" data-mode="in">Se connecter</button><button class="btn tint" type="submit" data-mode="up">Créer mon compte</button></div></form>';
  }
  if(msg) h+='<div class="note-box">'+esc(msg)+'</div>';
  h+='</div>';
  openSheet(h);
  var f=document.getElementById("auth-form");
  if(f){ var mode="in"; f.querySelectorAll("button[data-mode]").forEach(function(b){ b.addEventListener("click",function(){ mode=b.getAttribute("data-mode"); }); });
    f.addEventListener("submit",function(ev){ ev.preventDefault();
      var em=document.getElementById("au-mail").value.trim(), pw=document.getElementById("au-pw").value;
      (mode==="up"?Sync.signUp(em,pw):Sync.signIn(em,pw)).then(function(r){
        if(r.error){ accountSheet(r.error.message==="Invalid login credentials"?"E-mail ou mot de passe incorrect.":r.error.message); return; }
        if(mode==="up" && !(r.data&&r.data.session)){ accountSheet("Compte créé. Ouvre l'e-mail de confirmation reçu, puis reviens te connecter ici."); return; }
        closeSheet(); render(); toast("Connecté. Synchronisation en cours.");
      });
    });
  }
}

/* ---------- chronos ---------- */
var tickH=null;
function tickTimers(){
  if(tickH) clearInterval(tickH);
  tickH=setInterval(function(){
    document.querySelectorAll(".timer.run").forEach(function(b){ var k=b.getAttribute("data-k"), t0=S.timers[k]; if(!t0) return; var s=Math.floor((Date.now()-t0)/1000); b.textContent=Math.floor(s/60)+":"+pad(s%60); });
  },1000);
}

/* ---------- actions ---------- */
document.addEventListener("click",function(ev){
  var g=ev.target.closest("[data-go]"); if(g){ ev.preventDefault(); closeSheet(); go(g.getAttribute("data-go"),g.getAttribute("data-p")); return; }
  var b=ev.target.closest("[data-a]"); if(!b) return;
  var a=b.getAttribute("data-a"), s=st();
  if(a==="close"){ closeSheet(); render(); return; }
  if(a==="quick"){ quickSheet(); return; }
  if(a==="gemini"){ geminiSheet(); return; }
  if(a==="account"){ accountSheet(); return; }
  if(a==="news-retry"){ newsErr=null; var c=document.getElementById("news-card"); if(c) c.innerHTML=newsHTML(); loadNews(true); return; }
  if(a==="syncnow"){ Sync.syncNow().then(function(){ toast("Synchronisé."); }); return; }
  if(a==="signout"){ Sync.signOut().then(function(){ closeSheet(); render(); toast("Déconnecté. Tes données restent sur cet appareil."); }); return; }
  if(a==="unvac"){ var tv=s.tasks.find(function(x){return x.id===b.getAttribute("data-id");}); if(tv){ tv.vac=false; save(); if(typeof Plan!=="undefined") Plan.invalidate(); render(); toast("Remise dans la To-Do normale : elle sera planifiée."); } return; }
  if(a==="vaccopy"){ var txt=vacText(); (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(function(){ toast("Liste copiée : colle-la à Claude pour organiser tes vacances."); },function(){ sheetText(txt); }); return; }
  if(a==="toggle"){ var t=s.tasks.find(function(x){return x.id===b.getAttribute("data-id");}); if(t){ t.done=!t.done; t.doneAt=t.done?new Date().toISOString():null; save(); render(); } return; }
  if(a==="del"){ s.tasks=s.tasks.filter(function(x){return x.id!==b.getAttribute("data-id");}); save(); render(); toast("Tâche supprimée."); return; }
  if(a==="tfilter"){ S.todoFilter=b.getAttribute("data-f"); render(); return; }
  if(a==="csh-skip"){ s.cshSkip=(s.cshSkip||0)+1; save(); render(); return; }
  if(a==="agmode"){ S.agMode=b.getAttribute("data-m"); render(); return; }
  if(a==="agstep"){ S.agDate=iso(addDays(parseISO(S.agDate),+b.getAttribute("data-n"))); render(); return; }
  if(a==="agtoday"){ S.agDate=iso(today()); render(); return; }
  if(a==="agday"){ S.agDate=b.getAttribute("data-d"); render(); return; }
  if(a==="slot"){ openSlot(b.getAttribute("data-d"),b.getAttribute("data-id")); return; }
  if(a==="road"||a==="timer"||a==="partial"){
    var cur=layer.querySelector(".sheet"); var reopen=cur?cur.innerHTML:"";
    var tid=b.getAttribute("data-task"), k=b.getAttribute("data-k"), rf=b.getAttribute("data-ref");
    if(rf && a!=="timer"){ var rk=rf.slice(0,rf.indexOf(":")), rid=rf.slice(rf.indexOf(":")+1);
      if(a==="road"){ if(rk==="exo"){ if(s.mathsDone[rid]) delete s.mathsDone[rid]; else s.mathsDone[rid]=iso(today()); } else { var HH=hggState(); if(HH.done[rid]) delete HH.done[rid]; else HH.done[rid]=iso(today()); } delete S.timers[k]; }
      else { hggState().prog[rid]=+b.getAttribute("data-v"); toast("Noté : le reste du chapitre sera replanifié."); }
      save();
    } else if(a==="road"){
      if(tid){ var tk=s.tasks.find(function(x){return x.id===tid;}); if(tk){ tk.done=!tk.done; if(S.timers[k]){ tk.spent=(tk.spent||0)+Math.round((Date.now()-S.timers[k])/60000); delete S.timers[k]; } } }
      else { s.slotDone[k]=!s.slotDone[k]; delete S.timers[k]; }
      save();
    } else if(a==="timer"){ if(S.timers[k]) delete S.timers[k]; else S.timers[k]=Date.now(); }
    else { var tp=s.tasks.find(function(x){return x.id===tid;}); if(tp){ tp.progress=+b.getAttribute("data-v"); save(); toast("Noté : "+tp.progress+" % fait. Le reste sera replanifié."); } }
    var keep=S.timers; var m=reopen.match(/data-d="([^"]+)" data-id/) ;
    var last=layer.getAttribute("data-slot"); if(last){ var p=last.split("§"); openSlot(p[0],p[1]); S.timers=keep; tickTimers(); var sh=layer.querySelector(".sheet"); if(sh) sh.style.animation="none"; }
    return;
  }
  if(a==="echmode"){ S.echMode=b.getAttribute("data-m"); render(); return; }
  if(a==="bjcheck"){ BJ.checkNow().then(function(){ toast("Vérification lancée : résultat dans une minute."); }).catch(function(e){ toast(e&&e.message||"Vérification impossible."); }); return; }
  if(a==="bjread"){ BJ.markRead(); render(); return; }
  if(a==="bjmore"){ S.bjF.n+=120; render(); return; }
  if(a==="bjfclr"){ S.bjF.colleur=""; render(); return; }
  if(a==="bjfcol"){ S.bjF=S.bjF||{disc:"",annee:"",q:"",n:80}; S.bjF.colleur=b.getAttribute("data-p"); go("bjclasse"); return; }
  if(a==="bjsum"){ bjSummary(b.getAttribute("data-p")); return; }
  if(a==="notesmode"){ S.notesMode=b.getAttribute("data-m"); render(); return; }
  if(a==="methmode"){ S.methMode=b.getAttribute("data-m"); render(); return; }
  if(a==="notedetail"){ noteDetail(b.getAttribute("data-id")); return; }
  if(a==="addnote"){ addNoteSheet(b.getAttribute("data-ep")); return; }
  if(a==="delnote"){ s.notes=s.notes.filter(function(n){return n.id!==b.getAttribute("data-id");}); save(); noteDetail(b.getAttribute("data-ep")); render(); return; }
  if(a==="methode"){ methodeSheet(b.getAttribute("data-id")); return; }
  if(a==="ressenti"){ methodeSheet(b.getAttribute("data-id"),b.getAttribute("data-k"),b.getAttribute("data-l")); return; }
  if(a==="fopen"){ Files.open(b.getAttribute("data-id")); return; }
  if(a==="fdel"){ var fx=s.files[b.getAttribute("data-id")]; if(fx && confirmDel(fx)){ Files.remove(fx.id); Plan.invalidate(); render(); } return; }
  if(a==="freanalyse"){ var fid=b.getAttribute("data-id"); Files.analyze(fid).then(function(){ toast("Analyse terminée."); Plan.invalidate(); window.__prepaRefresh(); },function(e){ toast("Analyse impossible : "+(e&&e.message||e)); window.__prepaRefresh(); }); render(); return; }
  if(a==="exo"){ var ek=b.getAttribute("data-k"); if(s.mathsDone[ek]) delete s.mathsDone[ek]; else s.mathsDone[ek]=iso(today()); save(); render(); return; }
  if(a==="exomin"){ var em=b.getAttribute("data-k").split("#"), eo=((s.mathsEx[em[0]]||{}).exos||[])[+em[1]]; if(eo){ eo.minutes=Math.max(5,(eo.minutes||30)+(+b.getAttribute("data-v"))); eo.perso=true; save(); render(); } return; }
  if(a==="quiz"){ S.quiz=null; quizSheet(); return; }
  if(a==="qshow"){ S.quiz.show=true; quizSheet(); return; }
  if(a==="qrate"){ quizRate(+b.getAttribute("data-v")); return; }
  if(a==="hggask"){ hggState().ask=iso(today()); save(); render(); return; }
  if(a==="hggdone"){ var H2=hggState(), hk=b.getAttribute("data-k"); if(H2.done[hk]) delete H2.done[hk]; else H2.done[hk]=iso(today()); save(); render(); return; }
  if(a==="hggmin"){ var H3=hggState(), mk=b.getAttribute("data-k"); H3.min[mk]=Math.max(30,(H3.min[mk]||120)+(+b.getAttribute("data-v"))); save(); render(); return; }
  if(a==="resskip"){ var dz=resDismissed(); dz[b.getAttribute("data-k")]=1; try{ localStorage.setItem("prepa.resdone",JSON.stringify(dz)); }catch(e){} render(); return; }
});
document.addEventListener("input",function(ev){
  var r=ev.target.closest("[data-goal]"); if(!r) return;
  st().goals[r.getAttribute("data-goal")]=+r.value; save();
  var v=document.getElementById("goal-val"); if(v) v.textContent=f1(+r.value);
});
document.addEventListener("change",function(ev){ var r=ev.target.closest("[data-goal]"); if(r){ noteDetail(r.getAttribute("data-goal")); render(); return; }
  var id=ev.target.id;
  if(id==="bjf-disc"){ S.bjF.disc=ev.target.value; S.bjF.n=80; render(); }
  else if(id==="bjf-annee"){ S.bjF.annee=ev.target.value; S.bjF.n=80; render(); }
  else if(id==="bjf-q"){ S.bjF.q=ev.target.value; S.bjF.n=80; render(); }
  else if(id==="bjcf-disc"){ S.bjCF.disc=ev.target.value; render(); }
  else if(id==="m-chap"){ st().mathsCfg=st().mathsCfg||{}; st().mathsCfg.chap=ev.target.value.trim(); save(); render(); }
  else if(ev.target.hasAttribute("data-hggfait")){ var H=hggState(), k=ev.target.getAttribute("data-hggfait"); if(ev.target.checked) H.fait[k]=iso(today()); else delete H.fait[k]; H.ask=iso(today()); save(); render(); }
  else if(ev.target.hasAttribute("data-qsec")){ var qk=ev.target.getAttribute("data-qsec"); if(ev.target.checked) delete st().quizOff[qk]; else st().quizOff[qk]=true; save(); }
});
document.addEventListener("keydown",function(ev){ if(ev.key==="Escape" && layer.innerHTML){ closeSheet(); render(); } });
window.addEventListener("scroll",function(){ var tb=document.getElementById("topbar"); if(tb) tb.classList.toggle("scrolled",window.scrollY>40); },{passive:true});

/* mémorise le créneau ouvert pour pouvoir le rafraîchir */
var _openSlot=openSlot;
openSlot=function(d,id){ _openSlot(d,id); layer.setAttribute("data-slot",d+"§"+id); };
var _close=closeSheet;
closeSheet=function(){ _close(); layer.removeAttribute("data-slot"); };

/* ---------- démarrage ---------- */
function start(){
  shell(); seed();
  window.__prepaRefresh=function(){ var a=document.activeElement; if(layer.innerHTML || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) return; render(); };
  if(typeof Sync!=="undefined"){ var bjLoaded=false; Sync.on(function(stt,user){ var p=document.getElementById("sync-pill"); if(p) p.innerHTML=syncLabel(); if(user && !bjLoaded && typeof BJ!=="undefined"){ bjLoaded=true; BJ.load(); setInterval(function(){ if(document.visibilityState==="visible") BJ.load(); },10*60000); } }); Sync.init(); }
  if(typeof BJ!=="undefined") BJ.on(function(){ window.__prepaRefresh(); });
  var h=(location.hash||"").replace("#",""); if(h){ var p=h.split("-"); if(["home","agenda","todo","matieres","matiere","echeances","notes","methodo","plus","bjclasse","bjcolleurs","bjcolleur"].indexOf(p[0])>=0){ S.view=p[0]; S.param=p.length>1?decodeURIComponent(p.slice(1).join("-")):null; } }
  render();
  if("serviceWorker" in navigator && location.protocol==="https:" && !window.claude){ try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){} }
}
function confirmDel(f){ return window.confirm("Supprimer « "+f.name+" » ?"+(f.kind==="cours"?" Ses énoncés sortiront des quiz.":"")); }
window.__toast=toast;
window.__prepa={go:go, S:S, openSlot:function(d,i){ openSlot(d,i); }, quizSheet:quizSheet, methodeSheet:methodeSheet, closeSheet:function(){ closeSheet(); }};
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();
})();


</script>
