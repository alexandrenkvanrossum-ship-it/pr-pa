<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Prépa">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Prépa ECG2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Layout : barre latérale translucide (ordi) ou barre d'onglets en bas (téléphone), une colonne de travail centrée, fenêtres en verre dépoli par-dessus. Thème clair uniquement, à la demande d'Alexandre. */
:root{
  color-scheme:light;
  --bg:#F5F5F7;
  --surface:#FFFFFF;
  --surface-2:#FAFAFC;
  --fill:#F0F0F3;
  --line:rgba(60,60,67,.12);
  --line-strong:rgba(60,60,67,.2);
  --ink:#1D1D1F;
  --ink-2:#6E6E73;
  --ink-3:#A1A1A6;
  --blue:#0A7AFF;
  --blue-pale:#E6F1FF;
  --red:#E5484D;
  --red-pale:#FDECEC;
  --green:#2FA55A;
  --green-pale:#E7F6EC;
  --amber:#C27A0E;
  --amber-pale:#FFF3DC;
  --glass:rgba(255,255,255,.72);
  --glass-strong:rgba(255,255,255,.86);
  /* matières : fond pâle / accent */
  --maths:#FFF4D6; --maths-ink:#B97D0C;
  --hgg:#FDE6DF; --hgg-ink:#D2553A;
  --csh:#ECE9FB; --csh-ink:#6152D1;
  --ang:#E3F2FC; --ang-ink:#2685C7;
  --all:#E4E9F7; --all-ink:#2F4FA8;
  --perso:#EEF2EE; --perso-ink:#5A7562;
  --neutral:#F0F0F3; --neutral-ink:#6E6E73;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  --font-mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-xl:26px; --r-lg:20px; --r:16px; --r-sm:12px; --r-pill:999px;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04);
  --shadow-lift:0 2px 6px rgba(0,0,0,.06),0 18px 50px rgba(0,0,0,.12);
  --tabbar:64px;
  --ease:cubic-bezier(.22,.9,.3,1);
}
*{box-sizing:border-box}
html,body{background:var(--bg);height:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue);text-decoration:none}
:focus-visible{outline:2.5px solid rgba(10,122,255,.55);outline-offset:2px;border-radius:10px}
h1,h2,h3{text-wrap:balance;margin:0}
.tab{font-variant-numeric:tabular-nums}

/* ---------- coquille ---------- */
.shell{min-height:100%}
.side{display:none}
main.view{padding-inline:16px;padding-block:14px calc(var(--tabbar) + 34px + env(safe-area-inset-bottom,0px));max-width:980px;margin:0 auto}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;padding-block:10px;margin-inline:-16px;padding-inline:16px;background:transparent;transition:background .2s}
.topbar.scrolled{background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--line)}
.topbar .t-title{font-family:var(--font-display);font-weight:700;font-size:15px;opacity:0;transition:opacity .2s}
.topbar.scrolled .t-title{opacity:1}
.topbar .sp{flex:1}
.icon-btn{width:38px;height:38px;border-radius:var(--r-pill);border:0;background:var(--glass-strong);display:grid;place-items:center;color:var(--ink-2);box-shadow:inset 0 0 0 .5px var(--line);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px)}
.icon-btn:hover{color:var(--ink)}
.gem-btn{color:var(--blue)}
.large-title{font-family:var(--font-display);font-weight:700;font-size:32px;letter-spacing:-.022em;line-height:1.08;margin:2px 0 4px}
.subtitle{color:var(--ink-2);font-size:15px;margin:0 0 18px}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--glass);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--line)}
.tabbar nav{display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabbar);max-width:560px;margin:0 auto}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--ink-3);letter-spacing:.01em}
.tabbar button.on{color:var(--blue)}
.tabbar .plus{width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(10,122,255,.35);margin:auto}
.tabbar .plus-wrap{display:flex;align-items:center;justify-content:center}

@media (min-width:900px){
  .side{display:flex;flex-direction:column;gap:4px;position:fixed;inset:0 auto 0 0;width:240px;padding:calc(18px + env(safe-area-inset-top,0px)) 14px 18px;background:rgba(246,246,248,.78);backdrop-filter:saturate(180%) blur(22px);-webkit-backdrop-filter:saturate(180%) blur(22px);border-right:.5px solid var(--line);z-index:40}
  .side .brand{font-family:var(--font-display);font-weight:700;font-size:19px;letter-spacing:-.01em;padding:4px 10px 14px}
  .side .brand span{display:block;font-size:12px;font-weight:500;color:var(--ink-3);letter-spacing:0}
  .side button.nav{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 10px;border-radius:10px;font-weight:600;font-size:14px;color:var(--ink-2);text-align:left}
  .side button.nav:hover{background:rgba(0,0,0,.04)}
  .side button.nav.on{background:rgba(10,122,255,.1);color:var(--blue)}
  .side .grp{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:14px 10px 4px}
  .side .add-side{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--blue);color:#fff;border-radius:12px;padding:10px;font-weight:600}
  .tabbar{display:none}
  main.view{margin-left:240px;max-width:none;padding-inline:40px;padding-block:18px 48px}
  main.view>.inner{max-width:980px;margin:0 auto}
  .topbar{margin-inline:-40px;padding-inline:40px}
}

/* ---------- briques ---------- */
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr))}
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;border:.5px solid var(--line)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-h h2{font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.small{font-size:13px}
.link-btn{border:0;background:none;color:var(--blue);font-weight:600;font-size:14px;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;border-radius:var(--r-pill);padding:9px 16px;font-weight:600;font-size:14px;background:var(--fill);color:var(--ink)}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--blue);color:#fff}
.btn.tint{background:var(--blue-pale);color:var(--blue)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.danger{background:var(--red-pale);color:var(--red)}
.btn[disabled]{opacity:.45;cursor:default}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:3px 10px;font-size:12.5px;font-weight:600;background:var(--fill);color:var(--ink-2);white-space:nowrap;border:0}
.chip.on{background:var(--blue);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block}
.seg{display:inline-flex;background:rgba(118,118,128,.12);border-radius:10px;padding:2px}
.seg button{border:0;background:none;padding:6px 16px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--ink)}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
.empty{text-align:center;color:var(--ink-2);padding:22px 12px;font-size:14px}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:3px}
.note-box{background:var(--surface-2);border:.5px dashed var(--line-strong);border-radius:var(--r);padding:12px 14px;font-size:13.5px;color:var(--ink-2)}
input.field,select.field,textarea.field{width:100%;border:0;background:var(--fill);border-radius:12px;padding:11px 13px;outline:none;font-size:15px}
input.field:focus,select.field:focus,textarea.field:focus{box-shadow:0 0 0 3px rgba(10,122,255,.25);background:var(--surface)}
textarea.field{min-height:92px;resize:vertical;line-height:1.5}
label.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--ink-2);margin:0 0 5px 2px}

/* teintes par matière */
.s-maths{--s:var(--maths);--si:var(--maths-ink)}
.s-hgg{--s:var(--hgg);--si:var(--hgg-ink)}
.s-csh{--s:var(--csh);--si:var(--csh-ink)}
.s-ang{--s:var(--ang);--si:var(--ang-ink)}
.s-all{--s:var(--all);--si:var(--all-ink)}
.s-perso{--s:var(--perso);--si:var(--perso-ink)}
.s-neutral{--s:var(--neutral);--si:var(--neutral-ink)}
.tag{display:inline-flex;align-items:center;gap:5px;border-radius:var(--r-pill);padding:2px 9px;font-size:12px;font-weight:650;background:var(--s);color:var(--si);white-space:nowrap}

/* ---------- saisie de tâche ---------- */
.quick{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:6px 6px 6px 14px;display:flex;align-items:center;gap:8px}
.quick input{flex:1;border:0;outline:none;background:none;font-size:16px;padding:9px 0;min-width:0}
.quick .go{width:36px;height:36px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;flex:none}
.quick .go[disabled]{background:var(--fill);color:var(--ink-3)}
.parse{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.parse .chip{background:var(--surface);box-shadow:inset 0 0 0 .5px var(--line-strong)}
.parse .act{background:var(--blue-pale);color:var(--blue);box-shadow:none}
.parse select{border:0;background:var(--s,var(--fill));color:var(--si,var(--ink));border-radius:var(--r-pill);padding:3px 8px;font-size:12.5px;font-weight:650}

.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:flex-start;gap:12px;padding:11px 2px;border-bottom:.5px solid var(--line)}
.task:last-child{border-bottom:0}
.check{flex:none;width:23px;height:23px;border-radius:50%;border:1.6px solid var(--ink-3);background:none;display:grid;place-items:center;margin-top:1px;color:#fff;padding:0;transition:background .15s,border-color .15s}
.task.p1 .check{border-color:#E8A23A}
.task.p2 .check{border-color:#E8743A}
.task.p3 .check{border-color:var(--red);border-width:2.2px}
.check.on{background:var(--green);border-color:var(--green)}
.task .tt{flex:1;min-width:0}
.task .tt>span{font-weight:500;overflow-wrap:anywhere}
.task.done .tt>span{color:var(--ink-3);text-decoration:line-through}
.task .tm{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;align-items:center}
.meta{font-size:12.5px;color:var(--ink-2)}
.meta.late{color:var(--red);font-weight:600}
.prio{font-weight:800;font-size:12.5px;color:var(--red)}
.task .del{border:0;background:none;color:var(--ink-3);padding:2px 4px;border-radius:8px;opacity:.0;transition:opacity .15s}
.task:hover .del,.task:focus-within .del{opacity:1}
@media (hover:none){.task .del{opacity:.7}}
.group-h{font-size:13px;font-weight:700;color:var(--ink-2);margin:4px 2px 2px;display:flex;gap:8px;align-items:baseline}
.group-h .n{color:var(--ink-3);font-weight:600}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters .chip{background:var(--surface);box-shadow:inset 0 0 0 .5px var(--line)}
.filters .chip.on{background:var(--ink);color:#fff;box-shadow:none}

/* ---------- accueil ---------- */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.objs{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.objs li{display:flex;gap:10px;align-items:flex-start;font-weight:550}
.objs .n{flex:none;width:22px;height:22px;border-radius:50%;background:var(--blue-pale);color:var(--blue);font-size:12px;font-weight:800;display:grid;place-items:center}
.due{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r);background:var(--s,var(--fill))}
.due .when{font-weight:800;color:var(--si,var(--ink));font-size:13px;min-width:62px}
.due .what{font-weight:600;min-width:0}
.strip{display:flex;flex-direction:column;gap:6px}
.slot{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:stretch;border:0;background:none;padding:0;text-align:left;width:100%}
.slot .h{font-size:12.5px;color:var(--ink-3);padding-top:9px;font-weight:600}
.slot .b{background:var(--s);border-radius:var(--r-sm);padding:8px 12px;display:flex;justify-content:space-between;gap:8px;align-items:center;min-width:0;transition:transform .15s var(--ease)}
.slot .b b{color:var(--si);font-weight:700;font-size:14px}
.slot .b span{font-size:12.5px;color:var(--ink-2)}
.slot.now .b{box-shadow:0 0 0 2px var(--si)}
.slot.past{opacity:.5}
.slot:hover .b{transform:translateX(2px)}
.csh-pick{border-radius:var(--r-lg);padding:18px;background:linear-gradient(135deg,#F1EEFF,#E8EDFF);position:relative;overflow:hidden}
.csh-pick .eyebrow{color:var(--csh-ink)}
.csh-pick .oeuvre{font-family:var(--font-display);font-weight:800;font-size:clamp(22px,4.5vw,28px);letter-spacing:-.02em;line-height:1.12;margin:6px 0 6px;color:#2D2470}
.csh-pick .angle{color:#4B4380;max-width:60ch}
.news-empty{font-size:13.5px}

/* ---------- agenda ---------- */
.ag-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.ag-nav{display:flex;align-items:center;gap:6px}
.ag-nav .lbl-date{font-weight:700;font-size:15px;min-width:150px;text-align:center}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:12px}
.days::-webkit-scrollbar{display:none}
.days button{flex:1 0 44px;border:0;background:var(--surface);border-radius:14px;padding:7px 0;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:var(--shadow)}
.days button small{font-size:11px;color:var(--ink-3);font-weight:700;text-transform:uppercase}
.days button b{font-size:17px;font-family:var(--font-display)}
.days button.on{background:var(--ink);color:#fff}
.days button.on small{color:rgba(255,255,255,.7)}
.days button.today b{color:var(--blue)}
.days button.on.today b{color:#fff}
.cal{position:relative;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.cal-scroll{overflow-x:auto}
.cal-grid{display:grid;position:relative;min-width:100%}
.cal-hours{position:relative}
.cal-hours div{position:absolute;right:8px;font-size:11px;color:var(--ink-3);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.cal-col{position:relative;border-left:.5px solid var(--line)}
.cal-col .line{position:absolute;left:0;right:0;border-top:.5px solid var(--line)}
.cal-colh{position:sticky;top:0;z-index:3;background:var(--glass-strong);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);text-align:center;font-size:12px;font-weight:700;padding:7px 0;border-bottom:.5px solid var(--line);border-left:.5px solid var(--line)}
.cal-colh.today{color:var(--blue)}
.ev{position:absolute;left:3px;right:3px;border:0;border-radius:9px;background:var(--s);color:var(--si);padding:4px 7px;text-align:left;overflow:hidden;font-size:12px;line-height:1.25;display:flex;flex-direction:column;gap:1px;border-left:3px solid var(--si)}
.ev b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev span{color:var(--ink-2);font-size:11px;white-space:nowrap}
.ev.course{border-left-width:0;background:repeating-linear-gradient(135deg,var(--s) 0 8px,color-mix(in srgb,var(--s) 70%,white) 8px 16px)}
.ev.fixed{background:var(--fill);color:var(--ink-2);border-left-color:var(--ink-3)}
.ev.exam{background:var(--red-pale);color:var(--red);border-left-color:var(--red)}
.ev:hover{filter:brightness(.98);z-index:2}
.now-line{position:absolute;left:0;right:0;border-top:2px solid var(--red);z-index:4;pointer-events:none}
.now-line::before{content:"";position:absolute;left:-4px;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}

/* ---------- feuille (sheet) ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:80;animation:fade .2s ease}
.sheet{position:fixed;z-index:81;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:min(86vh,760px);display:flex;flex-direction:column;background:var(--glass-strong);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-radius:var(--r-xl);box-shadow:var(--shadow-lift);animation:pop .28s var(--ease);overflow:hidden}
.sheet-h{display:flex;align-items:flex-start;gap:10px;padding:18px 18px 10px}
.sheet-h .ttl{flex:1;min-width:0}
.sheet-h h2{font-family:var(--font-display);font-size:21px;font-weight:700;letter-spacing:-.015em}
.sheet-b{overflow-y:auto;padding:4px 18px 20px;display:flex;flex-direction:column;gap:12px}
.sheet .band{height:6px;background:var(--si,var(--blue));opacity:.8}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:599px){
  .sheet{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:88vh;border-radius:var(--r-xl) var(--r-xl) 0 0;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .32s var(--ease)}
  @keyframes up{from{transform:translateY(40px);opacity:.3}to{transform:none;opacity:1}}
}
.road{display:flex;flex-direction:column;gap:8px}
.road-it{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border-radius:var(--r);padding:11px 12px;box-shadow:inset 0 0 0 .5px var(--line)}
.road-it .min{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink-2);font-size:13px}
.road-it.done .lab{color:var(--ink-3);text-decoration:line-through}
.road-it .lab{font-weight:550;min-width:0;overflow-wrap:anywhere}
.road-it .sub{font-size:12px;color:var(--ink-3)}
.timer{border:0;background:var(--fill);border-radius:var(--r-pill);padding:5px 10px;font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.timer.run{background:var(--blue);color:#fff}
.partial{display:flex;gap:6px;flex-wrap:wrap;grid-column:2 / -1}
.bar{height:6px;border-radius:99px;background:var(--fill);overflow:hidden}
.bar i{display:block;height:100%;background:var(--si,var(--blue));border-radius:99px;transition:width .3s var(--ease)}

/* ---------- matières ---------- */
.subj{border:0;text-align:left;background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-height:150px;transition:transform .2s var(--ease),box-shadow .2s}
.subj:hover{transform:translateY(-2px);box-shadow:var(--shadow-lift)}
.subj .ic{width:44px;height:44px;border-radius:14px;background:var(--s);color:var(--si);display:grid;place-items:center;font-weight:800;font-size:15px}
.subj h3{font-family:var(--font-display);font-size:19px;font-weight:700}
.subj p{margin:0;color:var(--ink-2);font-size:13.5px}
.subj .foot{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap}
.hero-subj{border-radius:var(--r-xl);padding:20px;background:var(--s);color:var(--si)}
.hero-subj h1{font-family:var(--font-display);font-size:30px;font-weight:800;letter-spacing:-.02em;color:var(--si)}
.hero-subj p{margin:6px 0 0;color:var(--ink-2);max-width:60ch}
.ext{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow)}
.ext b{display:block}
.sous{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- notes ---------- */
.tile{border:0;text-align:left;background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile .name{font-weight:700;font-size:14px}
.tile .avg{font-family:var(--font-display);font-size:34px;font-weight:800;letter-spacing:-.03em;color:var(--si);font-variant-numeric:tabular-nums;line-height:1}
.tile .avg small{font-size:15px;color:var(--ink-3);font-weight:600}
.tile .coef{font-size:11.5px;font-weight:700;color:var(--ink-3)}
.tile svg{width:100%;height:42px;display:block}
.overall{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.overall .big{font-family:var(--font-display);font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.ruler{position:relative;height:56px;margin:18px 6px 6px}
.ruler .track{position:absolute;left:0;right:0;top:26px;height:6px;border-radius:99px;background:linear-gradient(90deg,#F4F4F6,#E9E9EE)}
.ruler .tick{position:absolute;top:36px;font-size:10.5px;color:var(--ink-3);transform:translateX(-50%);font-variant-numeric:tabular-nums}
.ruler .mk{position:absolute;top:10px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;white-space:nowrap}
.ruler .mk i{width:3px;height:22px;border-radius:2px;display:block}
.ruler .mk.avg i{background:var(--si)} .ruler .mk.avg{color:var(--si)}
.ruler .mk.last i{background:var(--ink-2)} .ruler .mk.last{color:var(--ink-2)}
.ruler .mk.bar i{background:var(--red)} .ruler .mk.bar{color:var(--red)}
.ruler .mk.goal i{background:var(--green)} .ruler .mk.goal{color:var(--green)}
.ruler .mk.up{top:-8px;flex-direction:column-reverse}
.notes-list{display:flex;flex-direction:column}
.notes-list .it{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:.5px solid var(--line);align-items:center}
.notes-list .it:last-child{border-bottom:0}
.notes-list .v{font-weight:800;font-variant-numeric:tabular-nums}

/* ---------- échéances ---------- */
.ech{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:11px 0;border-bottom:.5px solid var(--line)}
.ech:last-child{border-bottom:0}
.ech .d{text-align:center;background:var(--s,var(--fill));border-radius:12px;padding:6px 0}
.ech .d b{display:block;font-family:var(--font-display);font-size:20px;line-height:1;color:var(--si,var(--ink))}
.ech .d small{font-size:10.5px;font-weight:700;text-transform:uppercase;color:var(--si,var(--ink-2))}
.ech .w{font-weight:650}
.ech .cd{font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.ech .cd.soon{color:var(--red)}
.ech.off{opacity:.55}

/* ---------- divers ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--tabbar) + 18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(29,29,31,.92);color:#fff;padding:10px 18px;border-radius:var(--r-pill);font-weight:600;font-size:14px;z-index:95;max-width:calc(100% - 32px);box-shadow:var(--shadow-lift);animation:fade .2s}
@media (min-width:900px){.toast{bottom:24px;left:calc(50% + 120px)}}
.page-enter{animation:enter .35s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.badge-ex{font-size:11px;font-weight:700;color:var(--amber);background:var(--amber-pale);border-radius:6px;padding:1px 6px}
.gem-msg{background:var(--surface);border-radius:var(--r);padding:12px 14px;box-shadow:inset 0 0 0 .5px var(--line)}

.sync-pill{display:inline-flex;align-items:center;gap:7px;height:32px;border:0;border-radius:var(--r-pill);padding:0 12px;background:var(--glass-strong);box-shadow:inset 0 0 0 .5px var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px)}
.sync-pill .sd{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.sync-pill .sd.ok{background:var(--green)} .sync-pill .sd.run{background:var(--blue)} .sync-pill .sd.warn{background:var(--amber)}

function pad(n){ return (n<10?"0":"")+n; }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }

    if(!m[1] && h<7){ if(out.dur!=null) return false; out.dur=h*60+mi; return; }
    out.time=pad(h)+":"+pad(mi);
  });
  var longHint=/\((tres )?long\)|\blong(ue)?\b/.test(norm(s)), shortHint=/\(court\)|\bcourt(e)?\b/.test(norm(s));

  /* dates : « pour X » = échéance ; sinon jour à faire */
  function setDate(d, isDue){ if(isDue) out.due=iso(d); else out.day=iso(d); }
  var rules=[
    [/\s(pour\s+)?(aujourd'hui|aujourdhui|ce soir|ce midi|ce matin)(?=\s)/, function(m){ return t0; }],
    [/\s(pour\s+)?(apres-demain|apres demain)(?=\s)/, function(){ return addDays(t0,2); }],
    [/\s(pour\s+)?(demain)(?=\s)/, function(){ return addDays(t0,1); }],
    [/\s(pour\s+)?dans\s+(\d+)\s+(jours?|semaines?)(?=\s)/, function(m){ return addDays(t0,(/^sem/.test(m[3])?7:1)*+m[2]); }],
    [/\s(pour\s+)?(ce week-end|ce weekend|ce we)(?=\s)/, function(){ var d=new Date(t0); var k=(6-d.getDay()+7)%7; return addDays(d,k); }],
    [/\s(pour\s+)?(?:le\s+)?(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)(\s+prochain)?(?=\s)/, function(m){ var w=WD[m[2]], diff=(w-t0.getDay()+7)%7; if(diff===0) diff=7; return addDays(t0,diff); }],
    [/\s(pour\s+)?(?:le\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/, function(m){ var y=m[4]?(+m[4]<100?2000+ +m[4]:+m[4]):t0.getFullYear(); var d=new Date(y,+m[3]-1,+m[2]); if(!m[4]&&d<t0) d.setFullYear(y+1); return d; }],
    [/\s(pour\s+)?(?:le\s+)?(\d{1,2})(?:er)?\s+(janvier|janv|fevrier|fevr|fev|mars|avril|avr|mai|juin|juillet|juil|aout|septembre|sept|octobre|oct|novembre|nov|decembre|dec)\.?(?=\s)/, function(m){ var d=new Date(t0.getFullYear(),MO[m[3]],+m[2]); if(d<t0) d.setFullYear(d.getFullYear()+1); return d; }]
  ];
  for(var i=0;i<rules.length;i++){
    var n=norm(s), m=n.match(rules[i][0]);
    if(m){ var d=rules[i][1](m); setDate(d, !!m[1]); out.tokens.push(s.substr(m.index,m[0].length).trim()); s=s.slice(0,m.index)+" "+s.slice(m.index+m[0].length); break; }
  }

  var n2=norm(s);
  /* actions reconnues par mot-clé */
  var km;
  if((km=n2.match(/^\s*(ref|reference)\b\s*:?\s*/))){ out.action="csh-oeuvre"; out.sub="csh"; out.type="Œuvre"; s=s.replace(/^\s*r[ée]f(?:[ée]rence)?\s*:?\s*/i," "); }
  else if((km=n2.match(/^\s*(ex|exemple|concept)\b\s*:?\s*/))){ out.action="hgg-fiche"; out.sub="hgg"; out.type=km[1]==="concept"?"Concept":"Exemple"; s=s.replace(/^\s*(ex(?:emple)?|concept)\s*:?\s*/i," "); }
  else if((km=n2.match(/^\s*civi\b\s*:?\s*/))){ out.action="civi"; out.type="CIVI"; s=s.replace(/^\s*civi\s*:?\s*/i," "); }
  if(!out.action && /\b(rdv|rendez-vous|rendez vous|ne pas oublier|rappel|appeler|medecin|dentiste)\b/.test(n2)){ out.action="rappel"; out.sub=out.sub||"perso"; out.type="Rendez-vous"; }
  if(!out.action && /\bdm\b/.test(n2)){ out.action="dm"; }

  if(!out.sub){ for(var j=0;j<SUBJ_WORDS.length;j++){ if(SUBJ_WORDS[j][1].test(n2)){ out.sub=SUBJ_WORDS[j][0]; break; } } }
  if(out.action==="civi" && !out.sub) out.sub=/\b(deutsch|allemagne|afd|bundestag|berlin|merz)\b/.test(n2)?"all":"ang";
  if(out.action==="dm" && !out.sub) out.sub="maths";
  if(!out.type){ for(var k=0;k<TYPES.length;k++){ if(TYPES[k][1].test(n2)){ out.type=TYPES[k][0]; if(out.dur==null) out.dur=TYPES[k][2]; break; } } }
  if(out.action==="csh-oeuvre" && out.dur==null) out.dur=60;
  if(out.action==="hgg-fiche" && out.dur==null) out.dur=20;
  if(out.action==="civi" && out.dur==null) out.dur=10;
  if(out.dur!=null && !/\d\s*(min|mn|h)/.test(norm(raw))){ if(longHint) out.dur=Math.round(out.dur*1.5); if(shortHint) out.dur=Math.round(out.dur*0.6); }
  if(out.type==="Lecture" && /\b(texte|article|extrait|poeme)\b/.test(n2) && !/\d\s*(min|mn|h)/.test(norm(raw))) out.dur=longHint?15:10;
  if(out.action==="rappel" && !out.day && !out.due && out.time) out.day=iso(t0);

  if(out.action==="rappel") s=s.replace(/\bne pas oublier\s+(de\s+|le\s+|la\s+|les\s+|l')?/i," ").replace(/\brdv\b/i,"RDV");
  out.title=s.replace(/\(\s*\)/g,"").replace(/\s+/g," ").replace(/^[\s:,-]+|[\s:,-]+$/g,"").trim();
  if(out.title) out.title=out.title.charAt(0).toUpperCase()+out.title.slice(1);
  return out;
}



/* Synchronisation Supabase : le stockage local reste la copie de travail (hors ligne),
   chaque élément est un document (kind, id, data) dans la table docs, protégée par compte. */
var SUPA_URL = "https://fdiswyamvqvqwrsvzwgf.supabase.co";
var SUPA_KEY = "sb_publishable_SCyWlsrbFi_Ogn-gPENJow_c6gvZjeG";

var Sync = (function(){
  var sb=null, user=null, status="local", listeners=[], pushT=null, channel=null, busy=false;
  var SNAP="prepa.synced.v1";
  function emit(){ listeners.forEach(function(f){ try{ f(status,user); }catch(e){} }); }
  function setStatus(s){ status=s; emit(); }
  function snapGet(){ try{ return JSON.parse(localStorage.getItem(SNAP)||"{}"); }catch(e){ return {}; } }
  function snapSet(m){ try{ localStorage.setItem(SNAP,JSON.stringify(m)); }catch(e){} }

  /* état local -> documents */
  function toDocs(s){
    var m={};
    s.tasks.forEach(function(t){ m["task|"+t.id]=t; });
    s.notes.forEach(function(n){ m["note|"+n.id]=n; });
    m["state|goals"]=s.goals||{};
    m["state|ressentis"]=s.ressentis||{};
    m["state|slotDone"]=s.slotDone||{};
    m["state|meta"]={cshSkip:s.cshSkip||0,seeded:!!s.seeded};
    return m;
  }
  function applyDoc(s,kind,id,data,deleted){
    if(kind==="task"||kind==="note"){
      var arr=kind==="task"?s.tasks:s.notes, i=arr.findIndex(function(x){ return x.id===id; });
      if(deleted){ if(i>=0) arr.splice(i,1); return; }
      if(i>=0) arr[i]=data; else arr.push(data);
    } else if(kind==="state"){
      if(deleted) return;
      if(id==="meta"){ s.cshSkip=data.cshSkip||0; s.seeded=s.seeded||!!data.seeded; }
      else s[id]=data||{};
    }
  }

  function init(){
    if(!window.supabase || !window.supabase.createClient){ setStatus("local"); return; }
    try{ sb=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{persistSession:true,autoRefreshToken:true}}); }catch(e){ setStatus("local"); return; }
    sb.auth.getSession().then(function(r){ user=r.data&&r.data.session?r.data.session.user:null; if(user) start(); else setStatus("signedout"); });
    sb.auth.onAuthStateChange(function(ev,session){ var u=session?session.user:null; var changed=(u&&u.id)!==(user&&user.id); user=u; if(user&&changed) start(); if(!user){ stopRealtime(); setStatus("signedout"); } });
    window.addEventListener("online",function(){ if(user) pull().then(push); });
  }

  function start(){ setStatus("syncing"); pull(true).then(push).then(realtime).catch(function(){ setStatus("offline"); }); }

  function pull(first){
    if(!sb||!user) return Promise.resolve();
    return sb.from("docs").select("kind,id,data,deleted,updated_at").then(function(r){
      if(r.error) throw r.error;
      var s=Store.get(), snap=snapGet(), local=toDocs(s);
      if(first && r.data.length){ var keys={}; r.data.forEach(function(row){ keys[row.kind+"|"+row.id]=1; }); s.tasks=s.tasks.filter(function(t){ return !t.example || keys["task|"+t.id]; }); }
      r.data.forEach(function(row){
        var key=row.kind+"|"+row.id, localJson=JSON.stringify(local[key]), remoteJson=JSON.stringify(row.data);
        /* modifié localement depuis la dernière synchro et pas à distance : on garde le local */
        var localDirty=snap[key]!==undefined && snap[key]!==localJson;
        if(localDirty && snap[key]===remoteJson) return;
        applyDoc(s,row.kind,row.id,row.data,row.deleted);
        if(row.deleted) delete snap[key]; else snap[key]=remoteJson;
      });
      snapSet(snap); Store.save(true);
      if(window.__prepaRefresh) window.__prepaRefresh();
      setStatus(navigator.onLine===false?"offline":"synced");
    });
  }

  function push(){
    if(!sb||!user||busy) return Promise.resolve();
    var s=Store.get(), snap=snapGet(), docs=toDocs(s), rows=[], now=new Date().toISOString();
    Object.keys(docs).forEach(function(key){ var j=JSON.stringify(docs[key]); if(snap[key]!==j){ var p=key.split("|"); rows.push({kind:p[0],id:p[1],data:docs[key],deleted:false,updated_at:now}); } });
    Object.keys(snap).forEach(function(key){ if(!(key in docs)){ var p=key.split("|"); rows.push({kind:p[0],id:p[1],data:{},deleted:true,updated_at:now}); } });
    if(!rows.length){ setStatus("synced"); return Promise.resolve(); }
    busy=true; setStatus("syncing");
    return sb.from("docs").upsert(rows,{onConflict:"user_id,kind,id"}).then(function(r){
      busy=false;
      if(r.error){ setStatus("offline"); return; }
      var sn=snapGet();
      rows.forEach(function(row){ var key=row.kind+"|"+row.id; if(row.deleted) delete sn[key]; else sn[key]=JSON.stringify(row.data); });
      snapSet(sn); setStatus("synced");
    },function(){ busy=false; setStatus("offline"); });
  }

  function realtime(){
    if(!sb||!user||channel) return;
    channel=sb.channel("docs-"+user.id).on("postgres_changes",{event:"*",schema:"public",table:"docs",filter:"user_id=eq."+user.id},function(p){
      var row=p.new; if(!row||!row.kind) return;
      var s=Store.get(), key=row.kind+"|"+row.id, snap=snapGet(), j=JSON.stringify(row.data);
      if(snap[key]===j && !row.deleted) return;
      applyDoc(s,row.kind,row.id,row.data,row.deleted);
      if(row.deleted) delete snap[key]; else snap[key]=j;
      snapSet(snap); Store.save(true);
      if(window.__prepaRefresh) window.__prepaRefresh();
    }).subscribe();
  }
  function stopRealtime(){ if(channel&&sb){ try{ sb.removeChannel(channel); }catch(e){} } channel=null; }

  function schedule(){ if(!user) return; clearTimeout(pushT); pushT=setTimeout(push,700); }

  function signIn(email,pw){ return sb.auth.signInWithPassword({email:email,password:pw}); }
  function signUp(email,pw){ return sb.auth.signUp({email:email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}}); }
  function signOut(){ stopRealtime(); return sb.auth.signOut(); }

  return {init:init, schedule:schedule, on:function(f){ listeners.push(f); f(status,user); }, status:function(){ return status; }, user:function(){ return user; }, available:function(){ return !!sb; }, signIn:signIn, signUp:signUp, signOut:signOut, syncNow:function(){ return pull().then(push); }};
})();

function inVacances(dISO){ for(var i=0;i<VACANCES.length;i++){ if(dISO>=VACANCES[i].from && dISO<=VACANCES[i].to) return VACANCES[i]; } return null; }
function forumWeek(dISO){ return (Math.round(diffDays(dISO,FORUM_REF)/7)%2)===0; }
function paleOn(dISO){ return PALES.filter(function(p){ return p.date===dISO; }); }

function dayEvents(dISO){
  var d=parseISO(dISO), wd=d.getDay(), vac=inVacances(dISO), ev=[], pales=paleOn(dISO);
  var schoolDay=!vac && wd>=1 && wd<=6;
  function add(o){ o.id=o.id||(o.kind+"-"+o.s+"-"+o.t); ev.push(o); }
  if(schoolDay){
    if(wd<=6) add({kind:"fixed",s:"07:30",e:"08:10",t:"Anki anglais + allemand",sub:"neutral",anki:true});
    COURSES.forEach(function(c){
      if(c.d!==wd) return;
      if(c.forum && !forumWeek(dISO)){ add({kind:"work",s:c.s,e:c.e,t:"Travail (pas de Forum)",sub:"hgg",subs:["hgg","csh","ang","all"]}); return; }
      add({kind:"course",s:c.s,e:c.e,t:c.t,sub:c.sub});
    });
    add({kind:"fixed",s:"12:30",e:"13:00",t:"Déjeuner",sub:"neutral"});
  }
  pales.forEach(function(p){ add({kind:"exam",s:p.s,e:p.e,t:"DST · "+p.t,sub:p.sub}); });
  if(!vac){
    (WORK[wd]||[]).forEach(function(w){
      if(wd===6 && pales.length){ return; }
      var o={}; for(var k in w) o[k]=w[k]; o.kind="work"; add(o);
    });
    if(wd===6 && pales.length) add({kind:"fixed",s:"13:00",e:"13:25",t:"Anki (facultatif)",sub:"neutral",anki:true});
  }
  if(!(wd===6 && pales.length)){
    add({kind:"fixed",s:"20:00",e:"20:40",t:"Dîner",sub:"neutral"});
    if(!vac || wd!==6) add({kind:"fixed",s:"23:00",e:"23:20",t:"Actualité",sub:"neutral",actu:true});
  }
  ev.sort(function(a,b){ return toMin(a.s)-toMin(b.s); });
  return ev;
}

/* Tâches à placer : priorité, échéance, jour prévu */
function openTasks(subs){
  var st=Store.get();
  return st.tasks.filter(function(t){ return !t.done && !t.time && subs.indexOf(t.sub)>=0; })
    .sort(function(a,b){ return (b.prio||0)-(a.prio||0) || String(a.day||a.due||"9999").localeCompare(String(b.day||b.due||"9999")); });
}

function roadFor(ev,dISO){
  var items=[], cap=toMin(ev.e)-toMin(ev.s), used=0;
  function push(o){ items.push(o); used+=o.min; }
  if(ev.anki){ push({lab:"Anki anglais",min:20}); push({lab:"Anki allemand",min:20}); return items; }
  if(ev.actu){ push({lab:"Lecture de l'actualité (HGG et langues)",min:20}); return items; }
  if(ev.kind!=="work") return items;
  var subs=ev.subs||[ev.sub];
  if(ev.sub==="maths" && ev.crit) push({lab:"Quiz de cours (partie vue en classe)",min:15,sub:"maths"});
  if(ev.rac) push({lab:"RAC d'anglais (objectif : 2h, puis 1h45)",min:110,sub:"ang"});
  if(ev.plan) push({lab:"Plan détaillé d'HGG (sujet de la semaine)",min:90,sub:"hgg"});
  if(ev.trad){ push({lab:"Traduction d'anglais",min:30,sub:"ang"}); push({lab:"Traduction d'allemand",min:30,sub:"all"}); }
  var pauseEvery=ev.crit?30:55, pauseLen=ev.crit?5:10, sinceP=0;
  var wd=parseISO(dISO).getDay(), dmDay=(wd===4||wd===5||wd===0);
  openTasks(subs).forEach(function(t){
    if(used>=cap-5) return;
    if(t.action==="dm" && !dmDay) return; /* DM : jeudi, vendredi, dimanche */
    var left=cap-used, m=Math.min(t.action==="dm"?Math.min(t.dur||120,120):(t.dur||30),left);
    if(m<10) return;
    if(sinceP+m>pauseEvery && items.length && used+pauseLen<cap){ push({lab:"Pause",min:pauseLen,pause:true}); sinceP=0; }
    push({lab:t.title+(t.action==="dm"?" (une partie)":""),min:m,task:t.id,sub:t.sub,partial:m<(t.dur||30)}); sinceP+=m;
  });
  if(used<cap-10){
    var fill={maths:"Exercices du chapitre en cours (banque d'exercices à importer)",hgg:ev.soir?"HGG : travail actif d'abord (plan, problématique), lecture de fiches à la fin":"HGG : fiches et exemples",csh:"Œuvre du jour (encart CSH)",ang:"Anki d'anglais et CIVI",all:"Anki d'allemand et CIVI"}[ev.sub]||"Travail libre";
    if(sinceP>pauseEvery-10 && used+pauseLen<cap){ push({lab:"Pause",min:pauseLen,pause:true}); }
    push({lab:fill,min:cap-used,sub:ev.sub,filler:true});
  }
  return items;
}

function upcomingPales(n){ var t=iso(today()); return PALES.filter(function(p){ return p.date>=t; }).slice(0,n||99); }
function dayObjectives(dISO){
  var s=st(), out=[];
  var next=upcomingPales(1)[0];
  if(next){ var dd=diffDays(next.date,dISO); if(dd>=0 && dd<=7) out.push({t:"Préparer le DST de "+next.t.replace(/^Concours blanc · /,"")+" ("+relDay(next.date).toLowerCase()+")",sub:next.sub}); }
  s.tasks.filter(function(t){ return !t.done && (t.day===dISO || (t.due && diffDays(t.due,dISO)<=2 && diffDays(t.due,dISO)>=0)); })
    .sort(function(a,b){ return (b.prio||0)-(a.prio||0); })
    .forEach(function(t){ if(out.length<3) out.push({t:t.title+(t.due?" (pour "+relDay(t.due).toLowerCase()+")":""),sub:t.sub}); });
  if(out.length<3){ dayEvents(dISO).filter(function(e){ return e.kind==="work"; }).forEach(function(e){ if(out.length<3 && !out.some(function(o){return o.sub===e.sub;})) out.push({t:e.t+" de "+hLabel(e.s)+" à "+hLabel(e.e),sub:e.sub}); }); }
  return out.slice(0,3);
}
function dueToday(dISO){
  var s=st(), out=[];
  paleOn(dISO).forEach(function(p){ out.push({when:hLabel(p.s),t:"DST · "+p.t,sub:p.sub}); });
  s.tasks.filter(function(t){ return !t.done && t.time && t.day===dISO; }).forEach(function(t){ out.push({when:hLabel(t.time),t:t.title+" · rappel "+t.remind+" min avant",sub:t.sub}); });
  s.tasks.filter(function(t){ return !t.done && t.due===dISO; }).forEach(function(t){ out.push({when:"Pour auj.",t:t.title,sub:t.sub}); });
  return out;
}

}
function hasCSH(dISO){ return dayEvents(dISO).some(function(e){ return e.kind==="work" && (e.sub==="csh"||(e.subs||[]).indexOf("csh")>=0); }); }

function notesOf(id){ return st().notes.filter(function(n){ return n.ep===id; }).sort(function(a,b){ return a.date.localeCompare(b.date); }); }
function avg(list){ if(!list.length) return null; return list.reduce(function(a,n){ return a+n.v; },0)/list.length; }
function f1(x){ return x==null?"–":(Math.round(x*10)/10).toFixed(1).replace(".",","); }
function spark(list,col){
  if(list.length<2) return '<svg viewBox="0 0 100 42" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="38" x2="100" y2="38" stroke="var(--line-strong)" stroke-dasharray="3 3"/></svg>';
  var lo=Math.min.apply(null,list.map(function(n){return n.v;}))-1, hi=Math.max.apply(null,list.map(function(n){return n.v;}))+1;

  var d=pts.map(function(p,i){ return (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1); }).join(" ");

function addNoteSheet(ep){
  var all=EPREUVES.ecrit.map(function(e){return ["Écrit",e];}).concat(EPREUVES.oral.map(function(e){return ["Oral",e];}));
  var h='<div class="sheet-h"><div class="ttl"><h2>Nouvelle note</h2></div><button class="icon-btn" data-a="close" aria-label="Fermer">'+I.close+'</button></div><form class="sheet-b" id="note-form">';
  h+='<div><label class="lbl" for="n-ep">Épreuve</label><select class="field" id="n-ep">'+all.map(function(x){ return '<option value="'+x[1].id+'"'+(x[1].id===(ep||(S.notesMode==="ecrit"?"e-maths":"o-maths"))?" selected":"")+'>'+x[0]+' · '+esc(x[1].name)+'</option>'; }).join("")+'</select></div>';
  h+='<div id="n-type-wrap"></div><div class="grid" style="grid-template-columns:1fr 1fr;gap:10px"><div><label class="lbl" for="n-v">Note /20</label><input class="field tab" id="n-v" inputmode="decimal" placeholder="13,5" required></div><div><label class="lbl" for="n-date">Date</label><input class="field" id="n-date" type="date" value="'+iso(today())+'" required></div></div>';
  h+='<div><label class="lbl" for="n-label">Intitulé (facultatif)</label><input class="field" id="n-label" placeholder="DST n°3, colle de M. X…"></div><div><label class="lbl" for="n-com">Commentaire (facultatif)</label><input class="field" id="n-com"></div>';
  h+='<button class="btn primary" type="submit">Enregistrer</button></form>';
  openSheet(h);
  var sel=document.getElementById("n-ep"), wrap=document.getElementById("n-type-wrap");
  function types(){ var e=EPREUVES.ecrit.concat(EPREUVES.oral).find(function(x){return x.id===sel.value;}); wrap.innerHTML=e&&e.types?'<label class="lbl" for="n-type">Type d\'exercice</label><select class="field" id="n-type">'+e.types.map(function(t){return '<option>'+t+'</option>';}).join("")+'</select>':''; }
  sel.onchange=types; types();
  document.getElementById("note-form").addEventListener("submit",function(ev){
    ev.preventDefault();
    var v=parseFloat(String(document.getElementById("n-v").value).replace(",","."));
    if(isNaN(v)||v<0||v>20){ toast("Entre une note entre 0 et 20."); return; }
    var ty=document.getElementById("n-type");
    st().notes.push({id:uid("n"),ep:sel.value,v:v,date:document.getElementById("n-date").value,label:document.getElementById("n-label").value.trim(),com:document.getElementById("n-com").value.trim(),type:ty?ty.value:null});
    save(); closeSheet(); S.notesMode=sel.value.charAt(0)==="e"?"ecrit":"oral"; if(S.view==="notes") render(); toast("Note enregistrée.");
  });
}

/* ---------- Méthodo ---------- */
function vMethodo(){
  var m=S.methMode, eps=EPREUVES[m];
  var h=topbar("Méthodo")+'<div class="ag-head"><h1 class="large-title" style="margin:0">Méthodo</h1><div class="seg"><button class="'+(m==="ecrit"?"on":"")+'" data-a="methmode" data-m="ecrit">Écrit</button><button class="'+(m==="oral"?"on":"")+'" data-a="methmode" data-m="oral">Oral</button></div></div><p class="subtitle">À parcourir avant chaque échéance pour se remettre dans le bain.</p><div class="grid g3">';
  eps.forEach(function(e){ var s=subj(e.sub), r=(st().ressentis[e.id]||[]).length; h+='<button class="subj '+s.cls+'" style="min-height:120px" data-a="methode" data-id="'+e.id+'"><div class="row" style="justify-content:space-between"><h3>'+esc(e.name)+'</h3><span class="tag '+s.cls+'">coef. '+(e.coefTxt||e.coef)+'</span></div><p>'+(r?plural(r,"ressenti"):"Méthode, avant l'épreuve, ressenti, conseils des profs")+'</p></button>'; });
  return h+'</div>';
}
function methodeSheet(id){
  var e=EPREUVES.ecrit.concat(EPREUVES.oral).find(function(x){ return x.id===id; }), s=subj(e.sub), rs=st().ressentis[id]||[];
  var h='<div class="band '+s.cls+'"></div><div class="sheet-h"><div class="ttl"><div class="eyebrow">'+(id.charAt(0)==="e"?"Écrit":"Oral")+' · coef. '+(e.coefTxt||e.coef)+'</div><h2>'+esc(e.name)+'</h2></div><button class="icon-btn" data-a="close" aria-label="Fermer">'+I.close+'</button></div><div class="sheet-b">';
  h+='<section class="card flat"><div class="eyebrow">Méthode</div><p class="small muted" style="margin:6px 0 0">La synthèse complète de tes documents de méthodologie Drive sera rédigée ici (étape 11). Indique-moi le dossier qui les contient.</p></section>';
  h+='<section class="card flat"><div class="eyebrow">Avant l\'épreuve</div><p class="small muted" style="margin:6px 0 0">Les cinq points essentiels, à relire en deux minutes.</p></section>';
  h+='<section class="card flat"><div class="eyebrow">Mon ressenti</div><form id="res-form" style="margin-top:8px" class="stack"><textarea class="field" id="res-txt" placeholder="Ce qui a bloqué, la sensation, ce qui n\'a pas marché…"></textarea><button class="btn tint sm" type="submit" style="align-self:flex-start">Enregistrer</button></form>'+(rs.length?'<div class="notes-list" style="margin-top:8px">'+rs.slice().reverse().map(function(r){ return '<div class="it" style="display:block"><div class="small muted">'+fmtDay(r.date)+'</div><div style="white-space:pre-wrap">'+esc(r.t)+'</div></div>'; }).join("")+'</div>':'')+'</section>';
  h+='<section class="card flat"><div class="eyebrow">Conseils des profs</div><p class="small muted" style="margin:6px 0 0">'+(id.charAt(0)==="o"?"Récupérés mot pour mot dans les commentaires BJcolle (méthode uniquement), dès que BJcolle sera branché.":"Saisis-les toi-même ou envoie la photo des commentaires de ta copie.")+'</p></section></div>';
  openSheet(h);
  document.getElementById("res-form").addEventListener("submit",function(ev){ ev.preventDefault(); var v=document.getElementById("res-txt").value.trim(); if(!v) return; (st().ressentis[id]=st().ressentis[id]||[]).push({date:iso(today()),t:v}); save(); methodeSheet(id); toast("Ressenti enregistré."); });
}

/* ---------- Plus (téléphone) ---------- */
function vPlus(){
  var h=topbar("Plus")+'<h1 class="large-title">Plus</h1><p class="subtitle">Le reste de l\'app.</p><div class="stack">';
  [["todo","To-Do","Toutes tes tâches",I.list],["echeances","Échéances","DST, colles, BJcolle",I.flag],["notes","Notes","Moyennes, évolution, objectifs",I.chart],["methodo","Méthodo","Méthode par épreuve, ressentis, conseils",I.book]].forEach(function(x){
    h+='<button class="ext" data-go="'+x[0]+'" style="border:0;text-align:left"><div class="row" style="gap:14px;flex-wrap:nowrap"><span class="icon-btn" style="color:var(--blue)">'+x[3]+'</span><div><b>'+x[1]+'</b><span class="small muted">'+x[2]+'</span></div></div>'+I.right+'</button>';
  });
  return h+'</div>';
}

/* ---------- fenêtres ---------- */
function openSheet(html){
  layer.innerHTML='<div class="scrim" data-a="close"></div><div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';
  var f=layer.querySelector(".sheet input:not([type=range]),.sheet button"); if(f && window.innerWidth>=600) try{ f.focus({preventScroll:true}); }catch(e){}
}
function closeSheet(){ layer.innerHTML=""; S.timers={}; }
function quickSheet(){
  openSheet('<div class="sheet-h"><div class="ttl"><h2>Nouvelle tâche</h2><div class="small muted">Écris naturellement : date, « pour », « ! », mots-clés réf, ex, civi, DM…</div></div><button class="icon-btn" data-a="close" aria-label="Fermer">'+I.close+'</button></div><div class="sheet-b">'+quickBox("sheet")+'</div>');
  bindQuick(); var i=document.getElementById("q-sheet"); if(i) i.focus();
}
function geminiSheet(){
  openSheet('<div class="sheet-h"><div class="ttl"><div class="eyebrow" style="color:var(--blue)">Assistant</div><h2>Demander à Gemini</h2></div><button class="icon-btn" data-a="close" aria-label="Fermer">'+I.close+'</button></div><div class="sheet-b"><div class="gem-msg">L\'assistant sera actif dès que tu auras créé ta clé gratuite Google AI Studio (étape 1). Il connaîtra la page où tu te trouves : en HGG il répondra en contexte HGG, dans l\'agenda il connaîtra ta semaine.</div><form class="quick" onsubmit="return false"><input disabled placeholder="Pose ta question…" aria-label="Question"><button class="go" disabled aria-label="Envoyer">'+I.send+'</button></form></div>');
}

/* ---------- compte et synchronisation ---------- */
function syncLabel(){
  var stt=typeof Sync!=="undefined"?Sync.status():"local";
  var m={synced:["ok","Synchronisé"],syncing:["run","Synchro…"],offline:["warn","Hors ligne"],signedout:["off","Se connecter"],local:["off","Sur cet appareil"]}[stt]||["off",""];
  return '<span class="sd '+m[0]+'"></span>'+m[1];
}
function accountSheet(msg){
  var u=Sync.user(), h='<div class="sheet-h"><div class="ttl"><div class="eyebrow">Compte</div><h2>Synchronisation</h2></div><button class="icon-btn" data-a="close" aria-label="Fermer">'+I.close+'</button></div><div class="sheet-b">';
  if(!Sync.available()){
    h+='<div class="gem-msg">La synchronisation fonctionne dans l\'app installée, à l\'adresse alexandrenkvanrossum-ship-it.github.io/pr-pa. Ici, tes données restent sur cet appareil.</div>';
  } else if(u){
    h+='<div class="gem-msg"><b>'+esc(u.email)+'</b><div class="small muted" style="margin-top:4px">Tes tâches, notes, objectifs et ressentis sont synchronisés entre tes appareils.</div></div>';
    h+='<div class="row"><button class="btn tint" data-a="syncnow">Synchroniser maintenant</button><button class="btn" data-a="signout">Se déconnecter</button></div>';
  } else {
    h+='<p class="muted small" style="margin:0">Connecte-toi avec le même compte sur ton téléphone et ton ordi pour retrouver partout les mêmes données.</p>';
    h+='<form id="auth-form" class="stack" style="gap:10px"><div><label class="lbl" for="au-mail">E-mail</label><input class="field" id="au-mail" type="email" autocomplete="email" required></div><div><label class="lbl" for="au-pw">Mot de passe (8 caractères minimum)</label><input class="field" id="au-pw" type="password" minlength="8" autocomplete="current-password" required></div>'+
       '<div class="row"><button class="btn primary" type="submit" data-mode="in">Se connecter</button><button class="btn tint" type="submit" data-mode="up">Créer mon compte</button></div></form>';
  }
  if(msg) h+='<div class="note-box">'+esc(msg)+'</div>';
  h+='</div>';
  openSheet(h);
  var f=document.getElementById("auth-form");
  if(f){ var mode="in"; f.querySelectorAll("button[data-mode]").forEach(function(b){ b.addEventListener("click",function(){ mode=b.getAttribute("data-mode"); }); });
    f.addEventListener("submit",function(ev){ ev.preventDefault();
      var em=document.getElementById("au-mail").value.trim(), pw=document.getElementById("au-pw").value;
      (mode==="up"?Sync.signUp(em,pw):Sync.signIn(em,pw)).then(function(r){
        if(r.error){ accountSheet(r.error.message==="Invalid login credentials"?"E-mail ou mot de passe incorrect.":r.error.message); return; }
        if(mode==="up" && !(r.data&&r.data.session)){ accountSheet("Compte créé. Ouvre l'e-mail de confirmation reçu, puis reviens te connecter ici."); return; }
        closeSheet(); render(); toast("Connecté. Synchronisation en cours.");
      });
    });
  }
}

/* ---------- chronos ---------- */
var tickH=null;
function tickTimers(){
  if(tickH) clearInterval(tickH);
  tickH=setInterval(function(){
    document.querySelectorAll(".timer.run").forEach(function(b){ var k=b.getAttribute("data-k"), t0=S.timers[k]; if(!t0) return; var s=Math.floor((Date.now()-t0)/1000); b.textContent=Math.floor(s/60)+":"+pad(s%60); });
  },1000);
}

/* ---------- actions ---------- */
document.addEventListener("click",function(ev){
  var g=ev.target.closest("[data-go]"); if(g){ ev.preventDefault(); closeSheet(); go(g.getAttribute("data-go"),g.getAttribute("data-p")); return; }
  var b=ev.target.closest("[data-a]"); if(!b) return;
  var a=b.getAttribute("data-a"), s=st();
  if(a==="close"){ closeSheet(); render(); return; }
  if(a==="quick"){ quickSheet(); return; }
  if(a==="gemini"){ geminiSheet(); return; }
  if(a==="account"){ accountSheet(); return; }
  if(a==="syncnow"){ Sync.syncNow().then(function(){ toast("Synchronisé."); }); return; }
  if(a==="signout"){ Sync.signOut().then(function(){ closeSheet(); render(); toast("Déconnecté. Tes données restent sur cet appareil."); }); return; }
  if(a==="toggle"){ var t=s.tasks.find(function(x){return x.id===b.getAttribute("data-id");}); if(t){ t.done=!t.done; t.doneAt=t.done?new Date().toISOString():null; save(); render(); } return; }
  if(a==="del"){ s.tasks=s.tasks.filter(function(x){return x.id!==b.getAttribute("data-id");}); save(); render(); toast("Tâche supprimée."); return; }
  if(a==="tfilter"){ S.todoFilter=b.getAttribute("data-f"); render(); return; }
  if(a==="csh-skip"){ s.cshSkip=(s.cshSkip||0)+1; save(); render(); return; }
  if(a==="agmode"){ S.agMode=b.getAttribute("data-m"); render(); return; }
  if(a==="agstep"){ S.agDate=iso(addDays(parseISO(S.agDate),+b.getAttribute("data-n"))); render(); return; }
  if(a==="agtoday"){ S.agDate=iso(today()); render(); return; }
  if(a==="agday"){ S.agDate=b.getAttribute("data-d"); render(); return; }
  if(a==="slot"){ openSlot(b.getAttribute("data-d"),b.getAttribute("data-id")); return; }
  if(a==="road"||a==="timer"||a==="partial"){
    var cur=layer.querySelector(".sheet"); var reopen=cur?cur.innerHTML:"";
    var tid=b.getAttribute("data-task"), k=b.getAttribute("data-k");
    if(a==="road"){
      if(tid){ var tk=s.tasks.find(function(x){return x.id===tid;}); if(tk){ tk.done=!tk.done; if(S.timers[k]){ tk.spent=(tk.spent||0)+Math.round((Date.now()-S.timers[k])/60000); delete S.timers[k]; } } }
      else { s.slotDone[k]=!s.slotDone[k]; delete S.timers[k]; }
      save();
    } else if(a==="timer"){ if(S.timers[k]) delete S.timers[k]; else S.timers[k]=Date.now(); }
    else { var tp=s.tasks.find(function(x){return x.id===tid;}); if(tp){ tp.progress=+b.getAttribute("data-v"); save(); toast("Noté : "+tp.progress+" % fait. Le reste sera replanifié."); } }
    var keep=S.timers; var m=reopen.match(/data-d="([^"]+)" data-id/) ;
    var last=layer.getAttribute("data-slot"); if(last){ var p=last.split("§"); openSlot(p[0],p[1]); S.timers=keep; tickTimers(); var sh=layer.querySelector(".sheet"); if(sh) sh.style.animation="none"; }
    return;
  }
  if(a==="echmode"){ S.echMode=b.getAttribute("data-m"); render(); return; }
  if(a==="notesmode"){ S.notesMode=b.getAttribute("data-m"); render(); return; }
  if(a==="methmode"){ S.methMode=b.getAttribute("data-m"); render(); return; }
  if(a==="notedetail"){ noteDetail(b.getAttribute("data-id")); return; }
  if(a==="addnote"){ addNoteSheet(b.getAttribute("data-ep")); return; }
  if(a==="delnote"){ s.notes=s.notes.filter(function(n){return n.id!==b.getAttribute("data-id");}); save(); noteDetail(b.getAttribute("data-ep")); render(); return; }
  if(a==="methode"){ methodeSheet(b.getAttribute("data-id")); return; }
});
document.addEventListener("input",function(ev){
  var r=ev.target.closest("[data-goal]"); if(!r) return;
  st().goals[r.getAttribute("data-goal")]=+r.value; save();
  var v=document.getElementById("goal-val"); if(v) v.textContent=f1(+r.value);
});
document.addEventListener("change",function(ev){ var r=ev.target.closest("[data-goal]"); if(r){ noteDetail(r.getAttribute("data-goal")); render(); } });
document.addEventListener("keydown",function(ev){ if(ev.key==="Escape" && layer.innerHTML){ closeSheet(); render(); } });
window.addEventListener("scroll",function(){ var tb=document.getElementById("topbar"); if(tb) tb.classList.toggle("scrolled",window.scrollY>40); },{passive:true});

/* mémorise le créneau ouvert pour pouvoir le rafraîchir */
var _openSlot=openSlot;
openSlot=function(d,id){ _openSlot(d,id); layer.setAttribute("data-slot",d+"§"+id); };
var _close=closeSheet;
closeSheet=function(){ _close(); layer.removeAttribute("data-slot"); };

/* ---------- démarrage ---------- */
function start(){
  shell(); seed();
  window.__prepaRefresh=function(){ var a=document.activeElement; if(layer.innerHTML || (a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) return; render(); };
  if(typeof Sync!=="undefined"){ Sync.on(function(){ var p=document.getElementById("sync-pill"); if(p) p.innerHTML=syncLabel(); }); Sync.init(); }
  var h=(location.hash||"").replace("#",""); if(h){ var p=h.split("-"); if(["home","agenda","todo","matieres","matiere","echeances","notes","methodo","plus"].indexOf(p[0])>=0){ S.view=p[0]; S.param=p[1]||null; } }
  render();
  if("serviceWorker" in navigator && location.protocol==="https:" && !window.claude){ try{ navigator.serviceWorker.register("sw.js").catch(function(){}); }catch(e){} }
}
if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",start); else start();
})();

</script>
</body></html>
